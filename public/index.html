<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaSheet</title>
  <style>
    :root {
      --ms-bg-window: #1D1F26;
      --ms-bg-base: #272A33;
      --ms-bg-preview: #13141A;
      --ms-primary: #284CB8;
      --ms-primary-light: #476BD7;
      --ms-primary-lighter: #718CDC;
      --ms-primary-dark: #213E97;
      --ms-text: #FFFFFF;
      --ms-text-muted: #969696;
      --ms-danger: #C01C37;
      --ms-warning: #B88A16;
      --ms-success: #25A231;
      --ms-border: #3C404D;
      --ms-input-bg: #3C404D;
      --ms-button-bg: #3C404D;
      --ms-button-hover: #464B59;
      --ms-button-down: #1D1F26;
      --ms-tally-pgm: #C01C37;
      --ms-tally-pvw: #25A231;
      --ms-radius: 4px;
      --ms-radius-sm: 2px;
      --ms-radius-lg: 6px;
      --ms-font: 'Open Sans', '.AppleSystemUIFont', Helvetica, Arial, 'MS Shell Dlg', sans-serif;
    }

    /* === Reset + Base === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--ms-font);
      background: var(--ms-bg-window);
      color: var(--ms-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* === Top Bar === */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 12px;
      background: var(--ms-bg-base);
      border-bottom: 1px solid var(--ms-border);
      flex-shrink: 0;
    }

    .top-bar-center, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected { background: var(--ms-success); }
    .status-dot.reconnecting { background: var(--ms-warning); }
    .status-dot.disconnected { background: var(--ms-danger); }

    .server-status {
      color: var(--ms-warning);
      font-size: 11px;
    }

    /* === Buttons === */
    .btn {
      background: var(--ms-button-bg);
      color: var(--ms-text);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius);
      padding: 4px 12px;
      cursor: pointer;
      font-family: var(--ms-font);
      font-size: 12px;
      line-height: 1.4;
    }
    .btn:hover { background: var(--ms-button-hover); }
    .btn:active { background: var(--ms-button-down); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn:disabled:hover { background: var(--ms-button-bg); }
    .btn.busy { opacity: 0.6; }

    /* === Audio readout === */
    .audio-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 24px;
      padding: 0 12px;
      background: var(--ms-bg-base);
      border-top: 1px solid var(--ms-border);
      flex-shrink: 0;
      font-size: 11px;
      color: var(--ms-text-muted);
    }
    .audio-item { background: none; border: none; color: inherit; font: inherit; padding: 0; display: flex; gap: 5px; min-width: 0; align-items: center; }
    button.audio-item { cursor: pointer; }
    .audio-item strong { color: var(--ms-text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 210px; }
    .audio-item.ok strong { color: #5CD46A; }
    .audio-item.warn strong { color: #E8B93A; }
    .audio-pop.above-bar { bottom: 64px; }

    /* === Live clip transport === */
    .live-transport {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      background: var(--ms-bg-base);
      border-top: 1px solid var(--ms-border);
      flex-shrink: 0;
      font-size: 12px;
    }
    .live-transport .btn-icon { font-size: 15px; min-width: 28px; }
    .lt-tag {
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: var(--ms-radius-sm);
      background: var(--ms-tally-pgm);
      font-size: 10px;
      font-weight: 700;
    }
    .lt-name { flex: 0 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lt-time { flex-shrink: 0; color: var(--ms-text-muted); font-variant-numeric: tabular-nums; }
    .lt-seek { flex: 1; min-width: 80px; accent-color: var(--ms-primary-light); }

    /* === Music strip === */
    .music-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 12px;
      background: var(--ms-bg-base);
      border-top: 1px solid var(--ms-border);
      flex-shrink: 0;
      font-size: 12px;
    }
    .music-strip .btn-icon { font-size: 15px; min-width: 28px; }
    .mu-tag {
      flex-shrink: 0;
      padding: 1px 6px;
      border-radius: var(--ms-radius-sm);
      background: var(--ms-primary-dark);
      font-size: 11px;
      font-weight: 700;
    }
    .mu-track {
      flex: 0 1 230px;
      min-width: 0;
      height: 24px;
      background: var(--ms-bg-raised, #1f2430);
      color: inherit;
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-sm);
      font-size: 12px;
    }
    .mu-time { flex-shrink: 0; color: var(--ms-text-muted); font-variant-numeric: tabular-nums; }
    .mu-seek { flex: 1; min-width: 60px; accent-color: var(--ms-primary-light); }
    .mu-vol { flex: 0 0 72px; accent-color: var(--ms-primary-light); }
    .mu-warn { flex: 1; color: #E8B93A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .music-strip.off > :not(.mu-tag):not(.mu-warn) { display: none; }

    /* === Playlist options popover + AUTO badge === */
    .auto-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 3;
      padding: 1px 6px;
      border-radius: var(--ms-radius-sm);
      background: #1A7F25;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .subgrid-head .auto-badge { position: static; align-self: center; margin-right: 8px; }
    .auto-badge.held { background: #B7791F; }
    .auto-badge.locked { background: #B3261E; }
    .lock-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 12px;
      background: #B3261E;
      color: #fff;
      font-size: 12px;
      flex-shrink: 0;
    }
    .lock-banner .lock-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lock-banner.flash { animation: lock-flash 0.6s; }
    @keyframes lock-flash { 0%, 100% { background: #B3261E; } 40% { background: #FF6B5E; } }
    .lock-banner .lock-unlock { background: rgba(0,0,0,0.35); border-color: rgba(255,255,255,0.6); color: #fff; }
    body.ms-locked .tile:not(.pl-locked-tile), body.ms-locked .clip-tile, body.ms-locked .btn-transition { opacity: 0.55; cursor: not-allowed; }
    .pl-menu {
      position: fixed;
      z-index: 60;
      width: 280px;
      padding: 10px 12px;
      background: var(--ms-bg-raised, #1f2430);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-lg);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      font-size: 12px;
    }
    .pl-menu-title { font-weight: 700; margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pl-menu label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .pl-menu select { margin-left: auto; background: var(--ms-bg-base); color: inherit; border: 1px solid var(--ms-border); border-radius: var(--ms-radius-sm); height: 24px; }
    .pl-menu .pl-note { margin: 8px 0 0; color: var(--ms-text-muted); line-height: 1.35; }
    .pl-menu .pl-msg { margin: 8px 0 0; color: #E8B93A; line-height: 1.35; }

    .btn-primary {
      background: var(--ms-primary);
      border-color: var(--ms-primary-dark);
    }
    .btn-primary:hover { background: var(--ms-primary-light); }

    .btn-icon {
      padding: 4px 6px;
      border: none;
      background: transparent;
    }
    .btn-icon:hover { background: var(--ms-button-hover); }

    .btn-transition {
      font-weight: 700;
      min-width: 50px;
      text-align: center;
    }

    .duration-input {
      width: 60px;
      background: var(--ms-input-bg);
      color: var(--ms-text);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-sm);
      padding: 3px 6px;
      font-family: var(--ms-font);
      font-size: 12px;
      text-align: center;
    }
    .duration-label {
      font-size: 11px;
      color: var(--ms-text-muted);
    }

    /* === Tile Grid === */
    #tile-grid {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      align-content: start;
      /* Rows size to their content; otherwise a tall sub-grid makes the grid squeeze every tile row to fit */
      grid-auto-rows: max-content;
    }

    /* === Tile === */
    .tile {
      background: var(--ms-bg-base);
      border: 2px solid var(--ms-border);
      border-radius: var(--ms-radius-lg);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
    }
    .tile.tally-pgm { border-color: var(--ms-tally-pgm); }
    .tile.tally-pvw { border-color: var(--ms-tally-pvw); }

    .tile-thumbnail {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--ms-bg-preview);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .tile-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .tile-thumbnail .fallback-icon {
      font-size: 32px;
      color: var(--ms-text-muted);
    }

    .tile-label {
      padding: 4px 8px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* === Transport Controls (media tiles only) === */
    .tile-transport {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px 8px;
    }
    .tile-transport .btn-transport {
      background: none;
      border: none;
      color: var(--ms-text);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: var(--ms-radius-sm);
      font-size: 14px;
      line-height: 1;
    }
    .tile-transport .btn-transport:hover { background: var(--ms-button-hover); }
    .tile-transport .btn-transport.active { color: var(--ms-text-muted); }

    /* === Progress Bar === */
    .tile-progress {
      padding: 2px 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--ms-bg-preview);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--ms-primary-light);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s linear;
    }
    .progress-time {
      font-size: 10px;
      color: var(--ms-text-muted);
      white-space: nowrap;
      min-width: 80px;
      text-align: right;
    }

    /* === Audio Controls === */
    .tile-audio {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px 6px;
    }
    .btn-mute {
      background: none;
      border: none;
      color: var(--ms-text);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
    }
    .btn-mute.muted { color: var(--ms-danger); }
    .volume-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--ms-bg-preview);
      border-radius: 2px;
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ms-primary-light);
      cursor: pointer;
    }

    /* === Playlist Sub-grid === */
    .tile { position: relative; }
    .btn-clips {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0,0,0,0.6);
      color: var(--ms-text);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-sm);
      font-size: 10px;
      padding: 1px 6px;
      cursor: pointer;
    }
    .btn-clips.on { background: var(--ms-primary); border-color: var(--ms-primary-dark); }
    /* A playlist's scene tile and its box are one shape: same outline color, same flat fill, the tile overlapping the box's top border */
    .subgrid-row {
      --pl-color: var(--ms-border);
      --pl-tint: var(--ms-bg-preview);
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px;
      background: var(--pl-tint);
      border: 2px solid var(--pl-color);
      border-radius: var(--ms-radius-lg);
    }
    .tile.pl {
      --pl-color: var(--ms-border);
      --pl-tint: var(--ms-bg-preview);
      background: var(--pl-tint);
      border-color: var(--pl-color);
      padding: 6px;
    }
    .tile.pl.tally-pgm, .tile.pl.tally-pvw { border-color: var(--pl-color); }
    .tile.pl .tile-thumbnail { border-radius: var(--ms-radius); overflow: hidden; }
    .tile.pl-open {
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      position: relative;
      z-index: 2;
      margin-bottom: -10px; /* grid gap (8) + the box's top border (2) */
      padding-bottom: 16px;
    }
    .tile.pl .tile-label::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--pl-color);
    }
    /* === LIVE / CUED strip === */
    .lc-strip {
      flex-shrink: 0;
      height: 36px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 8px 0;
      padding: 0 10px;
      background: var(--ms-bg-base);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-lg);
      font-size: 12px;
    }
    .lc-tag { padding: 1px 6px; border-radius: var(--ms-radius-sm); font-size: 10px; font-weight: 700; }
    .lc-tag.live { background: var(--ms-tally-pgm); }
    .lc-tag.cued { background: #1A7F25; }
    .lc-thumb { width: 34px; height: 20px; flex-shrink: 0; border-radius: var(--ms-radius-sm); background: #000 center / cover no-repeat; border: 1px solid var(--ms-border); }
    .lc-name { min-width: 0; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lc-spacer { flex: 1; }

    /* A thumbnail must not start its own image drag: the tile or clip is what gets dragged */
    .tile img, .clip-tile img { -webkit-user-drag: none; pointer-events: none; }
    /* Insert marker: a bar on the edge where the dragged tile or clip will land */
    .tile.drop-before, .tile.drop-after, .clip-tile.drop-before, .clip-tile.drop-after { position: relative; }
    .tile.drop-before::after, .tile.drop-after::after, .clip-tile.drop-before::after, .clip-tile.drop-after::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      border-radius: 2px;
      background: var(--ms-primary-lighter);
      pointer-events: none;
      z-index: 5;
    }
    .tile.drop-before::after, .clip-tile.drop-before::after { left: -3px; }
    .tile.drop-after::after, .clip-tile.drop-after::after { right: -3px; }
    .tile.pl.tally-pgm .tile-label::before { background: #FF4D6A; }
    .tile.pl .tile-label::after { content: attr(data-sub); float: right; font-size: 10px; color: var(--ms-text-muted); padding-top: 3px; }
    .btn-collapse {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      width: 24px;
      height: 24px;
      padding: 0;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: var(--ms-radius);
      cursor: pointer;
    }
    .btn-collapse:hover { background: rgba(0,0,0,0.85); border-color: #fff; }
    .btn-collapse span {
      display: block;
      width: 7px;
      height: 7px;
      margin: 5px auto 0;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(45deg);
    }
    .tile.pl-collapsed .btn-collapse span { transform: rotate(-45deg); margin-left: 8px; }
    .tile.pl.tally-pvw .tile-label::before { background: #5CD46A; }
    .subgrid-title {
      width: 100%;
      font-size: 10px;
      color: var(--ms-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .clip-tile {
      width: 128px;
      background: var(--ms-bg-base);
      border: 2px solid var(--ms-border);
      border-radius: var(--ms-radius);
      overflow: hidden;
      user-select: none;
      position: relative;
    }
    .clip-tile.cueable { cursor: pointer; }
    .clip-tile.tally-pgm { border-color: var(--ms-tally-pgm); }
    .clip-tile.tally-pvw { border-color: var(--ms-tally-pvw); }
    .clip-badge {
      position: absolute;
      top: 3px;
      left: 3px;
      font-size: 9px;
      font-weight: 700;
      padding: 0 4px;
      border-radius: var(--ms-radius-sm);
      background: rgba(0,0,0,0.7);
    }
    .clip-tile.tally-pgm .clip-badge { background: var(--ms-tally-pgm); }
    .clip-tile.tally-pvw .clip-badge { background: var(--ms-tally-pvw); }
    .clip-badge:empty { display: none; }
    .clip-tile.cueing { opacity: 0.6; }
    .audio-chip {
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 10px;
      border: 1px solid var(--ms-border);
      background: var(--ms-button-bg);
      color: var(--ms-text);
      cursor: pointer;
    }
    .audio-chip.ok { background: var(--ms-success); border-color: var(--ms-success); }
    .audio-chip.warn { background: var(--ms-warning); border-color: var(--ms-warning); }
    .audio-pop {
      position: fixed;
      bottom: 36px;
      left: 8px;
      z-index: 150;
      max-width: 360px;
      padding: 8px 10px;
      font-size: 11px;
      background: var(--ms-bg-base);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-lg);
    }
    .audio-pop li { margin: 3px 0 3px 14px; }
    .audio-pop .small { color: var(--ms-text-muted); margin-top: 4px; }
    .clip-route {
      width: 100%;
      font-size: 10px;
      background: var(--ms-input-bg);
      color: var(--ms-text);
      border: none;
      border-top: 1px solid var(--ms-border);
      padding: 2px 4px;
    }
    .clip-route:disabled { opacity: 0.5; }
    .clip-silent {
      position: absolute;
      bottom: 22px;
      left: 3px;
      font-size: 9px;
      font-weight: 700;
      padding: 0 4px;
      border-radius: var(--ms-radius-sm);
      background: var(--ms-danger);
    }
    .clip-silent:empty { display: none; }
    .clip-add {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      font-size: 28px;
      color: var(--ms-text-muted);
      cursor: pointer;
      border-style: dashed;
    }
    .clip-add:hover { color: var(--ms-text); border-color: var(--ms-primary-light); }
    .subgrid-head { width: 100%; display: flex; align-items: center; gap: 8px; }
    .subgrid-head .subgrid-title { width: auto; flex: 1; }
    .btn-manage {
      font-size: 10px;
      padding: 1px 8px;
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-sm);
      background: var(--ms-button-bg);
      color: var(--ms-text);
      cursor: pointer;
    }
    .btn-manage.on { background: var(--ms-primary); border-color: var(--ms-primary-dark); }
    .pileup {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      font-size: 11px;
      background: var(--ms-warning);
      border-radius: var(--ms-radius-sm);
    }
    .clip-restart {
      position: absolute;
      top: 3px;
      right: 3px;
      background: rgba(0,0,0,0.7);
      color: var(--ms-text);
      border: none;
      border-radius: var(--ms-radius-sm);
      font-size: 11px;
      line-height: 1;
      padding: 2px 5px;
      cursor: pointer;
    }
    .clip-restart:hover { background: var(--ms-primary); }
    .clip-name {
      padding: 2px 6px;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .clip-meter {
      height: 3px;
      background: var(--ms-bg-preview);
    }
    .clip-meter-fill {
      height: 100%;
      width: 0%;
      background: var(--ms-success);
    }

    /* Author display rules (e.g. .modal-overlay flex) otherwise override the UA [hidden] style */
    [hidden] { display: none !important; }

    /* === Modals === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--ms-bg-base);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-lg);
      padding: 20px;
      min-width: 320px;
      max-width: 480px;
    }
    .modal h3 {
      margin-bottom: 16px;
      font-size: 15px;
    }
    .modal label {
      display: block;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--ms-text-muted);
    }
    .modal input[type="text"],
    .modal input[type="number"],
    .modal input[type="password"] {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 6px 8px;
      background: var(--ms-input-bg);
      color: var(--ms-text);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius);
      font-family: var(--ms-font);
      font-size: 13px;
    }
    .password-row {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .password-row input { flex: 1; }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    /* === Picker Modal === */
    #picker-list {
      list-style: none;
      margin: 12px 0;
      max-height: 300px;
      overflow-y: auto;
    }
    #picker-list li {
      padding: 8px;
      border-radius: var(--ms-radius);
      cursor: pointer;
      font-size: 12px;
      border: 1px solid transparent;
    }
    #picker-list li:hover { background: var(--ms-button-hover); }
    .picker-path { word-break: break-all; }
    .picker-meta { color: var(--ms-text-muted); font-size: 11px; margin-top: 2px; }

    /* === Context Menu === */
    .context-menu {
      position: fixed;
      background: var(--ms-bg-base);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius);
      z-index: 200;
      min-width: 140px;
    }
    .context-menu-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: none;
      border: none;
      color: var(--ms-text);
      font-family: var(--ms-font);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
    .context-menu-item:hover { background: var(--ms-button-hover); }

    /* === Bottom Bar === */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 32px;
      padding: 0 12px;
      background: var(--ms-bg-base);
      border-top: 1px solid var(--ms-border);
      flex-shrink: 0;
      font-size: 12px;
    }
    .pgm-label strong { color: var(--ms-tally-pgm); }
    .pvw-label strong { color: var(--ms-tally-pvw); }
    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .last-event {
      margin-left: auto;
      color: var(--ms-text-muted);
      font-size: 10px;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <!-- Playback lock: shown while a locked autoplay playlist is live on Program -->
  <div id="lock-banner" class="lock-banner" hidden>
    <strong>🔒 PLAYBACK LOCKED</strong>
    <span id="lock-text" class="lock-text"></span>
    <button id="lock-unlock" class="btn lock-unlock">Unlock</button>
  </div>

  <header id="top-bar">
    <div class="top-bar-center">
      <button id="btn-add-input" class="btn" disabled>Add Input</button>
      <button id="btn-hold-frames" class="btn" disabled title="Make every media source in OBS hold its last frame instead of going black">Hold Frames</button>
      <input type="file" id="file-input" accept="video/*,audio/*,image/*" hidden>
    </div>
    <div class="top-bar-right">
      <button id="btn-cut" class="btn btn-transition" disabled>CUT</button>
      <button id="btn-fade" class="btn btn-transition" disabled>FADE</button>
      <input type="number" id="fade-duration" class="duration-input" value="300" min="50" max="5000" step="50" title="Fade duration (ms)">
      <span class="duration-label">ms</span>
      <button id="btn-stinger" class="btn btn-transition" disabled title="Uses the Stinger transition in OBS (add one under Scene Transitions)">STINGER</button>
      <button id="btn-settings" class="btn btn-icon" title="Settings">⚙</button>
    </div>
  </header>

  <!-- Tile Grid -->
  <!-- What is on Program and what CUT will take, always in view while the grid scrolls -->
  <div id="lc-strip" class="lc-strip" hidden>
    <span class="lc-tag live">LIVE</span>
    <span id="lc-live-thumb" class="lc-thumb"></span>
    <span id="lc-live-name" class="lc-name"></span>
    <span class="lc-spacer"></span>
    <span class="lc-tag cued">CUED</span>
    <span id="lc-cued-thumb" class="lc-thumb"></span>
    <span id="lc-cued-name" class="lc-name"></span>
  </div>

  <main id="tile-grid"></main>

  <!-- Disambiguation Picker Modal -->
  <div id="picker-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3>Multiple files found</h3>
      <p id="picker-filename"></p>
      <ul id="picker-list"></ul>
      <button id="picker-cancel" class="btn">Cancel</button>
    </div>
  </div>

  <!-- Connection Config Modal -->
  <div id="config-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3>OBS Connection</h3>
      <label>
        Host
        <input type="text" id="config-host" value="localhost" autocomplete="off">
      </label>
      <label>
        Port
        <input type="number" id="config-port" value="4455" min="1" max="65535">
      </label>
      <label>
        Password
        <div class="password-row">
          <input type="password" id="config-password" autocomplete="off" placeholder="(leave empty if none)">
          <button id="btn-toggle-password" class="btn btn-icon" type="button">👁</button>
        </div>
      </label>
      <label>
        Expected FoH device (OBS Monitoring Device)
        <input type="text" id="config-device" value="External Headphones" autocomplete="off">
      </label>
      <label>
        Clip audio fade (ms, 0 = off)
        <input type="number" id="config-audio-fade" value="400" min="0" max="3000" step="50">
      </label>
      <div class="modal-actions">
        <button id="btn-connect" class="btn btn-primary">Connect</button>
        <button id="btn-disconnect" class="btn" hidden>Disconnect</button>
        <button id="btn-config-close" class="btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Context Menu (right-click on tile) -->
  <div id="context-menu" class="context-menu" hidden>
    <button id="ctx-remove" class="context-menu-item">Remove Input</button>
  </div>

  <!-- Music: background audio on its own OBS player source (see obs-scripts/mediasheet-music.lua); never part of a scene, cut or fade -->
  <div id="music-strip" class="music-strip" hidden>
    <span class="mu-tag">♪</span>
    <select id="mu-track" class="mu-track" title="Background music track (grouped per scene)"></select>
    <button id="mu-toggle" class="btn btn-icon" title="Play / pause the music">▶</button>
    <button id="mu-restart" class="btn btn-icon" title="Restart the track">↺</button>
    <span id="mu-time" class="mu-time">0:00 / 0:00</span>
    <input type="range" id="mu-seek" class="mu-seek" min="0" max="1000" value="0" title="Seek">
    <input type="range" id="mu-vol" class="mu-vol" min="0" max="100" value="89" title="Music volume">
    <button id="mu-loop" class="btn btn-icon" title="Loop the track">⟳</button>
    <span id="mu-warn" class="mu-warn" hidden></span>
  </div>

  <!-- Live clip transport: acts on the clip live on Program, not on OBS's selected source -->
  <div id="live-transport" class="live-transport" hidden>
    <span class="lt-tag">PGM</span>
    <button id="lt-toggle" class="btn btn-icon" title="Pause / play the clip on Program">⏸</button>
    <button id="lt-restart" class="btn btn-icon" title="Restart the clip on Program from the start">↺</button>
    <span id="lt-name" class="lt-name"></span>
    <span id="lt-time" class="lt-time">0:00 / 0:00</span>
    <input type="range" id="lt-seek" class="lt-seek" min="0" max="1000" value="0" title="Seek (OBS snaps to the nearest earlier keyframe)">
  </div>

  <!-- Audio readout: OBS cannot be told to change its Monitoring Device remotely, so this only shows it -->
  <div id="audio-bar" class="audio-bar" hidden>
    <button id="audio-monitor" class="audio-item" title="Click for how to change it"><span>Monitor (House Audio):</span> <strong id="audio-monitor-name">—</strong></button>
    <span id="audio-default" class="audio-item"><span>Default Output:</span> <strong id="audio-default-name">—</strong></span>
  </div>
  <div id="monitor-pop" class="audio-pop above-bar" hidden></div>

  <!-- Bottom Bar -->
  <footer id="bottom-bar">
    <span class="pgm-label">PGM: <strong id="pgm-name">—</strong></span>
    <span class="pvw-label">PVW: <strong id="pvw-name">—</strong></span>
    <button id="audio-chip" class="audio-chip" hidden></button>
    <span id="last-event" class="last-event"></span>
    <span id="server-status" class="server-status" hidden>Server offline</span>
    <span class="connection-status">
      <span id="connection-dot" class="status-dot disconnected"></span>
      <span id="connection-text">Disconnected</span>
    </span>
    <button id="btn-reload" class="btn btn-icon" title="Reload MediaSheet">↻</button>
  </footer>
  <div id="audio-pop" class="audio-pop" hidden></div>

  <script src="vendor/obs-websocket-js.min.js"></script>
  <script src="playlist.js"></script>
  <script>
    const MS = {};
    const EVENT_SUBSCRIPTIONS = 4095 | (1 << 16) | (1 << 17);

    // ===== Connection Manager =====
    MS.connection = (() => {
      const obs = new OBSWebSocket();
      let connected = false;
      let reconnectTimer = null;
      let reconnectDelay = 1000;
      let heartbeatTimer = null;
      let heartbeatTimeout = null;

      const MAX_RECONNECT_DELAY = 15000;
      const HEARTBEAT_INTERVAL = 10000;
      const HEARTBEAT_TIMEOUT = 5000;

      const dot = document.getElementById('connection-dot');
      const text = document.getElementById('connection-text');

      function setStatus(state, label) {
        dot.className = 'status-dot ' + state;
        text.textContent = label;
      }

      function getConfig() {
        try {
          return JSON.parse(localStorage.getItem('ms_connection')) || {};
        } catch { return {}; }
      }

      function saveConfig(host, port, password) {
        localStorage.setItem('ms_connection', JSON.stringify({ host, port, password }));
      }

      async function connect(host, port, password) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;

        host = host || 'localhost';
        port = port || 4455;

        setStatus('reconnecting', `Connecting to ${host}:${port}...`);

        try {
          const url = `ws://${host}:${port}`;
          await obs.connect(url, password || undefined, {
            rpcVersion: 1,
            eventSubscriptions: EVENT_SUBSCRIPTIONS,
          });
          connected = true;
          reconnectDelay = 1000;
          saveConfig(host, port, password);
          setStatus('connected', `${host}:${port}`);
          startHeartbeat();
          if (MS.connection.onConnect) MS.connection.onConnect();
        } catch (err) {
          connected = false;
          if (err.code === 4009) {
            // Auth required
            setStatus('disconnected', 'Auth required');
            MS.configModal.show(true);
            return;
          }
          setStatus('disconnected', `Failed: ${err.message}`);
          scheduleReconnect(host, port, password);
        }
      }

      function scheduleReconnect(host, port, password) {
        if (reconnectTimer) return;
        setStatus('reconnecting', `Reconnecting in ${Math.round(reconnectDelay / 1000)}s...`);
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect(host, port, password);
        }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
      }

      function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(async () => {
          try {
            heartbeatTimeout = setTimeout(() => {
              console.warn('OBS heartbeat timeout — treating as disconnected');
              obs.disconnect();
            }, HEARTBEAT_TIMEOUT);
            await obs.call('GetVersion');
            clearTimeout(heartbeatTimeout);
          } catch {
            clearTimeout(heartbeatTimeout);
          }
        }, HEARTBEAT_INTERVAL);
      }

      function stopHeartbeat() {
        clearInterval(heartbeatTimer);
        clearTimeout(heartbeatTimeout);
      }

      async function disconnect() {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        stopHeartbeat();
        connected = false;
        try { await obs.disconnect(); } catch {}
        setStatus('disconnected', 'Disconnected');
        if (MS.connection.onDisconnect) MS.connection.onDisconnect();
      }

      obs.on('ConnectionClosed', () => {
        if (!connected) return;
        connected = false;
        stopHeartbeat();
        setStatus('disconnected', 'Connection lost');
        const cfg = getConfig();
        scheduleReconnect(cfg.host, cfg.port, cfg.password);
        if (MS.connection.onDisconnect) MS.connection.onDisconnect();
      });

      return {
        obs,
        get connected() { return connected; },
        connect,
        disconnect,
        getConfig,
        onConnect: null,
        onDisconnect: null,
      };
    })();

    // ===== OBS-side Store =====
    // Lives in OBS persistent data so the OBS dock and any browser tab agree.
    // What is being dragged right now: { kind: 'scene' | 'clip', id, scene? }
    MS.drag = null;

    MS.store = (() => {
      const REALM = 'OBS_WEBSOCKET_DATA_REALM_GLOBAL';
      const SLOT = 'mediasheet';
      const FALLBACK_KEY = 'ms_store';
      const DEFAULT_DEVICE = 'External Headphones';
      let data = normalize(null);

      function normalize(v) {
        // Keys this version does not know survive: a dock still running older code would otherwise drop them (e.g. musicGain) on its next write
        const unknown = v && typeof v === 'object' && !Array.isArray(v) ? v : {};
        return {
          ...unknown,
          // Video playlists are managed unless listed in `unmanaged`; image playlists only when listed in `managed` (their idle reset hides images, which would blank a scene that shows several at once)
          managed: Array.isArray(v?.managed) ? v.managed : [],
          unmanaged: Array.isArray(v?.unmanaged) ? v.unmanaged : [],
          // Scenes whose box is folded away; everything is open by default
          collapsed: Array.isArray(v?.collapsed) ? v.collapsed : [],
          // Display order, kept here because OBS cannot reorder scenes and its item order is the layer order
          sceneOrder: Array.isArray(v?.sceneOrder) ? v.sceneOrder : [],
          clipOrder: v?.clipOrder && typeof v.clipOrder === 'object' ? v.clipOrder : {},
          subgrid: v?.subgrid && typeof v.subgrid === 'object' ? v.subgrid : {},
          streamOnly: Array.isArray(v?.streamOnly) ? v.streamOnly : [],
          // Per playlist scene: autoplay (set and forget), loop the playlist, and the transition between clips
          playlistOptions: Object.fromEntries(Object.entries(v?.playlistOptions && typeof v.playlistOptions === 'object' ? v.playlistOptions : {}).map(([scene, o]) => [scene, {
            // Unknown fields survive (a newer field must not be stripped by an older dock)
            ...(o && typeof o === 'object' ? o : {}),
            autoplay: o?.autoplay === true,
            // Playback lock: while this playlist is live on Program, MediaSheet ignores presses on other scenes, clips and the transition buttons
            lock: o?.lock === true,
            loop: o?.loop !== false,
            transition: ['cut', 'fade', 'stinger'].includes(o?.transition) ? o.transition : 'fade',
          }])),
          // Music volume per track file (a multiplier), so each song comes up at its own level
          musicGain: v?.musicGain && typeof v.musicGain === 'object'
            ? Object.fromEntries(Object.entries(v.musicGain).filter(([, n]) => typeof n === 'number' && n >= 0 && n <= 20))
            : {},
          expectedDevice: typeof v?.expectedDevice === 'string' && v.expectedDevice
            ? v.expectedDevice
            : DEFAULT_DEVICE,
          audioFadeMs: Number.isFinite(v?.audioFadeMs) && v.audioFadeMs >= 0 ? Math.min(v.audioFadeMs, 3000) : 400,
          fadeRestore: v?.fadeRestore && typeof v.fadeRestore === 'object'
            ? Object.fromEntries(Object.entries(v.fadeRestore).filter(([, n]) => typeof n === 'number'))
            : {},
        };
      }

      async function load() {
        try {
          const { slotValue } = await MS.connection.obs.call('GetPersistentData', { realm: REALM, slotName: SLOT });
          data = normalize(slotValue);
        } catch {
          try { data = normalize(JSON.parse(localStorage.getItem(FALLBACK_KEY))); } catch { data = normalize(null); }
        }
        return data;
      }

      // Re-read before writing so two clients don't overwrite each other with stale data.
      async function update(fn) {
        await load();
        data = normalize(fn(data));
        try {
          await MS.connection.obs.call('SetPersistentData', { realm: REALM, slotName: SLOT, slotValue: data });
        } catch {
          try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(data)); } catch {}
        }
        return data;
      }

      return { load, update, get: () => data };
    })();

    // ===== Playlist Scan =====
    MS.playlists = (() => {
      const P = window.MSPlaylist;
      const inputInfo = new Map(); // inputName → { kind, file }
      const scans = new Map(); // sceneName → { sceneName, items, detection }

      async function infoFor(item) {
        if (item.sourceType !== 'OBS_SOURCE_TYPE_INPUT') return { kind: 'other', file: null };
        if (inputInfo.has(item.sourceName)) return inputInfo.get(item.sourceName);
        let info = { kind: 'other', file: null };
        try {
          const { inputSettings } = await MS.connection.obs.call('GetInputSettings', { inputName: item.sourceName });
          const file = inputSettings.local_file ?? inputSettings.file ?? null;
          info = {
            kind: P.classifyItem({
              inputKind: item.inputKind,
              localFile: file,
              isLocalFile: inputSettings.is_local_file,
              looping: inputSettings.looping,
            }),
            file,
          };
        } catch {}
        inputInfo.set(item.sourceName, info);
        return info;
      }

      async function scan(sceneName) {
        const { sceneItems } = await MS.connection.obs.call('GetSceneItemList', { sceneName });
        const items = [];
        for (const it of sceneItems) {
          const info = await infoFor(it);
          items.push({
            sceneItemId: it.sceneItemId,
            sourceName: it.sourceName,
            kind: info.kind,
            file: info.file,
            enabled: it.sceneItemEnabled,
            index: it.sceneItemIndex,
          });
        }
        const result = { sceneName, items, detection: P.detectPlaylist(items) };
        scans.set(sceneName, result);
        return result;
      }

      function invalidate(inputName) {
        inputInfo.delete(inputName);
      }

      function reset() {
        inputInfo.clear();
        scans.clear();
      }

      function forget(sceneName) {
        scans.delete(sceneName);
      }

      MS.connection.obs.on('InputSettingsChanged', (d) => invalidate(d.inputName));
      MS.connection.obs.on('InputRemoved', (d) => invalidate(d.inputName));
      MS.connection.obs.on('InputNameChanged', (d) => invalidate(d.oldInputName));

      return {
        scan,
        invalidate,
        reset,
        forget,
        getScan: (sceneName) => scans.get(sceneName),
        playlistScenes: () => [...scans.values()].filter((sc) => sc.detection.auto).map((sc) => ({ sceneName: sc.sceneName, kind: sc.detection.kind })),
        isPlaylist: (sceneName) => !!scans.get(sceneName)?.detection.auto,
      };
    })();

    // ===== Transition Resolver =====
    MS.transitions = { cutName: null, fadeName: null, stingerName: null };

    // ===== Canvas Cache =====
    MS.canvas = { width: 1920, height: 1080, fps: 30 };

    // ===== Post-connect initialization =====
    async function onConnected() {
      const obs = MS.connection.obs;

      // Enable studio mode
      try {
        await obs.call('SetStudioModeEnabled', { studioModeEnabled: true });
      } catch {}

      MS.transitions.cutName = null;
      MS.transitions.fadeName = null;
      MS.transitions.stingerName = null;
      try {
        const { transitions } = await obs.call('GetSceneTransitionList');
        for (const t of transitions) {
          if (t.transitionKind === 'obs_stinger_transition' && !MS.transitions.stingerName) {
            MS.transitions.stingerName = t.transitionName;
          }
          if (t.transitionKind === 'cut_transition' && !MS.transitions.cutName) {
            MS.transitions.cutName = t.transitionName;
          }
          if (t.transitionKind === 'fade_transition' && !MS.transitions.fadeName) {
            MS.transitions.fadeName = t.transitionName;
          }
        }
        if (!MS.transitions.cutName) {
          console.warn('No cut transition found — falling back to first available');
          MS.transitions.cutName = transitions[0]?.transitionName;
        }
        if (!MS.transitions.fadeName) {
          console.warn('No fade transition found — falling back to first available');
          MS.transitions.fadeName = transitions[0]?.transitionName;
        }
      } catch (err) {
        console.error('Failed to resolve transitions:', err);
      }

      // Cache canvas dimensions
      try {
        const vs = await obs.call('GetVideoSettings');
        MS.canvas.width = vs.baseWidth;
        MS.canvas.height = vs.baseHeight;
        MS.canvas.fps = vs.fpsNumerator / vs.fpsDenominator;
      } catch {}

      // Enable UI buttons
      document.getElementById('btn-add-input').disabled = false;
      document.getElementById('btn-hold-frames').disabled = false;
      document.getElementById('btn-cut').disabled = false;
      document.getElementById('btn-fade').disabled = false;
      document.getElementById('btn-stinger').disabled = !MS.transitions.stingerName;

      MS.cue.resetSession();
      await MS.store.load();

      // Build scene grid (Task 5)
      if (MS.grid) await MS.grid.rebuild();
      if (MS.manager) MS.manager.onConnect().catch((err) => console.error('Manager init failed:', err));
      if (MS.audioCheck) MS.audioCheck.run().catch(() => {});
      MS.audioFade.recover().catch(() => {});
      MS.liveTransport.refresh().catch(() => {});
      MS.music.refresh().catch((err) => console.error('Music init failed:', err));
      MS.autoplay.start();
    }

    function onDisconnected() {
      document.getElementById('btn-add-input').disabled = true;
      document.getElementById('btn-hold-frames').disabled = true;
      document.getElementById('btn-cut').disabled = true;
      document.getElementById('btn-fade').disabled = true;
      document.getElementById('btn-stinger').disabled = true;
      MS.liveTransport.stop();
      MS.music.stop();
      MS.autoplay.stop();
    }

    MS.connection.onConnect = onConnected;
    MS.connection.onDisconnect = onDisconnected;

    // ===== Config Modal =====
    MS.configModal = (() => {
      const overlay = document.getElementById('config-modal');
      const hostInput = document.getElementById('config-host');
      const portInput = document.getElementById('config-port');
      const passInput = document.getElementById('config-password');
      const btnConnect = document.getElementById('btn-connect');
      const btnDisconnect = document.getElementById('btn-disconnect');
      const btnClose = document.getElementById('btn-config-close');
      const btnToggle = document.getElementById('btn-toggle-password');
      const deviceInput = document.getElementById('config-device');
      const audioFadeInput = document.getElementById('config-audio-fade');

      function show(focusPassword) {
        const cfg = MS.connection.getConfig();
        hostInput.value = cfg.host || 'localhost';
        portInput.value = cfg.port || 4455;
        passInput.value = cfg.password || '';
        deviceInput.value = MS.store.get().expectedDevice;
        audioFadeInput.value = MS.store.get().audioFadeMs;
        btnConnect.hidden = MS.connection.connected;
        btnDisconnect.hidden = !MS.connection.connected;
        overlay.hidden = false;
        if (focusPassword) {
          passInput.focus();
        } else {
          hostInput.focus();
        }
      }

      function hide() {
        overlay.hidden = true;
      }

      btnConnect.addEventListener('click', () => {
        const host = hostInput.value.trim();
        const port = parseInt(portInput.value, 10);
        const password = passInput.value;
        const device = deviceInput.value.trim() || 'External Headphones';
        MS.store.update((d) => ({ ...d, expectedDevice: device })).then(() => MS.audioCheck?.run());
        hide();
        MS.connection.connect(host, port, password);
      });

      btnDisconnect.addEventListener('click', () => {
        hide();
        MS.connection.disconnect();
      });

      audioFadeInput.addEventListener('change', () => {
        const ms = Math.max(0, Math.min(3000, parseInt(audioFadeInput.value, 10) || 0));
        MS.store.update((d) => ({ ...d, audioFadeMs: ms }));
      });

      btnClose.addEventListener('click', hide);

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) hide();
      });

      btnToggle.addEventListener('click', () => {
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('btn-settings').addEventListener('click', () => show());

      return { show, hide };
    })();

    // ===== Transport Controls =====
    MS.transport = (() => {
      async function action(inputName, mediaAction) {
        if (!MS.connection.connected || !inputName) return;
        try {
          await MS.connection.obs.call('TriggerMediaInputAction', {
            inputName,
            mediaAction,
          });
        } catch (err) {
          console.error('Transport action failed:', err);
        }
      }

      async function seek(inputName, cursorMs) {
        if (!MS.connection.connected || !inputName) return;
        try {
          await MS.connection.obs.call('SetMediaInputCursor', {
            inputName,
            mediaCursor: Math.max(0, cursorMs),
          });
        } catch (err) {
          console.error('Seek failed:', err);
        }
      }

      return { action, seek };
    })();
    // ===== Audio Controls =====
    MS.audio = (() => {
      async function toggleMute(inputName) {
        if (!MS.connection.connected || !inputName) return;
        try {
          const { inputMuted } = await MS.connection.obs.call('ToggleInputMute', { inputName });
          updateMuteUI(inputName, inputMuted);
        } catch (err) {
          console.error('Mute toggle failed:', err);
        }
      }

      async function setVolume(inputName, db) {
        if (!MS.connection.connected || !inputName) return;
        try {
          await MS.connection.obs.call('SetInputVolume', {
            inputName,
            inputVolumeDb: db,
          });
        } catch (err) {
          console.error('Set volume failed:', err);
        }
      }

      async function loadInitialState(inputName, tileEl) {
        if (!MS.connection.connected || !inputName) return;
        try {
          const [volResult, muteResult] = await Promise.all([
            MS.connection.obs.call('GetInputVolume', { inputName }),
            MS.connection.obs.call('GetInputMute', { inputName }),
          ]);

          const slider = tileEl.querySelector('.volume-slider');
          if (slider) {
            const db = Math.max(-60, Math.min(0, volResult.inputVolumeDb));
            slider.value = db;
          }

          updateMuteUI(inputName, muteResult.inputMuted);
        } catch {}
      }

      function updateMuteUI(inputName, muted) {
        for (const [, tile] of MS.grid.tiles) {
          if (tile.inputName === inputName) {
            const btn = tile.el.querySelector('.btn-mute');
            if (btn) {
              btn.textContent = muted ? '🔇' : '🔊';
              btn.classList.toggle('muted', muted);
            }
            break;
          }
        }
      }

      return { toggleMute, setVolume, loadInitialState };
    })();

    // ===== Clip Audio Fades =====
    // A clip fading out is left parked at volume 0 (its real level is remembered in the store) and fades up to that level the next time it goes live, so nothing depends on whether OBS still processes a clip that is playing but not live.
    MS.audioFade = (() => {
      const P = window.MSPlaylist;
      const TICK_MS = 30;
      const PREPARE_TIMEOUT_MS = 1500;
      const ramps = new Map(); // inputName → id of the ramp that owns its volume
      let rampSeq = 0;
      let nextInMs = null; // a MediaSheet take sets this so the fade-in matches the transition

      const obs = () => MS.connection.obs;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const setMul = (inputName, mul) =>
        obs().call('SetInputVolume', { inputName, inputVolumeMul: Math.max(0, Math.min(20, mul)) });

      async function ramp(entries, ms) {
        const id = ++rampSeq;
        for (const e of entries) ramps.set(e.name, id);
        const start = performance.now();
        for (;;) {
          const t = ms > 0 ? (performance.now() - start) / ms : 1;
          const mine = entries.filter((e) => ramps.get(e.name) === id);
          if (!mine.length) return false;
          await Promise.all(mine.map((e) => setMul(e.name, P.rampValue(e.from, e.to, t)).catch(() => {})));
          if (t >= 1) break;
          await sleep(TICK_MS);
        }
        for (const e of entries) if (ramps.get(e.name) === id) ramps.delete(e.name);
        return true;
      }

      async function gather() {
        const pgm = MS.grid.currentPgm;
        const pvw = MS.grid.currentPvw;
        const names = [...new Set([pgm, pvw].filter(Boolean))];
        const scans = await Promise.all(names.map((n) => MS.playlists.scan(n).catch(() => null)));
        const previewScan = scans[names.indexOf(pvw)];
        const enabledInPreview = new Set((previewScan?.items ?? []).filter((i) => i.enabled).map((i) => i.sourceName));
        const videos = new Set();
        for (const sc of scans) for (const i of sc?.items ?? []) if (i.kind === 'video') videos.add(i.sourceName);
        const remembered = MS.store.get().fadeRestore;
        const candidates = await Promise.all([...videos].map(async (sourceName) => {
          const [a, m, v] = await Promise.all([
            obs().call('GetSourceActive', { sourceName }),
            obs().call('GetInputMute', { inputName: sourceName }),
            obs().call('GetInputVolume', { inputName: sourceName }),
          ]);
          return {
            sourceName,
            live: a.videoActive,
            muted: m.inputMuted,
            mul: v.inputVolumeMul,
            level: P.fadeLevel(remembered[sourceName], v.inputVolumeMul),
            enabledInPreview: enabledInPreview.has(sourceName),
          };
        }));
        return { ...P.selectFadeTargets(candidates), candidates };
      }

      // Decide who fades, remember their real levels, and silence the incoming clips. Never blocks a take: any failure means no fades.
      async function prepare() {
        const ms = MS.store.get().audioFadeMs;
        if (!ms || !MS.connection.connected) return null;
        let abandoned = false;
        try {
          const plan = await Promise.race([
            (async () => {
              const targets = await gather();
              if (abandoned || (!targets.outgoing.length && !targets.incoming.length)) return null;
              const entries = {};
              for (const e of [...targets.outgoing, ...targets.incoming]) entries[e.sourceName] = e.level;
              await MS.store.update((d) => ({ ...d, fadeRestore: { ...d.fadeRestore, ...entries } }));
              // Parking after the take has fired would leave a live clip silent with no activation event to bring it back.
              if (abandoned) return null;
              await Promise.all(targets.incoming.map((e) => {
                ramps.set(e.sourceName, ++rampSeq);
                return setMul(e.sourceName, 0);
              }));
              return { outgoing: targets.outgoing, incoming: targets.incoming, ms };
            })(),
            sleep(PREPARE_TIMEOUT_MS).then(() => { abandoned = true; return null; }),
          ]);
          return plan;
        } catch (err) {
          console.error('Audio fade prepare failed:', err);
          return null;
        }
      }

      // Resolves when the outgoing clips are silent (and stay parked at 0).
      async function fadeOut(plan, ms) {
        if (!plan?.outgoing.length) return;
        await ramp(plan.outgoing.map((e) => ({ name: e.sourceName, from: e.mul, to: 0 })), ms ?? plan.ms)
          .catch((err) => console.error('Audio fade-out failed:', err));
      }

      function setNextInMs(ms, ttlMs = 1500) {
        nextInMs = ms;
        setTimeout(() => { if (nextInMs === ms) nextInMs = null; }, ttlMs);
      }

      // A stinger activates the incoming clip a second before its picture is visible: its audio waits for the cut point.
      let fadeUpAt = 0;
      const holdFadeUpUntil = (at) => { fadeUpAt = at; };

      async function forget(name) {
        await MS.store.update((d) => {
          const fadeRestore = { ...d.fadeRestore };
          delete fadeRestore[name];
          return { ...d, fadeRestore };
        }).catch(() => {});
      }

      // A remembered clip going live comes up from wherever it was parked.
      async function fadeUp(name) {
        const level = MS.store.get().fadeRestore[name];
        if (typeof level !== 'number') return;
        const { inputVolumeMul: current } = await obs().call('GetInputVolume', { inputName: name });
        if (current >= level) { await forget(name); return; }
        const done = await ramp([{ name, from: current, to: level }], nextInMs ?? MS.store.get().audioFadeMs);
        if (done) await forget(name);
      }

      obs().on('InputActiveStateChanged', (d) => {
        if (!d.videoActive) return;
        sleep(Math.max(0, fadeUpAt - Date.now()))
          .then(() => fadeUp(d.inputName))
          .catch((err) => console.error('Audio fade-in failed:', err));
      });

      // After a reload or crash mid-fade: anything remembered that is live now still needs to come up.
      async function recover() {
        for (const name of Object.keys(MS.store.get().fadeRestore)) {
          const { videoActive } = await obs().call('GetSourceActive', { sourceName: name }).catch(() => ({}));
          if (videoActive) fadeUp(name).catch(() => {});
        }
      }

      // Taking the clip that is already live (cued alone in Preview) restarts it: fade it out, restart, fade it back in.
      async function retake() {
        try {
          const pvw = MS.grid.currentPvw;
          if (!MS.connection.connected || !pvw || pvw !== MS.grid.currentPgm || !MS.manager.isManagedPlaylist(pvw)) return false;
          const targets = P.selectRetake((await gather()).candidates);
          if (!targets.length) return false;
          const ms = MS.store.get().audioFadeMs;
          if (ms > 0) {
            const entries = {};
            for (const t of targets) entries[t.sourceName] = t.level;
            await MS.store.update((d) => ({ ...d, fadeRestore: { ...d.fadeRestore, ...entries } }));
            await ramp(targets.map((t) => ({ name: t.sourceName, from: t.mul, to: 0 })), ms);
          }
          await Promise.all(targets.map((t) => obs().call('TriggerMediaInputAction', { inputName: t.sourceName, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART' })));
          if (ms > 0) {
            await ramp(targets.map((t) => ({ name: t.sourceName, from: 0, to: t.level })), ms);
            await Promise.all(targets.map((t) => forget(t.sourceName)));
          }
          MS.grid.logEvent(`Re-take: ${targets.length} clip(s) restarted`);
          return true;
        } catch (err) {
          console.error('Re-take failed:', err);
          return false;
        }
      }

      return { prepare, fadeOut, setNextInMs, holdFadeUpUntil, recover, gather, retake };
    })();

    // ===== Live Clip Transport =====
    // OBS's own media bar follows the *selected* source and obs-websocket cannot change that, so this strip follows whatever clip is live on Program.
    MS.liveTransport = (() => {
      const P = window.MSPlaylist;
      const POLL_MS = 250;
      const strip = document.getElementById('live-transport');
      const toggle = document.getElementById('lt-toggle');
      const restart = document.getElementById('lt-restart');
      const nameEl = document.getElementById('lt-name');
      const timeEl = document.getElementById('lt-time');
      const seek = document.getElementById('lt-seek');
      const durations = new Map(); // inputName → last known duration (ms); OBS reports null once a clip has ended
      let current = null;
      let lastState = null;
      let dragging = false;
      let pollTimer = null;
      let refreshTimer = null;

      const obs = () => MS.connection.obs;
      const action = (a) => obs().call('TriggerMediaInputAction', { inputName: current, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_' + a });

      async function findLive() {
        const scene = MS.grid.currentPgm;
        if (!scene || !MS.connection.connected) return null;
        const scan = await MS.playlists.scan(scene).catch(() => null);
        const videos = (scan?.items ?? []).filter((i) => i.kind === 'video');
        const flags = await Promise.all(videos.map((i) =>
          obs().call('GetSourceActive', { sourceName: i.sourceName }).then((r) => r.videoActive).catch(() => false)));
        const live = videos.filter((_, i) => flags[i]).map((i) => i.sourceName);
        if (!live.length) return null;
        return live.includes(current) ? current : live[live.length - 1];
      }

      function paint(state, cursor, duration) {
        toggle.textContent = state === 'OBS_MEDIA_STATE_PLAYING' ? '⏸' : state === 'OBS_MEDIA_STATE_PAUSED' ? '▶' : '⟲';
        toggle.title = state === 'OBS_MEDIA_STATE_PLAYING' ? 'Pause the clip on Program'
          : state === 'OBS_MEDIA_STATE_PAUSED' ? 'Play the clip on Program' : 'Restart the clip on Program';
        if (dragging) return;
        const shown = state === 'OBS_MEDIA_STATE_ENDED' ? duration : cursor;
        timeEl.textContent = `${P.formatClock(shown)} / ${P.formatClock(duration)}`;
        seek.value = duration > 0 ? Math.min(1000, Math.round(((shown ?? 0) / duration) * 1000)) : 0;
        seek.disabled = !(duration > 0);
      }

      async function poll() {
        if (!current) return;
        try {
          const st = await obs().call('GetMediaInputStatus', { inputName: current });
          if (typeof st.mediaDuration === 'number') durations.set(current, st.mediaDuration);
          lastState = st.mediaState;
          paint(st.mediaState, st.mediaCursor, durations.get(current) ?? null);
        } catch {
          scheduleRefresh();
        }
      }

      async function refresh() {
        const next = await findLive().catch(() => null);
        current = next;
        strip.hidden = !next;
        clearInterval(pollTimer);
        pollTimer = null;
        if (!next) return;
        nameEl.textContent = next;
        nameEl.title = next;
        await poll();
        pollTimer = setInterval(poll, POLL_MS);
      }

      function scheduleRefresh() {
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => refresh().catch((err) => console.error('Transport refresh failed:', err)), 150);
      }

      function stop() {
        current = null;
        clearInterval(pollTimer);
        pollTimer = null;
        strip.hidden = true;
      }

      toggle.addEventListener('click', async () => {
        if (!current) return;
        await action(P.transportAction(lastState)).catch((err) => console.error('Transport action failed:', err));
        poll();
      });
      restart.addEventListener('click', async () => {
        if (!current) return;
        await action('RESTART').catch((err) => console.error('Transport restart failed:', err));
        poll();
      });
      seek.addEventListener('input', () => {
        dragging = true;
        const duration = durations.get(current);
        const target = P.seekTarget(Number(seek.value), 1000, duration);
        if (target !== null) timeEl.textContent = `${P.formatClock(target)} / ${P.formatClock(duration)}`;
      });
      seek.addEventListener('change', async () => {
        const name = current;
        const target = P.seekTarget(Number(seek.value), 1000, durations.get(name));
        dragging = false;
        if (!name || target === null) return;
        try {
          // OBS ignores a seek on a clip that is not playing or paused
          if (lastState !== 'OBS_MEDIA_STATE_PLAYING' && lastState !== 'OBS_MEDIA_STATE_PAUSED') {
            await action('RESTART');
            await new Promise((r) => setTimeout(r, 150));
          }
          await obs().call('SetMediaInputCursor', { inputName: name, mediaCursor: target });
        } catch (err) {
          console.error('Transport seek failed:', err);
        }
        poll();
      });

      obs().on('InputActiveStateChanged', scheduleRefresh);
      obs().on('CurrentProgramSceneChanged', scheduleRefresh);
      obs().on('SceneTransitionEnded', scheduleRefresh);

      return { refresh, stop };
    })();

    // ===== Music =====
    // Background audio on its own player source ("MediaSheet Music", kept on an always-on output channel by obs-scripts/mediasheet-music.lua). It is in no scene, so it never takes part in cuts, fades, stingers or the clip logic: this strip only sends it a file, play/pause, seek, volume and loop.
    MS.music = (() => {
      const P = window.MSPlaylist;
      const PLAYER = 'MediaSheet Music';
      const POLL_MS = 500;
      const el = (id) => document.getElementById(id);
      const strip = el('music-strip');
      const select = el('mu-track');
      const toggle = el('mu-toggle');
      const restart = el('mu-restart');
      const timeEl = el('mu-time');
      const seek = el('mu-seek');
      const vol = el('mu-vol');
      const loop = el('mu-loop');
      const warn = el('mu-warn');
      let pollTimer = null;
      let refreshTimer = null;
      let lastState = null;
      let duration = null;
      let dragging = false;
      let ready = false;
      let looping = false;
      let polls = 0;
      // Volume is remembered per track: any change to the player's volume (this strip or OBS's mixer) is saved under the track that is loaded
      let loadedFile = null;
      let pendingMul = null;
      let gainTimer = null;

      const obs = () => MS.connection.obs;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const action = (a) => obs().call('TriggerMediaInputAction', { inputName: PLAYER, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_' + a });

      async function flushGain() {
        clearTimeout(gainTimer);
        if (pendingMul === null || !loadedFile) { pendingMul = null; return; }
        const file = loadedFile;
        const mul = Math.round(pendingMul * 10000) / 10000;
        pendingMul = null;
        await MS.store.update((d) => ({ ...d, musicGain: { ...d.musicGain, [file]: mul } })).catch(() => {});
      }

      async function loadGroups() {
        const { scenes } = await obs().call('GetSceneList');
        const scans = await Promise.all(scenes.map((s) => MS.playlists.scan(s.sceneName).catch(() => null)));
        return P.groupAudioTracks(scans.filter(Boolean));
      }

      async function readPlayer() {
        try {
          const [{ inputSettings }, { videoActive }] = await Promise.all([
            obs().call('GetInputSettings', { inputName: PLAYER }),
            obs().call('GetSourceActive', { sourceName: PLAYER }),
          ]);
          return { exists: true, active: videoActive, settings: inputSettings };
        } catch {
          return { exists: false };
        }
      }

      function fillSelect(groups, file) {
        select.replaceChildren(new Option('Choose a track…', ''));
        for (const g of groups) {
          const og = document.createElement('optgroup');
          og.label = g.scene;
          for (const t of g.tracks) og.append(new Option(t.label, t.file));
          select.append(og);
        }
        select.value = file ?? '';
        if (select.value !== (file ?? '')) select.value = '';
      }

      function setReady(on, message) {
        ready = on;
        strip.classList.toggle('off', !on);
        warn.hidden = on;
        warn.textContent = message ?? '';
        warn.title = message ?? '';
      }

      function paint(state, cursor) {
        const playing = state === 'OBS_MEDIA_STATE_PLAYING';
        toggle.textContent = playing ? '⏸' : '▶';
        toggle.title = playing ? 'Pause the music' : state === 'OBS_MEDIA_STATE_PAUSED' ? 'Play the music' : 'Play the track from the start';
        const none = !select.value;
        toggle.disabled = none;
        restart.disabled = none;
        if (dragging) return;
        const shown = state === 'OBS_MEDIA_STATE_ENDED' ? duration : cursor;
        timeEl.textContent = `${P.formatClock(shown)} / ${P.formatClock(duration)}`;
        seek.value = duration > 0 ? Math.min(1000, Math.round(((shown ?? 0) / duration) * 1000)) : 0;
        seek.disabled = none || !(duration > 0);
      }

      async function poll() {
        if (!MS.connection.connected) return;
        try {
          if (!ready) {
            const p = await readPlayer();
            if (p.exists && p.active) scheduleRefresh();
            return;
          }
          const st = await obs().call('GetMediaInputStatus', { inputName: PLAYER });
          if (typeof st.mediaDuration === 'number') duration = st.mediaDuration;
          lastState = st.mediaState;
          paint(st.mediaState, st.mediaCursor);
          // The player can disappear (script unloaded) or stop being routed while the strip is open
          if (++polls % 6 === 0) {
            const p = await readPlayer();
            if (!p.exists || !p.active) scheduleRefresh();
          }
        } catch {
          scheduleRefresh();
        }
      }

      async function refresh() {
        if (!MS.connection.connected) return;
        const [groups, player] = await Promise.all([loadGroups().catch(() => []), readPlayer()]);
        strip.hidden = !(groups.length || player.exists);
        if (!pollTimer && !strip.hidden) pollTimer = setInterval(poll, POLL_MS);
        if (!player.exists) {
          setReady(false, 'No music player in OBS: load obs-scripts/mediasheet-music.lua (OBS > Tools > Scripts)');
          return;
        }
        if (!player.active) {
          setReady(false, 'Music not routed: reload obs-scripts/mediasheet-music.lua (check Tools > Scripts > Script Log)');
          return;
        }
        fillSelect(groups, player.settings.local_file);
        loadedFile = player.settings.local_file || null;
        looping = player.settings.looping === true;
        loop.classList.toggle('btn-primary', looping);
        try {
          const { inputVolumeMul } = await obs().call('GetInputVolume', { inputName: PLAYER });
          vol.value = P.mulToSlider(inputVolumeMul);
        } catch {}
        setReady(true);
        poll();
      }

      function scheduleRefresh() {
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(() => refresh().catch((err) => console.error('Music refresh failed:', err)), 300);
      }

      function stop() {
        clearInterval(pollTimer);
        pollTimer = null;
        strip.hidden = true;
        ready = false;
      }

      select.addEventListener('change', async () => {
        const file = select.value;
        if (!file) return;
        try {
          // Keep what was set for the old track, then bring the new one up at its own level (a track never set keeps the current volume)
          await flushGain();
          loadedFile = file;
          const saved = MS.store.get().musicGain[file];
          if (typeof saved === 'number') {
            await obs().call('SetInputVolume', { inputName: PLAYER, inputVolumeMul: saved });
            vol.value = P.mulToSlider(saved);
          }
          await obs().call('SetInputSettings', { inputName: PLAYER, inputSettings: { local_file: file, is_local_file: true }, overlay: true });
          // OBS opens the new file (and may start it); make sure it plays from the top
          await sleep(150);
          await action('RESTART');
          MS.grid.logEvent(`Music: ${select.selectedOptions[0]?.textContent ?? file}`);
        } catch (err) {
          console.error('Music track change failed:', err);
          MS.grid.logEvent(`Music failed: ${err.message}`);
        }
        poll();
      });
      toggle.addEventListener('click', async () => {
        await action(P.transportAction(lastState)).catch((err) => console.error('Music action failed:', err));
        poll();
      });
      restart.addEventListener('click', async () => {
        await action('RESTART').catch((err) => console.error('Music restart failed:', err));
        poll();
      });
      seek.addEventListener('input', () => {
        dragging = true;
        const target = P.seekTarget(Number(seek.value), 1000, duration);
        if (target !== null) timeEl.textContent = `${P.formatClock(target)} / ${P.formatClock(duration)}`;
      });
      seek.addEventListener('change', async () => {
        const target = P.seekTarget(Number(seek.value), 1000, duration);
        dragging = false;
        if (target === null) return;
        try {
          if (lastState !== 'OBS_MEDIA_STATE_PLAYING' && lastState !== 'OBS_MEDIA_STATE_PAUSED') {
            await action('RESTART');
            await sleep(150);
          }
          await obs().call('SetMediaInputCursor', { inputName: PLAYER, mediaCursor: target });
        } catch (err) {
          console.error('Music seek failed:', err);
        }
        poll();
      });
      vol.addEventListener('input', () => {
        obs().call('SetInputVolume', { inputName: PLAYER, inputVolumeMul: P.sliderToMul(vol.value) }).catch(() => {});
      });
      loop.addEventListener('click', async () => {
        looping = !looping;
        loop.classList.toggle('btn-primary', looping);
        await obs().call('SetInputSettings', { inputName: PLAYER, inputSettings: { looping }, overlay: true })
          .catch((err) => console.error('Music loop failed:', err));
      });

      obs().on('InputVolumeChanged', (d) => {
        if (d.inputName !== PLAYER) return;
        pendingMul = d.inputVolumeMul;
        if (document.activeElement !== vol) vol.value = P.mulToSlider(d.inputVolumeMul);
        clearTimeout(gainTimer);
        gainTimer = setTimeout(() => flushGain(), 600);
      });
      obs().on('InputSettingsChanged', (d) => { if (d.inputName === PLAYER) scheduleRefresh(); });
      obs().on('InputCreated', (d) => { if (d.inputName === PLAYER) scheduleRefresh(); });
      obs().on('InputRemoved', (d) => { if (d.inputName === PLAYER) scheduleRefresh(); });
      for (const ev of ['SceneCreated', 'SceneRemoved', 'SceneNameChanged', 'SceneItemCreated', 'SceneItemRemoved']) obs().on(ev, scheduleRefresh);

      return { refresh, stop };
    })();

    // ===== Pre-roll =====
    // OBS's restart drops the current frame and shows ~2 black frames. Doing it while the incoming clip is still only in Preview keeps the blank off Program: the clip is restarted, given a moment to draw, and goes live already playing.
    MS.preroll = (() => {
      const STARTED_TIMEOUT_MS = 800;
      // How long OBS's restart blank lasts after PlaybackStarted (measured, 25 runs per start state): paused <= 49 ms, stopped/ended <= 22 ms, already playing <= 103 ms (p90 56). Settle = worst case + margin; rare outliers (about 1 in 100 runs) can still blink, trading against a longer trim.
      const SETTLE_MS = 100;
      const SETTLE_PLAYING_MS = 140;
      const WINDOW_MS = 3000;
      const recent = new Map(); // inputName → when it was pre-rolled
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function restartAndWait(inputName) {
        const obs = MS.connection.obs;
        let handler;
        const started = new Promise((resolve) => {
          const timer = setTimeout(() => resolve(false), STARTED_TIMEOUT_MS);
          handler = (d) => { if (d.inputName === inputName) { clearTimeout(timer); resolve(true); } };
          obs.on('MediaInputPlaybackStarted', handler);
        });
        try {
          await obs.call('TriggerMediaInputAction', { inputName, mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART' });
          return await started;
        } finally {
          obs.off('MediaInputPlaybackStarted', handler);
        }
      }

      // Never blocks a take: any failure means the clip is restarted at the take instead (with the black frames).
      async function run() {
        try {
          const pvw = MS.grid.currentPvw;
          if (!MS.connection.connected || !pvw || !MS.manager.isManagedPlaylist(pvw)) return [];
          const { candidates } = await MS.audioFade.gather();
          const targets = candidates.filter((c) => !c.live && c.enabledInPreview);
          if (!targets.length) return [];
          let settle = SETTLE_MS;
          await Promise.all(targets.map(async (c) => {
            // Silent while it plays unseen; the activation handler unmutes it when it goes live
            await MS.connection.obs.call('SetInputMute', { inputName: c.sourceName, inputMuted: true });
            const { mediaState } = await MS.connection.obs.call('GetMediaInputStatus', { inputName: c.sourceName });
            if (mediaState === 'OBS_MEDIA_STATE_PLAYING') settle = SETTLE_PLAYING_MS;
            if (await restartAndWait(c.sourceName)) recent.set(c.sourceName, Date.now());
          }));
          await sleep(settle);
          return targets.map((c) => c.sourceName);
        } catch (err) {
          console.error('Pre-roll failed:', err);
          return [];
        }
      }

      // Typical run() time (gather, mute, restart, first frame, settle); a CUT starts it this long before the fade-out ends so the clip is only just playing when it goes live
      const LEAD_MS = 150;

      // A stinger take restarts its incoming clips itself, just before the cut point, and marks them so activation does not restart them again.
      async function restartIncoming(inputName) {
        if (await restartAndWait(inputName)) recent.set(inputName, Date.now());
      }

      return { run, restartIncoming, LEAD_MS, was: (inputName) => Date.now() - (recent.get(inputName) ?? -Infinity) < WINDOW_MS };
    })();

    // ===== Transition Control =====
    MS.transitionControl = (() => {
      const btnCut = document.getElementById('btn-cut');
      const btnFade = document.getElementById('btn-fade');
      const btnStinger = document.getElementById('btn-stinger');
      const fadeDurationInput = document.getElementById('fade-duration');
      let lastTransitionType = 'cut'; // 'cut', 'fade' or 'stinger'
      // A second take during the audio pre-roll would swap Preview/Program back, so presses are ignored until the first finishes.
      let pending = false;

      function setPending(on) {
        pending = on;
        btnCut.classList.toggle('busy', on);
        btnFade.classList.toggle('busy', on);
        btnStinger.classList.toggle('busy', on);
      }

      // cut, fade and stinger return whether the transition was started (the autoplay engine checks)
      async function cut() {
        if (!MS.connection.connected || pending) return false;
        setPending(true);
        lastTransitionType = 'cut';
        try {
          if (await MS.audioFade.retake()) return true;
          const plan = await MS.audioFade.prepare();
          if (plan) {
            MS.grid.logEvent(`Audio fade: out ${plan.outgoing.length}, in ${plan.incoming.length}`);
            MS.audioFade.setNextInMs(plan.ms);
          }
          // The incoming clip is restarted in Preview near the end of the outgoing audio fade, so a Cut adds little or no delay and the clip is not already seconds in when it appears
          const fading = plan ? MS.audioFade.fadeOut(plan) : null;
          const lead = plan?.outgoing.length ? Math.max(0, plan.ms - MS.preroll.LEAD_MS) : 0;
          const rolling = new Promise((r) => setTimeout(r, lead)).then(() => MS.preroll.run());
          const [rolled] = await Promise.all([rolling, fading]);
          if (rolled.length) MS.grid.logEvent(`Pre-rolled ${rolled.length} clip(s)`);
          if (MS.transitions.cutName) {
            await MS.connection.obs.call('SetCurrentSceneTransition', {
              transitionName: MS.transitions.cutName,
            });
          }
          await MS.connection.obs.call('TriggerStudioModeTransition');
          await restartOnTake();
          return true;
        } catch (err) {
          console.error('Cut transition failed:', err);
          return false;
        } finally {
          setPending(false);
        }
      }

      async function fade(durationMs) {
        if (!MS.connection.connected || pending) return false;
        setPending(true);
        lastTransitionType = 'fade';
        durationMs = durationMs || parseInt(fadeDurationInput.value, 10) || 300;
        try {
          if (await MS.audioFade.retake()) return true;
          const plan = await MS.audioFade.prepare();
          const rolled = await MS.preroll.run();
          if (rolled.length) MS.grid.logEvent(`Pre-rolled ${rolled.length} clip(s)`);
          if (MS.transitions.fadeName) {
            await MS.connection.obs.call('SetCurrentSceneTransition', {
              transitionName: MS.transitions.fadeName,
            });
            await MS.connection.obs.call('SetCurrentSceneTransitionDuration', {
              transitionDuration: durationMs,
            });
          }
          // The room hears monitored audio before the transition mixes it, so the clips fade over the same time as the picture.
          if (plan) {
