<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaSheet</title>
  <style>
    :root {
      --ms-bg-window: #1D1F26;
      --ms-bg-base: #272A33;
      --ms-bg-preview: #13141A;
      --ms-primary: #284CB8;
      --ms-primary-light: #476BD7;
      --ms-primary-lighter: #718CDC;
      --ms-primary-dark: #213E97;
      --ms-text: #FFFFFF;
      --ms-text-muted: #969696;
      --ms-danger: #C01C37;
      --ms-warning: #B88A16;
      --ms-success: #25A231;
      --ms-border: #3C404D;
      --ms-input-bg: #3C404D;
      --ms-button-bg: #3C404D;
      --ms-button-hover: #464B59;
      --ms-button-down: #1D1F26;
      --ms-tally-pgm: #C01C37;
      --ms-tally-pvw: #25A231;
      --ms-radius: 4px;
      --ms-radius-sm: 2px;
      --ms-radius-lg: 6px;
      --ms-font: 'Open Sans', '.AppleSystemUIFont', Helvetica, Arial, 'MS Shell Dlg', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--ms-font);
      background: var(--ms-bg-window);
      color: var(--ms-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Top bar, tile grid, bottom bar will be added in subsequent tasks -->
  </div>
  <script src="vendor/obs-websocket-js.min.js"></script>
  <script>
    // Application code will be added in subsequent tasks
  </script>
</body>
</html>
