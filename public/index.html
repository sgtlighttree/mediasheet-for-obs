        if (t === 'cut') return () => MS.transitionControl.cut();
        if (t === 'stinger') return () => MS.transitionControl.stinger();
        return () => MS.transitionControl.fade();
      }

      function leadMs(scene) {
        return P.autoplayLeadMs({
          transition: effectiveTransition(scene),
          audioFadeMs: MS.store.get().audioFadeMs,
          fadeMs: parseInt(document.getElementById('fade-duration').value, 10) || 300,
          stingerPointMs: MS.transitionControl.stingerPointMs(),
        });
      }

      // Is Preview still exactly what autoplay cued: this playlist with only that clip enabled? A take fires whatever is in Preview.
      async function previewIsOurs(scene, clip) {
        const { currentPreviewSceneName } = await obs().call('GetSceneList');
        if (currentPreviewSceneName !== scene) return false;
        const scan = await MS.playlists.scan(scene);
        const enabled = scan.items.filter((i) => i.enabled && i.kind === 'video').map((i) => i.sourceName);
        return enabled.length === 1 && enabled[0] === clip.sourceName;
      }

      function hold(scene, st, why) {
        clearTimeout(st.timer);
        st.timer = null;
        st.cuedFor = null;
        st.heldFor = st.liveName ?? '';
        st.heldWhy = why;
        MS.grid.logEvent(`Autoplay held for ${scene}: ${why}`);
        MS.subgrid.paintAuto(scene);
      }

      // Clicking the HELD badge: carry on with the list now
      function resume(scene) {
        const st = states.get(scene);
        if (!st || st.heldFor == null) return;
        st.heldFor = null;
        st.heldWhy = '';
        st.lastAdvanceAt = Date.now();
        MS.grid.logEvent(`Autoplay resumed for ${scene}`);
        MS.subgrid.paintAuto(scene);
      }

      // Cue (if the clip is not cued yet), then take. Returns whether a take happened.
      async function advance(scene, clip) {
        const st = stateFor(scene);
        if (st.advancing || !holder || scene !== MS.grid.currentPgm) return false;
        // A press since the last advance means the operator is steering: never take their cue
        if (!isLocked(scene) && manualAt > st.lastAdvanceAt) { hold(scene, st, 'manual cue'); return false; }
        st.advancing = true;
        try {
          if (st.cuedFor !== clip.sourceName) {
            if (!(await MS.cue.cueClip(scene, clip, { auto: true }))) return false;
            st.cuedFor = clip.sourceName;
          }
          if (!(await previewIsOurs(scene, clip))) {
            if (!isLocked(scene)) { hold(scene, st, 'Preview was changed'); return false; }
            // Locked: put our cue back rather than take whatever got into Preview
            st.cuedFor = null;
            if (!(await MS.cue.cueClip(scene, clip, { auto: true }))) return false;
            st.cuedFor = clip.sourceName;
          }
          const ended = waitForEvent('SceneTransitionEnded', 15000);
          if (!(await takeFn(scene)())) return false;
          MS.grid.logEvent(`Autoplay: ${scene} → ${clip.sourceName}`);
          st.cuedFor = null;
          await ended;
          await new Promise((r) => setTimeout(r, 1500));
          st.lastAdvanceAt = Date.now();
          return true;
        } catch (err) {
          console.error('Autoplay advance failed:', err);
          return false;
        } finally {
          st.advancing = false;
          reset(scene);
        }
      }

      async function tickScene(scene) {
        const st = stateFor(scene);
        if (scene !== MS.grid.currentPgm || !MS.manager.isManagedPlaylist(scene)) { reset(scene); st.onPgm = false; return; }
        // Coming onto Program starts fresh: the press that brought the playlist in (double-click, CUT) must not count as a manual override
        if (!st.onPgm) {
          st.onPgm = true;
          st.heldFor = null;
          st.lastAdvanceAt = Date.now();
          MS.subgrid.paintAuto(scene);
        }
        if (st.advancing || MS.transitionControl.isPending() || MS.cue.busy) return;
        const scan = await MS.playlists.scan(scene);
        if (!scan.detection.auto || scan.detection.kind !== 'video') return;
        const clips = scan.detection.clips;
        const ids = P.mergeOrder(MS.store.get().clipOrder[scene], clips.map((c) => c.sceneItemId));
        const order = ids.map((id) => clips.find((c) => c.sceneItemId === id)).filter(Boolean);
        const live = [];
        for (const c of order) {
          const { videoActive } = await obs().call('GetSourceActive', { sourceName: c.sourceName }).catch(() => ({}));
          if (!videoActive) continue;
          const s = await obs().call('GetMediaInputStatus', { inputName: c.sourceName }).catch(() => ({}));
          live.push({ sourceName: c.sourceName, state: s.mediaState, cursor: s.mediaCursor, duration: s.mediaDuration });
        }
        const o = opts(scene);
        const cur = live.find((c) => c.state === 'OBS_MEDIA_STATE_PLAYING') ?? live[live.length - 1];
        st.liveName = cur?.sourceName ?? '';
        const liveEnded = !!cur && (cur.state === 'OBS_MEDIA_STATE_ENDED' || cur.state === 'OBS_MEDIA_STATE_STOPPED');
        const ov = P.planOverride({ locked: isLocked(scene), manualAt, lastAdvanceAt: st.lastAdvanceAt, heldFor: st.heldFor, liveName: st.liveName, liveEnded });
        if (ov.act === 'hold-now') { hold(scene, st, 'manual cue'); return; }
        if (ov.act === 'hold') { reset(scene); return; }
        if (ov.act === 'release') {
          st.heldFor = null;
          st.heldWhy = '';
          st.lastAdvanceAt = Date.now();
          MS.grid.logEvent(`Autoplay resumed for ${scene}`);
          MS.subgrid.paintAuto(scene);
        }
        const plan = P.planAutoplay({ order, live, loop: o.loop, leadMs: leadMs(scene) });

        if (plan.act === 'start') {
          reset(scene);
          await advance(scene, plan.clip);
          return;
        }
        if (plan.act !== 'advance') { reset(scene); return; }

        if (plan.cueNow && st.cuedFor !== plan.next.sourceName) {
          if (await MS.cue.cueClip(scene, plan.next, { auto: true })) st.cuedFor = plan.next.sourceName;
        }
        const dueAt = Date.now() + plan.takeInMs;
        if (!st.timer || st.nextFor !== plan.next.sourceName || Math.abs(st.dueAt - dueAt) > 600) {
          clearTimeout(st.timer);
          st.nextFor = plan.next.sourceName;
          st.dueAt = dueAt;
          st.timer = setTimeout(() => { st.timer = null; advance(scene, plan.next); }, plan.takeInMs);
        }
      }

      async function tick() {
        if (ticking || !holder || !MS.connection.connected) return;
        ticking = true;
        try {
          const armed = armedScenes();
          for (const scene of armed) await tickScene(scene).catch((err) => console.error('Autoplay tick failed:', err));
          for (const scene of [...states.keys()]) if (!armed.includes(scene)) reset(scene);
        } finally {
          ticking = false;
        }
      }

      function start() {
        if (!allowed() || tickTimer) return;
        renewLease();
        leaseTimer = setInterval(() => renewLease().catch(() => {}), 1000);
        tickTimer = setInterval(() => tick().catch(() => {}), TICK_MS);
      }

      function stop() {
        clearInterval(tickTimer);
        clearInterval(leaseTimer);
        tickTimer = null;
        leaseTimer = null;
        holder = false;
        for (const scene of [...states.keys()]) reset(scene);
      }

      // Turning it on checks what could make an unattended take unsafe, and asks once if Program might still be the original scene.
      async function setOptions(scene, patch) {
        if (patch.autoplay === true) {
          if ((await MS.cue.sceneDuplication()) !== 'true') {
            return { ok: false, message: 'Autoplay needs Duplicate Scene on in OBS (Settings > General, Studio Mode section), so cueing never changes what is on Program.' };
          }
          if (!MS.manager.isManagedPlaylist(scene)) {
            return { ok: false, message: 'Switch Managed on for this playlist first.' };
          }
          if (scene === MS.grid.currentPgm && !MS.cue.sawTransition()) {
            const yes = await MS.confirm(`"${scene}" is on Program and no transition has been seen since MediaSheet connected. Autoplay will cue and take its clips by itself.`, 'Turn autoplay on');
            if (!yes) return { ok: false };
          }
        }
        await MS.store.update((d) => ({ ...d, playlistOptions: { ...d.playlistOptions, [scene]: { ...(d.playlistOptions[scene] ?? defaults), ...patch } } }));
        // Turning autoplay on or off starts from a clean slate (no stale hold or cue)
        if ('autoplay' in patch) { reset(scene); states.delete(scene); }
        MS.subgrid.paintAuto(scene);
        paintLock();
        return { ok: true };
      }

      return { start, stop, setOptions, opts, isArmed, isLocked, isHeld, heldWhy: (scene) => states.get(scene)?.heldWhy ?? '', resume, guard, noteManual };
    })();

    // ===== Playlist Options Popover =====
    MS.playlistMenu = (() => {
      let menu = null;

      function close() {
        menu?.remove();
        menu = null;
        document.removeEventListener('keydown', onKey, true);
      }
      function onKey(e) { if (e.key === 'Escape') close(); }

      function open(sceneName, at) {
        close();
        const o = MS.autoplay.opts(sceneName);
        menu = document.createElement('div');
        menu.className = 'pl-menu';
        menu.addEventListener('click', (e) => e.stopPropagation());
        menu.addEventListener('contextmenu', (e) => e.stopPropagation());

        const title = document.createElement('div');
        title.className = 'pl-menu-title';
        title.textContent = sceneName;
        const msg = document.createElement('p');
        msg.className = 'pl-msg';
        msg.hidden = true;

        const row = (labelText, control) => {
          const l = document.createElement('label');
          l.append(control, document.createTextNode(labelText));
          return l;
        };
        const check = (checked) => Object.assign(document.createElement('input'), { type: 'checkbox', checked });
        const autoBox = check(o.autoplay);
        const lockBox = check(o.lock);
        lockBox.disabled = !o.autoplay;
        const loopBox = check(o.loop);

        const sel = document.createElement('select');
        for (const [v, label] of [['cut', 'Cut'], ['fade', 'Fade'], ['stinger', 'Stinger']]) {
          const opt = new Option(label, v);
          if (v === 'stinger' && !MS.transitions.stingerName) { opt.disabled = true; opt.textContent = 'Stinger (none in OBS)'; }
          sel.append(opt);
        }
        sel.value = o.transition;
        const selLabel = document.createElement('label');
        selLabel.append(document.createTextNode('Between clips'), sel);

        const apply = async (patch, undo) => {
          const r = await MS.autoplay.setOptions(sceneName, patch).catch((err) => ({ ok: false, message: err.message }));
          msg.hidden = !r.message;
          msg.textContent = r.message ?? '';
          if (!r.ok) undo?.();
        };
        autoBox.addEventListener('change', async () => {
          await apply({ autoplay: autoBox.checked }, () => { autoBox.checked = !autoBox.checked; });
          lockBox.disabled = !autoBox.checked;
        });
        lockBox.addEventListener('change', () => apply({ lock: lockBox.checked }, () => { lockBox.checked = !lockBox.checked; }));
        loopBox.addEventListener('change', () => apply({ loop: loopBox.checked }));
        sel.addEventListener('change', () => apply({ transition: sel.value }));

        const note = document.createElement('p');
        note.className = 'pl-note';
        note.textContent = 'Plays the clips in the order shown, only while this playlist is on Program. Pause the live clip to hold. If you cue or take something by hand, autoplay stands down until your take lands. Playback lock ignores those presses instead (OBS\'s own buttons still work; autoplay puts its cue back). It runs in this dock: keep the dock open and the Mac awake.';

        menu.append(title, row('Autoplay (set and forget)', autoBox), row('Playback lock (ignore other presses while live)', lockBox), row('Loop the playlist', loopBox), selLabel, msg, note);
        document.body.appendChild(menu);
        const r = at instanceof Element ? at.getBoundingClientRect() : { left: at.x, bottom: at.y };
        const w = menu.offsetWidth;
        const h = menu.offsetHeight;
        menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
        menu.style.top = Math.max(8, Math.min(r.bottom + 4, window.innerHeight - h - 8)) + 'px';
        document.addEventListener('keydown', onKey, true);
      }

      document.addEventListener('click', close);
      return { open, close };
    })();

    // ===== File Import =====
    MS.fileImport = (() => {
      const btnAdd = document.getElementById('btn-add-input');
      const fileInput = document.getElementById('file-input');
      const pickerModal = document.getElementById('picker-modal');
      const pickerList = document.getElementById('picker-list');
      const pickerCancel = document.getElementById('picker-cancel');
      const pickerFilename = document.getElementById('picker-filename');

      btnAdd.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileInput.value = '';
        await importFile(file);
      });

      async function importFile(file, targetScene = null) {
        const { name, size, lastModified } = file;

        let resolveResult;
        try {
          const resp = await fetch('/api/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, size, lastModified }),
          });
          resolveResult = await resp.json();
        } catch (err) {
          alert('MediaSheet server is unreachable — restart the server to add new files. Existing inputs are unaffected.');
          return;
        }

        if (resolveResult.error === 'not_found') {
          alert(resolveResult.message);
          return;
        }
        if (resolveResult.error) {
          alert(resolveResult.message || 'File resolution failed.');
          return;
        }

        let filePath;
        if (resolveResult.path) {
          filePath = resolveResult.path;
        } else if (resolveResult.matches) {
          filePath = await showPicker(name, resolveResult.matches);
          if (!filePath) return;
        }

        await createOBSInput(name, filePath, targetScene);
      }

      function showPicker(filename, matches) {
        return new Promise((resolve) => {
          pickerFilename.textContent = `Select the correct "${filename}":`;
          pickerList.innerHTML = '';

          for (const m of matches) {
            const li = document.createElement('li');
            const pathDiv = document.createElement('div');
            pathDiv.className = 'picker-path';
            pathDiv.textContent = m.path;
            li.appendChild(pathDiv);

            const metaDiv = document.createElement('div');
            metaDiv.className = 'picker-meta';
            const sizeKB = Math.round(m.size / 1024);
            const date = new Date(m.modified).toLocaleString();
            metaDiv.textContent = `${sizeKB} KB · ${date}`;
            li.appendChild(metaDiv);

            li.addEventListener('click', () => {
              pickerModal.hidden = true;
              resolve(m.path);
            });
            pickerList.appendChild(li);
          }

          pickerCancel.onclick = () => {
            pickerModal.hidden = true;
            resolve(null);
          };

          pickerModal.hidden = false;
        });
      }

      async function createOBSInput(filename, filePath, targetScene = null) {
        const obs = MS.connection.obs;

        if (targetScene) {
          try {
            const { inputs } = await obs.call('GetInputList');
            const taken = new Set(inputs.map((i) => i.inputName));
            let inputName = filename;
            for (let n = 2; taken.has(inputName); n++) inputName = `${filename} (${n})`;
            // Eye off: a new clip must not appear cued, and nothing in the scene changes until the operator cues it
            const { sceneItemId } = await obs.call('CreateInput', {
              sceneName: targetScene,
              inputName,
              inputKind: 'ffmpeg_source',
              inputSettings: {
                local_file: filePath,
                is_local_file: true,
                restart_on_activate: false,
                close_when_inactive: false,
                clear_on_media_end: false,
              },
              sceneItemEnabled: false,
            });
            await obs.call('SetSceneItemTransform', {
              sceneName: targetScene,
              sceneItemId,
              sceneItemTransform: {
                boundsType: 'OBS_BOUNDS_SCALE_INNER',
                boundsWidth: MS.canvas.width,
                boundsHeight: MS.canvas.height,
                boundsAlignment: 0,
              },
            });
            await obs.call('SetInputAudioMonitorType', {
              inputName,
              monitorType: window.MSPlaylist.routeToMonitorType('both'),
            });
            MS.grid.logEvent(`Added to ${targetScene}: ${filename}`);
          } catch (err) {
            MS.grid.logEvent(`Import failed: ${err.message}`);
            console.error('Import into scene failed:', err);
          }
          return;
        }

        let sceneName = `[MS] ${filename}`;
        let inputName = sceneName;
        try {
          const { scenes } = await obs.call('GetSceneList');
          const { inputs } = await obs.call('GetInputList');
          const sceneNames = new Set(scenes.map((s) => s.sceneName));
          const inputNames = new Set(inputs.map((i) => i.inputName));

          let counter = 1;
          while (sceneNames.has(sceneName) || inputNames.has(inputName)) {
            counter++;
            sceneName = `[MS] ${filename} (${counter})`;
            inputName = sceneName;
          }
        } catch (err) {
          console.error('Failed to check for duplicates:', err);
        }

        try {
          await obs.call('CreateScene', { sceneName });

          const { sceneItemId } = await obs.call('CreateInput', {
            sceneName,
            inputName,
            inputKind: 'ffmpeg_source',
            inputSettings: {
              local_file: filePath,
              is_local_file: true,
              restart_on_activate: false,
              close_when_inactive: false,
              clear_on_media_end: false,
            },
            sceneItemEnabled: true,
          });

          await obs.call('SetSceneItemTransform', {
            sceneName,
            sceneItemId,
            sceneItemTransform: {
              boundsType: 'OBS_BOUNDS_SCALE_INNER',
              boundsWidth: MS.canvas.width,
              boundsHeight: MS.canvas.height,
              boundsAlignment: 0,
            },
          });

          MS.grid.logEvent('Added: ' + filename);
        } catch (err) {
          alert(`Couldn't create scene in OBS. Check that OBS is running and the WebSocket connection is active.\n\n${err.message}`);
        }
      }

      return { importFile };
    })();

    // ===== Init =====
    (function init() {
      // Load fade duration from localStorage
      const savedDuration = localStorage.getItem('ms_transition_duration');
      if (savedDuration) {
        document.getElementById('fade-duration').value = savedDuration;
      }
      document.getElementById('fade-duration').addEventListener('change', (e) => {
        localStorage.setItem('ms_transition_duration', e.target.value);
      });

      document.getElementById('btn-reload').addEventListener('click', () => location.reload());

      // Auto-connect
      const cfg = MS.connection.getConfig();
      MS.connection.connect(cfg.host || 'localhost', cfg.port || 4455, cfg.password || '');
    })();

    // ===== Audio Config Check =====
    // Warns, never blocks: a wrong monitoring device means the room hears the wrong thing.
    MS.audioCheck = (() => {
      const chip = document.getElementById('audio-chip');
      const pop = document.getElementById('audio-pop');

      async function run() {
        if (!MS.connection.connected) { chip.hidden = true; return; }
        const obs = MS.connection.obs;
        const issues = [];
        const expected = MS.store.get().expectedDevice;
        try {
          const { parameterValue } = await obs.call('GetProfileParameter', { parameterCategory: 'Audio', parameterName: 'MonitoringDeviceName' });
          const device = parameterValue ?? 'Default';
          if (device === 'Default') {
            issues.push(`Monitoring Device is Default (follows whatever macOS output is active); expected "${expected}".`);
          } else if (device !== expected) {
            issues.push(`Monitoring Device is "${device}", expected "${expected}".`);
          }
        } catch {
          issues.push('Could not read the Monitoring Device from OBS.');
        }
        try {
          const special = await obs.call('GetSpecialInputs');
          if (special.desktop1 || special.desktop2) {
            issues.push('Desktop Audio is enabled: it captures system audio, including anything you preview on the Mac.');
          }
        } catch {}
        let dup = 'unknown';
        try { dup = (await (await fetch('/api/obs-config')).json()).sceneDuplication; } catch {}
        if (dup === 'false') issues.push('Duplicate Scene is off (per saved OBS config): cueing a scene on Program changes it live.');
        else if (dup !== 'true') issues.push('Can\'t read Duplicate Scene. Restart `npm start` (the server needs the update), then reload this dock.');

        chip.hidden = false;
        chip.className = 'audio-chip ' + (issues.length ? 'warn' : 'ok');
        chip.textContent = issues.length ? `Audio ⚠ ${issues.length}` : 'Audio ✓';
        pop.innerHTML = '';
        const ul = document.createElement('ul');
        for (const text of issues.length ? issues : [`Monitoring Device "${expected}", Desktop Audio off, Duplicate Scene on.`]) {
          const li = document.createElement('li');
          li.textContent = text;
          ul.appendChild(li);
        }
        const note = document.createElement('div');
        note.className = 'small';
        note.textContent = 'Per saved OBS config. Warnings never block a take.';
        pop.append(ul, note);
      }

      // Monitor (House Audio) is what OBS plays clips through; Default Output is the macOS output ("Default" in OBS follows it)
      const bar = document.getElementById('audio-bar');
      const monItem = document.getElementById('audio-monitor');
      const monName = document.getElementById('audio-monitor-name');
      const defItem = document.getElementById('audio-default');
      const defName = document.getElementById('audio-default-name');
      const monPop = document.getElementById('monitor-pop');

      async function readout() {
        if (!MS.connection.connected) { bar.hidden = true; return; }
        let monitor = null;
        try {
          monitor = (await MS.connection.obs.call('GetProfileParameter', { parameterCategory: 'Audio', parameterName: 'MonitoringDeviceName' })).parameterValue || 'Default';
        } catch {}
        let defaultOut = null;
        try { defaultOut = (await (await fetch('/api/audio-devices')).json()).defaultOutput ?? null; } catch {}
        const expected = MS.store.get().expectedDevice;
        const effective = monitor === 'Default' ? defaultOut : monitor;
        bar.hidden = false;
        monName.textContent = monitor === null ? 'unknown' : monitor === 'Default' ? `Default${defaultOut ? ` (${defaultOut})` : ''}` : monitor;
        monName.title = monName.textContent;
        monItem.className = 'audio-item ' + (effective && effective === expected ? 'ok' : 'warn');
        defName.textContent = defaultOut ?? 'unknown';
        defName.title = defName.textContent;
        defItem.className = 'audio-item' + (monitor === 'Default' ? (defaultOut === expected ? ' ok' : ' warn') : '');
      }

      monItem.addEventListener('click', () => {
        const expected = MS.store.get().expectedDevice;
        monPop.innerHTML = '';
        const p1 = document.createElement('div');
        p1.textContent = `Expected house device: "${expected}" (change it in the OBS Connection dialog).`;
        const p2 = document.createElement('div');
        p2.className = 'small';
        p2.textContent = 'To change the Monitoring Device: OBS > Settings > Audio > Advanced > Monitoring Device. OBS only applies it from Settings, so MediaSheet can show it but not change it. "Default" follows the macOS output shown as Default Output.';
        monPop.append(p1, p2);
        monPop.hidden = !monPop.hidden;
      });
      document.addEventListener('click', (e) => { if (!monItem.contains(e.target) && !monPop.contains(e.target)) monPop.hidden = true; });

      chip.addEventListener('click', () => { pop.hidden = !pop.hidden; });
      document.addEventListener('click', (e) => { if (e.target !== chip && !pop.contains(e.target)) pop.hidden = true; });
      setInterval(() => { run().catch(() => {}); readout().catch(() => {}); }, 15000);

      return { run: () => Promise.all([run(), readout()]) };
    })();

    // ===== Hold Last Frame =====
    // OBS clears a media source to black when playback ends unless clear_on_media_end is false.
    // Patches every ffmpeg_source in OBS, including ones MediaSheet didn't import.
    MS.holdFrames = (() => {
      const btn = document.getElementById('btn-hold-frames');

      btn.addEventListener('click', async () => {
        const obs = MS.connection.obs;
        btn.disabled = true;
        try {
          const { inputs } = await obs.call('GetInputList', { inputKind: 'ffmpeg_source' });
          // Read-first: only touch sources whose effective value differs. Safe on live clips (settings updates don't restart them).
          // Videos marked Loop in OBS are backgrounds: left alone.
          const results = await Promise.allSettled(inputs.map(async (input) => {
            const { inputSettings } = await obs.call('GetInputSettings', { inputName: input.inputName });
            if (inputSettings.looping === true) return 'looped';
            return (await MS.manager.normalizeInput(input.inputName, { clear_on_media_end: false })) ? 'changed' : 'same';
          }));
          const count = (v) => results.filter((r) => r.status === 'fulfilled' && r.value === v).length;
          const failed = results.filter((r) => r.status === 'rejected').length;
          MS.grid.logEvent(`Hold last frame: ${count('changed')} changed, ${count('same')} already set, ${count('looped')} looped left alone${failed ? `, ${failed} failed` : ''}`);
        } catch (err) {
          console.error('Hold frames failed:', err);
          MS.grid.logEvent(`Hold frames failed: ${err.message}`);
        } finally {
          btn.disabled = !MS.connection.connected;
        }
      });
    })();

    // ===== Server Health Check =====
    (function serverHealthCheck() {
      const statusEl = document.getElementById('server-status');
      const btnAdd = document.getElementById('btn-add-input');
      let serverUp = true;

      setInterval(async () => {
        try {
          const resp = await fetch('/', { method: 'HEAD' });
          if (!serverUp) {
            serverUp = true;
            statusEl.hidden = true;
            // Re-enable Add Input if OBS is connected
            if (MS.connection.connected) btnAdd.disabled = false;
          }
        } catch {
          if (serverUp) {
            serverUp = false;
            statusEl.hidden = false;
            btnAdd.disabled = true;
          }
        }
      }, 10000);
    })();

    // ===== Browser Tab Sleep Recovery =====
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (MS.connection.connected) {
        // Verify connection is still alive, then rebuild
        MS.connection.obs.call('GetVersion')
          .then(() => MS.grid.rebuild())
          .catch(() => {
            // Connection is stale — disconnect will trigger reconnect loop
            MS.connection.obs.disconnect();
          });
      }
    });
  </script>
</body>
