            MS.grid.logEvent(`Audio fade: out ${plan.outgoing.length}, in ${plan.incoming.length}`);
            MS.audioFade.setNextInMs(durationMs);
            MS.audioFade.fadeOut(plan, durationMs);
          }
          await MS.connection.obs.call('TriggerStudioModeTransition');
          await restartOnTake();
          return true;
        } catch (err) {
          console.error('Fade transition failed:', err);
          return false;
        } finally {
          setPending(false);
        }
      }

      // ----- Stinger -----
      // OBS plays the stinger video over the swap. Its "transition point" is when the picture changes (the video should cover the whole canvas there). The outgoing audio fades out to that moment, the incoming clip restarts just before it (hidden behind the stinger, so it appears near 0:00) and its audio comes up at it.
      const STINGER_RESTART_LEAD_MS = 300;
      let stingerHoldUntil = 0;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      function waitForEvent(name, timeoutMs) {
        return new Promise((resolve) => {
          const obs = MS.connection.obs;
          const done = () => { clearTimeout(timer); obs.off(name, done); resolve(); };
          const timer = setTimeout(done, timeoutMs);
          obs.on(name, done);
        });
      }

      // SetCurrentSceneTransition applies a moment later, so poll until OBS reports the stinger before reading its settings
      async function readStinger() {
        const obs = MS.connection.obs;
        await obs.call('SetCurrentSceneTransition', { transitionName: MS.transitions.stingerName });
        for (let i = 0; i < 40; i++) {
          const t = await obs.call('GetCurrentSceneTransition');
          if (t.transitionName === MS.transitions.stingerName) {
            return window.MSPlaylist.stingerPointMs(t.transitionSettings, MS.canvas.fps);
          }
          await sleep(25);
        }
        throw new Error('OBS did not switch to the stinger');
      }

      let lastStingerPointMs = 1000; // what the engine uses to start a stinger early enough

      async function stinger() {
        if (!MS.connection.connected || pending || !MS.transitions.stingerName) return false;
        setPending(true);
        lastTransitionType = 'stinger';
        try {
          if (await MS.audioFade.retake()) return true;
          const obs = MS.connection.obs;
          const pointMs = await readStinger();
          if (pointMs === null) {
            MS.grid.logEvent('Stinger has no video file: pick one in OBS (Scene Transitions, Stinger, Properties)');
            return false;
          }
          lastStingerPointMs = pointMs;
          const { candidates } = await MS.audioFade.gather();
          const incoming = candidates.filter((c) => !c.live && c.enabledInPreview).map((c) => c.sourceName);
          const plan = await MS.audioFade.prepare();
          const when = window.MSPlaylist.planStingerTiming({ pointMs, fadeMs: plan?.ms ?? 0, restartLeadMs: STINGER_RESTART_LEAD_MS });
          if (plan) {
            MS.grid.logEvent(`Audio fade: out ${plan.outgoing.length}, in ${plan.incoming.length} (stinger, cut at ${pointMs} ms)`);
            MS.audioFade.setNextInMs(plan.ms, pointMs + 1500);
          }
          // The incoming clip activates ~20 ms after the trigger: its restart and fade-up must already be held
          MS.audioFade.holdFadeUpUntil(Date.now() + pointMs);
          stingerHoldUntil = Date.now() + pointMs + 1000;
          const videoEnded = waitForEvent('SceneTransitionVideoEnded', pointMs + 6000);
          await obs.call('TriggerStudioModeTransition');
          const t0 = Date.now();
          MS.audioFade.holdFadeUpUntil(t0 + pointMs);
          stingerHoldUntil = t0 + pointMs + 1000;
          await Promise.all([
            sleep(when.outDelay).then(() => MS.audioFade.fadeOut(plan, plan?.ms)),
            sleep(when.restartDelay).then(() => Promise.all(incoming.map((n) => MS.preroll.restartIncoming(n)))),
            sleep(pointMs).then(() => restartOnTake()),
          ]);
          await videoEnded;
          return true;
        } catch (err) {
          console.error('Stinger transition failed:', err);
          MS.grid.logEvent(`Stinger failed: ${err.message}`);
          return false;
        } finally {
          stingerHoldUntil = 0;
          MS.audioFade.holdFadeUpUntil(0);
          setPending(false);
        }
      }

      async function take(sceneName) {
        if (pending) return;
        // First, load to PVW
        try {
          await MS.connection.obs.call('SetCurrentPreviewScene', { sceneName });
        } catch (err) {
          console.error('SetCurrentPreviewScene failed:', err);
          return;
        }
        MS.grid.currentPvw = sceneName;

        // Then transition using last-selected type
        if (lastTransitionType === 'fade') {
          await fade();
        } else if (lastTransitionType === 'stinger' && MS.transitions.stingerName) {
          await stinger();
        } else {
          await cut();
        }
      }

      async function restartOnTake() {
        // After transition, the new PGM scene's media should restart from the top
        // Wait a tick for the transition event to update currentPgm
        await new Promise((r) => setTimeout(r, 50));
        const pgmTile = MS.grid.getTile(MS.grid.currentPgm);
        if (pgmTile?.isMedia && pgmTile.inputName) {
          try {
            await MS.connection.obs.call('SetMediaInputCursor', {
              inputName: pgmTile.inputName,
              mediaCursor: 0,
            });
            await MS.connection.obs.call('TriggerMediaInputAction', {
              inputName: pgmTile.inputName,
              mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PLAY',
            });
          } catch (err) {
            console.error('Restart-on-take failed:', err);
          }
        }
      }

      function updateButtonHighlight() {
        btnCut.classList.toggle('btn-primary', lastTransitionType === 'cut');
        btnFade.classList.toggle('btn-primary', lastTransitionType === 'fade');
        btnStinger.classList.toggle('btn-primary', lastTransitionType === 'stinger');
      }

      btnCut.addEventListener('click', () => {
        if (MS.autoplay.guard()) return;
        MS.autoplay.noteManual();
        lastTransitionType = 'cut';
        updateButtonHighlight();
        cut();
      });
      btnFade.addEventListener('click', () => {
        if (MS.autoplay.guard()) return;
        MS.autoplay.noteManual();
        lastTransitionType = 'fade';
        updateButtonHighlight();
        const duration = parseInt(fadeDurationInput.value, 10) || 300;
        fade(duration);
      });

      btnStinger.addEventListener('click', () => {
        if (MS.autoplay.guard()) return;
        MS.autoplay.noteManual();
        lastTransitionType = 'stinger';
        updateButtonHighlight();
        stinger();
      });

      updateButtonHighlight();

      return {
        cut,
        fade,
        stinger,
        take,
        stingerHolding: () => Date.now() < stingerHoldUntil,
        isPending: () => pending,
        stingerPointMs: () => lastStingerPointMs,
      };
    })();

    // ===== Scene Grid =====
    MS.grid = (() => {
      const container = document.getElementById('tile-grid');
      const pgmLabel = document.getElementById('pgm-name');
      const pvwLabel = document.getElementById('pvw-name');
      const lastEventEl = document.getElementById('last-event');
      const tiles = new Map(); // sceneName → tile object
      let currentPgm = null;
      let currentPvw = null;
      let pollTimers = [];

      function logEvent(msg) {
        lastEventEl.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      }

      function isMediaSheet(sceneName) {
        return sceneName.startsWith('[MS] ');
      }

      function formatTime(ms) {
        if (ms == null || ms < 0) return '--:--';
        const totalSec = Math.floor(ms / 1000);
        const min = Math.floor(totalSec / 60);
        const sec = totalSec % 60;
        return String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      }

      function createTileElement(sceneName, inputName, isMedia) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.scene = sceneName;

        // Thumbnail
        const thumb = document.createElement('div');
        thumb.className = 'tile-thumbnail';
        const fallback = document.createElement('span');
        fallback.className = 'fallback-icon';
        fallback.textContent = isMedia ? '🎬' : '📷';
        thumb.appendChild(fallback);
        tile.appendChild(thumb);

        // Label
        const label = document.createElement('div');
        label.className = 'tile-label';
        label.textContent = isMedia ? sceneName.replace('[MS] ', '') : sceneName;
        label.title = sceneName;
        tile.appendChild(label);

        if (isMedia) {
          // Transport controls
          const transport = document.createElement('div');
          transport.className = 'tile-transport';
          const btns = [
            { icon: '▶', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PLAY', cls: 'play' },
            { icon: '⏸', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PAUSE', cls: 'pause' },
            { icon: '⏹', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_STOP', cls: 'stop' },
            { icon: '⏮', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART', cls: 'restart' },
          ];
          for (const b of btns) {
            const btn = document.createElement('button');
            btn.className = 'btn-transport';
            btn.dataset.action = b.action;
            btn.dataset.cls = b.cls;
            btn.textContent = b.icon;
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              MS.transport.action(inputName, b.action);
            });
            transport.appendChild(btn);
          }
          tile.appendChild(transport);

          // Progress bar
          const progress = document.createElement('div');
          progress.className = 'tile-progress';
          const bar = document.createElement('div');
          bar.className = 'progress-bar';
          const fill = document.createElement('div');
          fill.className = 'progress-bar-fill';
          bar.appendChild(fill);
          bar.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = bar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            const tileData = tiles.get(sceneName);
            if (tileData && tileData.duration > 0) {
              MS.transport.seek(inputName, Math.round(pct * tileData.duration));
            }
          });
          progress.appendChild(bar);
          const time = document.createElement('span');
          time.className = 'progress-time';
          time.textContent = '--:-- / --:--';
          progress.appendChild(time);
          tile.appendChild(progress);

          // Audio controls
          const audio = document.createElement('div');
          audio.className = 'tile-audio';
          const muteBtn = document.createElement('button');
          muteBtn.className = 'btn-mute';
          muteBtn.textContent = '🔊';
          muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            MS.audio.toggleMute(inputName);
          });
          audio.appendChild(muteBtn);
          const slider = document.createElement('input');
          slider.type = 'range';
          slider.className = 'volume-slider';
          slider.min = '-60';
          slider.max = '0';
          slider.step = '1';
          slider.value = '0';
          let debounceTimer = null;
          slider.addEventListener('input', (e) => {
            e.stopPropagation();
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
              MS.audio.setVolume(inputName, parseFloat(slider.value));
            }, 50);
          });
          slider.addEventListener('click', (e) => e.stopPropagation());
          audio.appendChild(slider);
          tile.appendChild(audio);
        }

        // Click → PVW
        tile.addEventListener('click', () => {
          if (MS.autoplay.guard()) return;
          MS.autoplay.noteManual();
          if (MS.connection.connected) {
            MS.connection.obs.call('SetCurrentPreviewScene', { sceneName: tile.dataset.scene })
              .catch((err) => console.error('SetCurrentPreviewScene failed:', err));
          }
        });

        // Double-click → Take to PGM
        tile.addEventListener('dblclick', () => {
          if (MS.autoplay.guard()) return;
          MS.autoplay.noteManual();
          if (MS.connection.connected && MS.transitions) {
            MS.transitionControl.take(tile.dataset.scene);
          }
        });

        // Drag to reorder (order is saved in MediaSheet; a playlist's box travels with its tile)
        tile.draggable = true;
        // Sliders and buttons inside a tile must keep their own drags
        tile.addEventListener('pointerdown', (e) => { tile.draggable = !e.target.closest('input, select, textarea'); });
        tile.addEventListener('dragstart', (e) => {
          MS.drag = { kind: 'scene', id: tile.dataset.scene };
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', tile.dataset.scene);
        });
        tile.addEventListener('dragover', (e) => {
          if (MS.drag?.kind !== 'scene' || MS.drag.id === tile.dataset.scene) return;
          e.preventDefault();
          const side = window.MSPlaylist.dropSide(e.clientX, tile.getBoundingClientRect());
          tile.classList.toggle('drop-before', side === 'before');
          tile.classList.toggle('drop-after', side === 'after');
        });
        tile.addEventListener('dragleave', () => tile.classList.remove('drop-before', 'drop-after'));
        tile.addEventListener('drop', (e) => {
          tile.classList.remove('drop-before', 'drop-after');
          if (MS.drag?.kind !== 'scene') return;
          e.preventDefault();
          const from = MS.drag.id;
          const after = window.MSPlaylist.dropSide(e.clientX, tile.getBoundingClientRect()) === 'after';
          MS.drag = null;
          MS.grid.moveScene(from, tile.dataset.scene, after);
        });
        tile.addEventListener('dragend', () => { MS.drag = null; document.querySelectorAll('.drop-before, .drop-after').forEach((el) => el.classList.remove('drop-before', 'drop-after')); });

        // Right-click → context menu (media tiles only)
        if (isMedia) {
          tile.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            MS.contextMenu.show(e.clientX, e.clientY, tile.dataset.scene);
          });
        }

        return tile;
      }

      async function discoverInputName(sceneName) {
        try {
          const { sceneItems } = await MS.connection.obs.call('GetSceneItemList', { sceneName });
          if (sceneItems.length > 0) {
            return sceneItems[0].sourceName;
          }
        } catch {}
        return sceneName;
      }

      async function fetchThumbnail(sceneName, thumbEl) {
        try {
          const result = await MS.connection.obs.call('GetSourceScreenshot', {
            sourceName: sceneName,
            imageFormat: 'jpg',
            imageWidth: 320,
            imageCompressionQuality: 60,
          });
          if (result.imageData) {
            thumbEl.innerHTML = '';
            const img = document.createElement('img');
            img.src = result.imageData;
            thumbEl.appendChild(img);
          }
        } catch {
          // Source may not have rendered yet — keep fallback icon
        }
      }

      function updateTally() {
        for (const [sceneName, tile] of tiles) {
          tile.el.classList.remove('tally-pgm', 'tally-pvw');
          if (sceneName === currentPgm) tile.el.classList.add('tally-pgm');
          else if (sceneName === currentPvw) tile.el.classList.add('tally-pvw');
        }
        pgmLabel.textContent = currentPgm || '—';
        pvwLabel.textContent = currentPvw || '—';
      }

      // Saved order first, scenes it has not seen yet after it (in OBS order); a playlist's box follows its tile
      function applyOrder() {
        const order = window.MSPlaylist.mergeOrder(MS.store.get().sceneOrder, [...tiles.keys()]);
        const boxes = new Map([...container.querySelectorAll('.subgrid-row')].map((r) => [r.dataset.scene, r]));
        for (const name of order) {
          container.appendChild(tiles.get(name).el);
          const row = boxes.get(name);
          if (row) container.appendChild(row);
        }
      }

      async function moveScene(from, to, after = false) {
        const names = [...tiles.keys()];
        const next = window.MSPlaylist.moveBefore(window.MSPlaylist.mergeOrder(MS.store.get().sceneOrder, names), from, to, after);
        await MS.store.update((d) => ({ ...d, sceneOrder: next }));
        applyOrder();
        logEvent(`Moved scene: ${from}`);
      }

      async function rebuild() {
        stopPolling();
        try {
          const { scenes, currentProgramSceneName, currentPreviewSceneName } =
            await MS.connection.obs.call('GetSceneList');
          currentPgm = currentProgramSceneName;
          currentPvw = currentPreviewSceneName;

          const currentSceneNames = new Set(scenes.map((s) => s.sceneName));

          // A reconnect or OBS restart makes every cached scan stale
          MS.playlists.reset();
          for (const [name, tile] of tiles) {
            if (!currentSceneNames.has(name)) continue;
            const scan = await MS.playlists.scan(name).catch(() => null);
            tile.isPlaylist = !!scan?.detection.auto;
            if (tile.isPlaylist) tile.isMedia = false;
          }

          // Remove tiles for scenes that no longer exist
          for (const [name] of tiles) {
            if (!currentSceneNames.has(name)) {
              tiles.get(name).el.remove();
              tiles.delete(name);
            }
          }

          // Add tiles for new scenes (reverse — OBS returns bottom-to-top)
          for (const scene of [...scenes].reverse()) {
            if (!tiles.has(scene.sceneName)) {
              const scan = await MS.playlists.scan(scene.sceneName).catch(() => null);
              // A scene that only holds audio files is a sound bed for the music strip, not something to cut to
              if (scan && !isMediaSheet(scene.sceneName) && window.MSPlaylist.isAudioOnlyScene(scan.items)) continue;
              const isPlaylist = !!scan?.detection.auto;
              const isMedia = isMediaSheet(scene.sceneName) && !isPlaylist;
              const inputName = isMedia
                ? await discoverInputName(scene.sceneName)
                : null;
              const el = createTileElement(scene.sceneName, inputName, isMedia);
              container.appendChild(el);

              const tileData = {
                sceneName: scene.sceneName,
                inputName,
                el,
                isMedia,
                isPlaylist,
                duration: 0,
                cursor: 0,
                mediaState: null,
              };
              tiles.set(scene.sceneName, tileData);
              if (isMedia && inputName) {
                MS.audio.loadInitialState(inputName, el);
              }

              // With Duplicate Scene a scene screenshot shows the Preview edit state, so playlists skip it
              if (!isPlaylist) {
                const thumbEl = el.querySelector('.tile-thumbnail');
                fetchThumbnail(scene.sceneName, thumbEl);
              }
            }
          }

          updateTally();
          startPolling();
          if (MS.subgrid) MS.subgrid.renderAll();
          applyOrder();
          logEvent('Grid rebuilt');
        } catch (err) {
          console.error('Failed to rebuild grid:', err);
        }
      }

      // Polling
      function startPolling() {
        // PGM tile: 500ms media status + 5s screenshot
        // Other tiles: 2s media status
        const pgmMediaPoll = setInterval(() => {
          if (!currentPgm) return;
          const tile = tiles.get(currentPgm);
          if (tile?.isMedia) updateMediaStatus(tile);
        }, 500);

        const otherMediaPoll = setInterval(() => {
          for (const [name, tile] of tiles) {
            if (!tile.isMedia || name === currentPgm) continue;
            updateMediaStatus(tile);
          }
        }, 2000);

        const pgmScreenshotPoll = setInterval(() => {
          if (!currentPgm) return;
          const tile = tiles.get(currentPgm);
          if (tile && !tile.isPlaylist) {
            const thumbEl = tile.el.querySelector('.tile-thumbnail');
            fetchThumbnail(currentPgm, thumbEl);
          }
        }, 5000);

        pollTimers = [pgmMediaPoll, otherMediaPoll, pgmScreenshotPoll];
      }

      function stopPolling() {
        for (const t of pollTimers) clearInterval(t);
        pollTimers = [];
      }

      async function updateMediaStatus(tile) {
        if (!tile.inputName || !MS.connection.connected) return;
        try {
          const status = await MS.connection.obs.call('GetMediaInputStatus', {
            inputName: tile.inputName,
          });

          tile.duration = status.mediaDuration || 0;
          tile.cursor = status.mediaCursor || 0;
          tile.mediaState = status.mediaState;

          // Update progress bar
          const fill = tile.el.querySelector('.progress-bar-fill');
          const timeEl = tile.el.querySelector('.progress-time');
          if (fill && tile.duration > 0) {
            fill.style.width = ((tile.cursor / tile.duration) * 100) + '%';
          }
          if (timeEl) {
            timeEl.textContent = formatTime(tile.cursor) + ' / ' + formatTime(tile.duration);
          }

          // Update transport button states
          const transportBtns = tile.el.querySelectorAll('.btn-transport');
          for (const btn of transportBtns) {
            btn.classList.remove('active');
            const state = status.mediaState;
            if (btn.dataset.cls === 'play' && state === 'OBS_MEDIA_STATE_PLAYING') btn.classList.add('active');
            if (btn.dataset.cls === 'pause' && state === 'OBS_MEDIA_STATE_PAUSED') btn.classList.add('active');
            if (btn.dataset.cls === 'stop' && (state === 'OBS_MEDIA_STATE_STOPPED' || state === 'OBS_MEDIA_STATE_ENDED')) btn.classList.add('active');
          }
        } catch {}
      }

      return {
        rebuild,
        applyOrder,
        moveScene,
        tiles,
        getTile: (name) => tiles.get(name),
        get currentPgm() { return currentPgm; },
        set currentPgm(v) { currentPgm = v; updateTally(); },
        get currentPvw() { return currentPvw; },
        set currentPvw(v) { currentPvw = v; updateTally(); },
        logEvent,
        updateTally,
      };
    })();

    // ===== OBS Event Handlers =====
    (function registerEvents() {
      const obs = MS.connection.obs;

      obs.on('CurrentProgramSceneChanged', (data) => {
        MS.grid.currentPgm = data.sceneName;
        MS.grid.logEvent('PGM → ' + data.sceneName);
      });

      obs.on('CurrentPreviewSceneChanged', (data) => {
        MS.grid.currentPvw = data.sceneName;
        MS.grid.logEvent('PVW → ' + data.sceneName);
      });

      obs.on('SceneCreated', (data) => {
        MS.grid.rebuild();
        MS.grid.logEvent('Scene created: ' + data.sceneName);
      });

      obs.on('SceneRemoved', (data) => {
        MS.grid.rebuild();
        MS.grid.logEvent('Scene removed: ' + data.sceneName);
      });

      obs.on('SceneNameChanged', (data) => {
        const { oldSceneName, sceneName } = data;
        // Name-keyed state (Managed, sub-grid choice, scan cache, row) follows the rename.
        MS.manager.renameScene(oldSceneName, sceneName);
        MS.playlists.forget(oldSceneName);
        (async () => {
          await MS.store.update((d) => {
            const subgrid = { ...d.subgrid };
            if (oldSceneName in subgrid) {
              subgrid[sceneName] = subgrid[oldSceneName];
              delete subgrid[oldSceneName];
            }
            return {
              ...d,
              managed: d.managed.map((n) => (n === oldSceneName ? sceneName : n)),
              unmanaged: d.unmanaged.map((n) => (n === oldSceneName ? sceneName : n)),
              collapsed: d.collapsed.map((n) => (n === oldSceneName ? sceneName : n)),
              sceneOrder: d.sceneOrder.map((n) => (n === oldSceneName ? sceneName : n)),
              clipOrder: Object.fromEntries(Object.entries(d.clipOrder).map(([k, v]) => [k === oldSceneName ? sceneName : k, v])),
              playlistOptions: Object.fromEntries(Object.entries(d.playlistOptions).map(([k, v]) => [k === oldSceneName ? sceneName : k, v])),
              subgrid,
            };
          });
          await MS.playlists.scan(sceneName).catch(() => null);
          MS.subgrid.render(oldSceneName);
          MS.subgrid.render(sceneName);
        })().catch((err) => console.error('Rename follow-up failed:', err));
        const tile = MS.grid.tiles.get(data.oldSceneName);
        if (tile) {
          tile.sceneName = data.sceneName;
          tile.el.dataset.scene = data.sceneName;
          const label = tile.el.querySelector('.tile-label');
          if (label) {
            label.textContent = data.sceneName.startsWith('[MS] ')
              ? data.sceneName.replace('[MS] ', '')
              : data.sceneName;
            label.title = data.sceneName;
          }
          MS.grid.tiles.delete(data.oldSceneName);
          MS.grid.tiles.set(data.sceneName, tile);
          if (MS.grid.currentPgm === data.oldSceneName) MS.grid.currentPgm = data.sceneName;
          if (MS.grid.currentPvw === data.oldSceneName) MS.grid.currentPvw = data.sceneName;
        }
        MS.grid.logEvent('Renamed: ' + data.oldSceneName + ' → ' + data.sceneName);
      });

      obs.on('InputNameChanged', (data) => {
        for (const [, tile] of MS.grid.tiles) {
          if (tile.inputName === data.oldInputName) {
            tile.inputName = data.inputName;
            break;
          }
        }
      });

      obs.on('StudioModeStateChanged', (data) => {
        if (!data.studioModeEnabled) {
          MS.connection.obs.call('SetStudioModeEnabled', { studioModeEnabled: true })
            .catch(() => console.warn('Could not re-enable studio mode'));
        }
      });
    })();

    // ===== Context Menu =====
    MS.contextMenu = (() => {
      const menu = document.getElementById('context-menu');
      const btnRemove = document.getElementById('ctx-remove');
      let targetScene = null;

      function show(x, y, sceneName) {
        targetScene = sceneName;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.hidden = false;
      }

      function hide() {
        menu.hidden = true;
        targetScene = null;
      }

      btnRemove.addEventListener('click', async () => {
        if (!targetScene || MS.autoplay.guard()) return;
        try {
          await MS.connection.obs.call('RemoveScene', { sceneName: targetScene });
        } catch (err) {
          console.error('Failed to remove scene:', err);
        }
        hide();
      });

      document.addEventListener('click', hide);

      return { show, hide };
    })();

    // ===== Playlist Sub-grid =====
    MS.subgrid = (() => {
      const container = document.getElementById('tile-grid');
      const rows = new Map(); // sceneName → row element
      const clips = new Map(); // `${sceneName}|${sceneItemId}` → { el, badge, fill, item, active }
      const meters = new Map(); // inputName → latest peak (linear)
      const rescanTimers = new Map();
      const key = (scene, id) => `${scene}|${id}`;

      // ---- joined look: colors per playlist, and the classes/variables that make tile + box one shape ----
      const PALETTE = ['#2f6fd6', '#c98a1b', '#2f9e4f', '#8a52d6', '#1b9aa6', '#d65a8a'];
      const colorFor = (name) => PALETTE[[...name].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7) % PALETTE.length];
      // mix a #rrggbb color into the dock background so a tile and its box share one flat fill
      function tintOf(hex, amount) {
        const base = [0x1d, 0x1f, 0x26];
        const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
        return '#' + c.map((v, i) => Math.round(base[i] + (v - base[i]) * amount).toString(16).padStart(2, '0')).join('');
      }

      const isCollapsed = (sceneName) => MS.store.get().collapsed.includes(sceneName);

      async function setCollapsed(sceneName, on) {
        await MS.store.update((d) => ({
          ...d,
          collapsed: on ? [...new Set([...d.collapsed, sceneName])] : d.collapsed.filter((n) => n !== sceneName),
        }));
        decorate(sceneName);
      }

      function expand(sceneName) {
        if (isCollapsed(sceneName)) setCollapsed(sceneName, false).catch(() => {});
      }

      function decorate(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        if (!tile) return;
        const scan = MS.playlists.getScan(sceneName);
        const playlist = !!scan?.detection.auto;
        const row = rows.get(sceneName);
        const collapsed = isCollapsed(sceneName);
        const color = playlist ? colorFor(sceneName) : '#5A5F70';
        const tint = tintOf(color, 0.16);
        if (row) row.hidden = collapsed;
        tile.el.classList.toggle('pl', playlist || !!row);
        tile.el.classList.toggle('pl-open', !!row && !collapsed);
        tile.el.classList.toggle('pl-collapsed', !!row && collapsed);
        const label = tile.el.querySelector('.tile-label');
        if (label) label.dataset.sub = playlist ? `${scan.detection.clips.length} clips` : '';
        for (const el of [tile.el, row]) {
          if (!el) continue;
          el.style.setProperty('--pl-color', color);
          el.style.setProperty('--pl-tint', tint);
        }
      }

      function showing(sceneName) {
        const scan = MS.playlists.getScan(sceneName);
        if (!scan || scan.items.length < 2) return false;
        if (scan.detection.auto) return true;
        return MS.store.get().subgrid[sceneName] === true;
      }

      function thumbUrl(file) {
        return `/api/thumb?path=${encodeURIComponent(file)}`;
      }

      function setThumb(thumbEl, file) {
        if (!file) return;
        const img = document.createElement('img');
        img.onload = () => { thumbEl.innerHTML = ''; thumbEl.appendChild(img); };
        img.src = thumbUrl(file);
      }

      function buildClip(sceneName, item) {
        const el = document.createElement('div');
        el.className = 'clip-tile';
        el.dataset.scene = sceneName;
        el.dataset.item = item.sceneItemId;

        const thumb = document.createElement('div');
        thumb.className = 'tile-thumbnail';
        const fallback = document.createElement('span');
        fallback.className = 'fallback-icon';
        fallback.textContent = item.kind === 'image' ? '🖼' : '🎬';
        thumb.appendChild(fallback);
        setThumb(thumb, item.file);
        el.appendChild(thumb);

        const badge = document.createElement('div');
        badge.className = 'clip-badge';
        el.appendChild(badge);

        const restart = document.createElement('button');
        restart.className = 'clip-restart';
        restart.textContent = '↺';
        restart.title = 'Restart this live clip from 0:00';
        restart.hidden = true;
        restart.addEventListener('click', (e) => {
          e.stopPropagation();
          if (MS.autoplay.guard()) return;
          MS.cue.restartLive(item);
        });
        el.appendChild(restart);

        // Toggled (non-playlist) sub-grids are read-only: cueing there would switch off a camera behind an overlay
        const cueable = !!MS.playlists.getScan(sceneName)?.detection.auto;
        if (cueable) {
          el.classList.add('cueable');
          el.addEventListener('click', () => {
            if (MS.autoplay.guard()) return;
            MS.autoplay.noteManual();
            MS.cue.cueClip(sceneName, item);
          });
        }

        const name = document.createElement('div');
        name.className = 'clip-name';
        name.textContent = item.sourceName;
        name.title = item.sourceName;
        el.appendChild(name);

        const meter = document.createElement('div');
        meter.className = 'clip-meter';
        const fill = document.createElement('div');
        fill.className = 'clip-meter-fill';
        meter.appendChild(fill);
        el.appendChild(meter);

        const silent = document.createElement('div');
        silent.className = 'clip-silent';
        el.appendChild(silent);

        let route = null;
        if (cueable && item.kind === 'video') {
          route = document.createElement('select');
          route.className = 'clip-route';
          for (const [v, label] of [['both', 'Room + stream'], ['room', 'Room only'], ['stream', 'Stream only']]) {
            const o = document.createElement('option');
            o.value = v;
            o.textContent = label;
            route.appendChild(o);
          }
          route.addEventListener('click', (e) => e.stopPropagation());
          route.addEventListener('change', () => setRoute(c, route.value));
          el.appendChild(route);
        }

        // Drag to reorder within this playlist (saved in MediaSheet)
        el.draggable = true;
        el.addEventListener('pointerdown', (e) => { el.draggable = !e.target.closest('select, input'); });
        el.addEventListener('dragstart', (e) => {
          MS.drag = { kind: 'clip', scene: sceneName, id: item.sceneItemId };
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(item.sceneItemId));
        });
        el.addEventListener('dragover', (e) => {
          if (MS.drag?.kind !== 'clip' || MS.drag.scene !== sceneName || MS.drag.id === item.sceneItemId) return;
          e.preventDefault();
          const side = window.MSPlaylist.dropSide(e.clientX, el.getBoundingClientRect());
          el.classList.toggle('drop-before', side === 'before');
          el.classList.toggle('drop-after', side === 'after');
        });
        el.addEventListener('dragleave', () => el.classList.remove('drop-before', 'drop-after'));
        el.addEventListener('drop', (e) => {
          el.classList.remove('drop-before', 'drop-after');
          if (MS.drag?.kind !== 'clip' || MS.drag.scene !== sceneName) return;
          e.preventDefault();
          const from = MS.drag.id;
          const after = window.MSPlaylist.dropSide(e.clientX, el.getBoundingClientRect()) === 'after';
          MS.drag = null;
          moveClip(sceneName, from, item.sceneItemId, after).catch((err) => console.error('Clip move failed:', err));
        });
        el.addEventListener('dragend', () => { MS.drag = null; document.querySelectorAll('.drop-before, .drop-after').forEach((x) => x.classList.remove('drop-before', 'drop-after')); });

        const c = { el, badge, fill, thumb, restart, route, silent, item, active: false };
        return c;
      }

      function applyState(sceneName, c) {
        const state = c.active ? 'pgm' : c.item.enabled ? 'pvw' : 'idle';
        c.el.classList.toggle('tally-pgm', state === 'pgm');
        c.el.classList.toggle('tally-pvw', state === 'pvw');
        c.badge.textContent = state === 'pgm' ? 'LIVE' : state === 'pvw' ? 'CUED' : '';
        c.restart.hidden = !(state === 'pgm' && c.item.kind === 'video');
        if (c.route) c.route.disabled = c.active;
        if (c.route) c.route.title = c.active ? 'Live clip: route is locked while on Program' : 'Where this clip\'s sound goes';
        if (state !== 'pgm') c.fill.style.width = '0%';
      }

      function updateParentThumb(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        const scan = MS.playlists.getScan(sceneName);
        if (!tile || !scan || !tile.isPlaylist) return;
        const live = scan.detection.clips.find((it) => clips.get(key(sceneName, it.sceneItemId))?.active);
        const pick = live || scan.detection.clips[0];
        if (pick?.file) setThumb(tile.el.querySelector('.tile-thumbnail'), pick.file);
      }

      function paintRoute(c, route) {
        if (!c.route) return;
        c.route.value = route;
        c.silent.textContent = route === 'stream' ? 'SILENT IN ROOM' : '';
      }

      async function loadRoute(c) {
        if (!c.route) return;
        try {
          const { monitorType } = await MS.connection.obs.call('GetInputAudioMonitorType', { inputName: c.item.sourceName });
          let route = window.MSPlaylist.monitorTypeToRoute(monitorType);
          // A clip at None that was never chosen as Stream only gets Room + stream when it is cued or goes live
          if (route === 'stream' && !MS.store.get().streamOnly.includes(c.item.sourceName)) route = 'both';
          paintRoute(c, route);
        } catch {}
      }

      async function setRoute(c, route) {
        if (c.active) { loadRoute(c); return; }
        const name = c.item.sourceName;
        try {
          await MS.connection.obs.call('SetInputAudioMonitorType', {
            inputName: name,
            monitorType: window.MSPlaylist.routeToMonitorType(route),
          });
          await MS.store.update((d) => ({
            ...d,
            streamOnly: route === 'stream'
              ? [...new Set([...d.streamOnly, name])]
              : d.streamOnly.filter((n) => n !== name),
          }));
          paintRoute(c, route);
        } catch (err) {
          MS.grid.logEvent(`Route change failed: ${err.message}`);
          loadRoute(c);
        }
      }

      async function refreshTally(sceneName) {
        const scan = MS.playlists.getScan(sceneName);
        if (!scan) return;
        const actives = await Promise.all(scan.items.map((it) =>
          MS.connection.obs.call('GetSourceActive', { sourceName: it.sourceName })
            .then((r) => r.videoActive)
            .catch(() => false)));
        scan.items.forEach((it, i) => {
          const c = clips.get(key(sceneName, it.sceneItemId));
          if (c) { c.active = actives[i]; c.item = it; applyState(sceneName, c); }
        });
        updateParentThumb(sceneName);
        paintStrip();
      }

      // The clip live on Program and the clip cued in Preview (a clip enabled in the scene but not live)
      const SHOW_LIVE_CUED = false; // hidden for now (Matt); set to true to bring the strip back
      function paintStrip() {
        const strip = document.getElementById('lc-strip');
        if (!strip) return;
        const all = [...clips.entries()].map(([k, c]) => ({ scene: k.split('|')[0], c }));
        strip.hidden = !SHOW_LIVE_CUED || rows.size === 0;
        const live = all.filter((x) => x.c.active && x.scene === MS.grid.currentPgm)[0] ?? all.find((x) => x.c.active);
        const cued = all.filter((x) => !x.c.active && x.c.item.enabled && x.scene === MS.grid.currentPvw)[0] ?? all.find((x) => !x.c.active && x.c.item.enabled);
        const fill = (thumb, name, hit, empty) => {
          document.getElementById(name).textContent = hit ? hit.c.item.sourceName : empty;
          document.getElementById(name).title = hit ? hit.c.item.sourceName : '';
          document.getElementById(thumb).style.backgroundImage = hit?.c.item.file ? `url("${thumbUrl(hit.c.item.file)}")` : 'none';
        };
        fill('lc-live-thumb', 'lc-live-name', live, 'nothing live');
        fill('lc-cued-thumb', 'lc-cued-name', cued, 'nothing cued');
      }

      function ensureToggle(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        const scan = MS.playlists.getScan(sceneName);
        if (!tile) return;
        let btn = tile.el.querySelector('.btn-clips');
        const eligible = !!scan && scan.items.length >= 2;
        let chev = tile.el.querySelector('.btn-collapse');
        if (eligible && scan.detection.auto) {
          btn?.remove();
          if (!chev) {
            chev = document.createElement('button');
            chev.className = 'btn-collapse';
            chev.setAttribute('aria-label', 'Collapse or expand this playlist\'s clips');
            chev.title = 'Collapse or expand the clips';
            chev.appendChild(document.createElement('span'));
            const stop = (e) => e.stopPropagation(); // a click here must not also preview or take the scene
            chev.addEventListener('dblclick', stop);
            chev.addEventListener('click', (e) => {
              e.stopPropagation();
              setCollapsed(sceneName, !isCollapsed(sceneName)).catch(() => {});
            });
            tile.el.appendChild(chev); // not the thumbnail: its picture is replaced when a clip thumbnail loads
          }
          if (scan.detection.kind === 'video' && !tile.el.dataset.plMenu) {
            tile.el.dataset.plMenu = '1';
            tile.el.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              e.stopPropagation();
              MS.playlistMenu.open(sceneName, { x: e.clientX, y: e.clientY });
            });
          }
          paintAuto(sceneName);
          return;
        }
        chev?.remove();
        tile.el.querySelector('.auto-badge')?.remove();
        if (!eligible) { btn?.remove(); return; }
        if (!btn) {
          btn = document.createElement('button');
          btn.className = 'btn-clips';
          btn.textContent = 'clips';
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const next = !showing(sceneName);
            await MS.store.update((d) => ({ ...d, subgrid: { ...d.subgrid, [sceneName]: next } }));
            render(sceneName);
          });
          tile.el.querySelector('.tile-thumbnail').appendChild(btn);
        }
        btn.classList.toggle('on', showing(sceneName));
      }

      // AUTO badge on the tile and in the box header while autoplay is armed: set and forget needs the state visible
      function paintAuto(sceneName) {
        const on = !!MS.store.get().playlistOptions[sceneName]?.autoplay;
        const held = on && MS.autoplay.isHeld(sceneName);
        const locked = on && !!MS.store.get().playlistOptions[sceneName]?.lock;
        const text = held ? 'AUTO · HELD' : locked ? 'AUTO 🔒' : 'AUTO';
        const why = MS.autoplay.heldWhy(sceneName) || 'manual cue';
        const title = held ? `Autoplay stood down (${why}). Click to resume now; it also resumes when your take lands or the clip ends.`
          : locked ? 'Autoplay is on with Playback lock: presses on other scenes and clips are ignored while this playlist is live'
          : 'Autoplay is on for this playlist';
        const style = (el) => {
          el.textContent = text;
          el.title = title;
          el.classList.toggle('held', held);
          el.classList.toggle('locked', locked && !held);
          // The HELD badge is a button: click to resume (stopPropagation so the tile underneath is not previewed or taken)
          el.style.pointerEvents = held ? 'auto' : '';
          el.style.cursor = held ? 'pointer' : '';
          el.onclick = held ? (e) => { e.stopPropagation(); MS.autoplay.resume(sceneName); } : null;
          el.ondblclick = held ? (e) => e.stopPropagation() : null;
        };
        const tile = MS.grid.getTile(sceneName);
        if (tile) {
          let badge = tile.el.querySelector(':scope > .auto-badge');
          if (on && !badge) {
            badge = document.createElement('span');
            badge.className = 'auto-badge';
            tile.el.appendChild(badge);
          }
          if (on) style(badge);
          else badge?.remove();
        }
        const head = rows.get(sceneName)?.querySelector('.head-auto');
        if (head) { head.hidden = !on; if (on) style(head); }
      }

      function displayedItems(scan) {
        return scan.detection.auto ? scan.detection.clips : scan.items;
      }

      // Same clips already on screen: update in place so thumbnails don't flicker
      function reuseRow(sceneName, scan) {
        if (!rows.has(sceneName) || !showing(sceneName)) return false;
        const shown = displayedItems(scan).map((i) => String(i.sceneItemId));
        const current = [...clips.keys()].filter((k) => k.startsWith(sceneName + '|')).map((k) => k.split('|')[1]);
        if (shown.length !== current.length || !shown.every((id) => current.includes(id))) return false;
        for (const item of displayedItems(scan)) {
          const c = clips.get(key(sceneName, item.sceneItemId));
          if (c) { c.item = item; applyState(sceneName, c); }
        }
        applyClipOrder(sceneName);
        return true;
      }

      function clipIds(scan) {
        return displayedItems(scan).map((i) => i.sceneItemId).sort((a, b) => a - b);
      }

      // Saved order first, clips it has not seen yet after it
      function applyClipOrder(sceneName) {
        const row = rows.get(sceneName);
        const scan = MS.playlists.getScan(sceneName);
        if (!row || !scan) return;
        const order = window.MSPlaylist.mergeOrder(MS.store.get().clipOrder[sceneName], clipIds(scan));
        const add = row.querySelector('.clip-add');
        for (const id of order) {
          const c = clips.get(key(sceneName, id));
          if (c) row.insertBefore(c.el, add);
        }
      }

      async function moveClip(sceneName, from, to, after = false) {
        const scan = MS.playlists.getScan(sceneName);
        if (!scan) return;
        const next = window.MSPlaylist.moveBefore(window.MSPlaylist.mergeOrder(MS.store.get().clipOrder[sceneName], clipIds(scan)), from, to, after);
        await MS.store.update((d) => ({ ...d, clipOrder: { ...d.clipOrder, [sceneName]: next } }));
        applyClipOrder(sceneName);
      }

      function render(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        const scan = MS.playlists.getScan(sceneName);
        if (tile && scan && reuseRow(sceneName, scan)) {
          ensureToggle(sceneName);
          refreshTally(sceneName);
          return;
        }
        rows.get(sceneName)?.remove();
        rows.delete(sceneName);
        for (const k of [...clips.keys()]) if (k.startsWith(sceneName + '|')) clips.delete(k);
        if (!tile) return;
        ensureToggle(sceneName);
        if (!showing(sceneName)) { decorate(sceneName); return; }

        const row = document.createElement('div');
        row.className = 'subgrid-row';
        row.dataset.scene = sceneName;
        const head = document.createElement('div');
        head.className = 'subgrid-head';
        const title = document.createElement('div');
        title.className = 'subgrid-title';
        title.textContent = `${sceneName} — ${scan.detection.auto ? scan.detection.kind + ' playlist' : 'sources'}`;
        head.appendChild(title);
        if (scan.detection.auto && scan.detection.kind === 'video') {
          const autoTag = document.createElement('span');
          autoTag.className = 'auto-badge head-auto';
          autoTag.textContent = 'AUTO';
          autoTag.hidden = !MS.store.get().playlistOptions[sceneName]?.autoplay;
          head.appendChild(autoTag);
          const options = document.createElement('button');
          options.className = 'btn-manage';
          options.textContent = 'Options';
          options.title = 'Autoplay, loop and the transition between clips';
          options.addEventListener('click', (e) => { e.stopPropagation(); MS.playlistMenu.open(sceneName, options); });
          head.appendChild(options);
        }
        if (scan.detection.auto) {
          const manage = document.createElement('button');
          manage.className = 'btn-manage';
          const paint = () => {
            const on = MS.manager.isManagedPlaylist(sceneName);
            manage.classList.toggle('on', on);
            manage.textContent = on ? 'Managed' : 'Manage';
            manage.title = on
              ? 'MediaSheet handles this playlist: restarts and unmutes a clip when it goes live, mutes it when it leaves, pre-rolls takes, resets idle clips. Click to switch off.'
              : 'MediaSheet leaves this playlist alone. Click to switch it on.';
          };
          paint();
          manage.addEventListener('click', async () => {
            await MS.manager.setManaged(sceneName, !MS.manager.isManagedPlaylist(sceneName));
            paint();
          });
          head.appendChild(manage);
        }
        if (scan.detection.auto) {
          const fold = document.createElement('button');
          fold.className = 'btn-manage';
          fold.textContent = 'Collapse';
          fold.title = 'Fold the clips away (they keep working; click the tile chevron to open them again)';
          fold.addEventListener('click', () => setCollapsed(sceneName, true).catch(() => {}));
          head.appendChild(fold);
        }
        row.appendChild(head);

        const base = (scan.detection.auto ? scan.detection.clips : scan.items)
          .slice()
          .sort((a, b) => a.sceneItemId - b.sceneItemId);
        const list = window.MSPlaylist.mergeOrder(MS.store.get().clipOrder[sceneName], base.map((i) => i.sceneItemId))
          .map((id) => base.find((i) => i.sceneItemId === id));
        for (const item of list) {
          const c = buildClip(sceneName, item);
          clips.set(key(sceneName, item.sceneItemId), c);
          row.appendChild(c.el);
        }
        if (scan.detection.auto && scan.detection.kind === 'video') {
          const add = document.createElement('div');
          add.className = 'clip-tile clip-add cueable';
          add.textContent = '+';
          add.title = 'Import a clip into this scene';
          add.addEventListener('click', () => MS.subgrid.importInto(sceneName));
          row.appendChild(add);
        }
        tile.el.after(row);
        rows.set(sceneName, row);
        decorate(sceneName);
        for (const [k, c] of clips) if (k.startsWith(sceneName + '|')) loadRoute(c);
        refreshTally(sceneName);
      }

      function renderAll() {
        for (const [name, row] of rows) {
          if (!MS.grid.getTile(name)) { row.remove(); rows.delete(name); }
        }
        for (const name of MS.grid.tiles.keys()) render(name);
      }

      function scheduleRescan(sceneName) {
        clearTimeout(rescanTimers.get(sceneName));
        rescanTimers.set(sceneName, setTimeout(async () => {
          if (!MS.grid.getTile(sceneName)) return;
          try {
            const scan = await MS.playlists.scan(sceneName);
            const tile = MS.grid.getTile(sceneName);
            if (tile) {
              tile.isPlaylist = !!scan.detection.auto;
              if (tile.isPlaylist) tile.isMedia = false;
            }
            render(sceneName);
          } catch {}
        }, 150));
      }

      const obs = MS.connection.obs;
      obs.on('InputActiveStateChanged', (d) => {
        for (const [k, c] of clips) {
          if (c.item.sourceName !== d.inputName) continue;
          c.active = d.videoActive;
          applyState(k.split('|')[0], c);
        }
        for (const name of rows.keys()) updateParentThumb(name);
      });
      obs.on('SceneItemEnableStateChanged', (d) => {
        const c = clips.get(key(d.sceneName, d.sceneItemId));
        if (!c) return;
        c.item.enabled = d.sceneItemEnabled;
        applyState(d.sceneName, c);
      });
      obs.on('InputAudioMonitorTypeChanged', (d) => {
        for (const c of clips.values()) if (c.item.sourceName === d.inputName) loadRoute(c);
      });
      for (const ev of ['SceneItemCreated', 'SceneItemRemoved', 'SceneItemListReindexed']) {
        obs.on(ev, (d) => { if (MS.grid.getTile(d.sceneName)) scheduleRescan(d.sceneName); });
      }
      obs.on('InputVolumeMeters', (d) => {
        for (const x of d.inputs) {
          let peak = 0;
          for (const ch of x.inputLevelsMul) peak = Math.max(peak, ch[1] || 0);
          meters.set(x.inputName, peak);
        }
      });

      function paintMeters() {
        for (const c of clips.values()) {
          if (!c.active) continue;
          const peak = meters.get(c.item.sourceName) || 0;
          const db = peak > 0 ? 20 * Math.log10(peak) : -60;
          c.fill.style.width = Math.max(0, Math.min(100, ((db + 60) / 60) * 100)) + '%';
        }
        requestAnimationFrame(paintMeters);
      }
      requestAnimationFrame(paintMeters);

      const picker = document.createElement('input');
      picker.type = 'file';
      picker.accept = 'video/*';
      picker.hidden = true;
      document.body.appendChild(picker);
      let importTarget = null;
      picker.addEventListener('change', async () => {
        const file = picker.files[0];
        picker.value = '';
        if (file && importTarget) await MS.fileImport.importFile(file, importTarget);
      });
      function importInto(sceneName) {
        importTarget = sceneName;
        picker.click();
      }

      return { render, renderAll, refreshTally, clips, showing, importInto, expand, paintStrip, paintAuto };
    })();

    // ===== In-page Confirm =====
    // window.confirm may be suppressed in OBS's CEF dock, so a safety gate can't depend on it.
    MS.confirm = (message, okLabel) => new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const box = document.createElement('div');
      box.className = 'modal';
      const p = document.createElement('p');
      p.textContent = message;
      const actions = document.createElement('div');
      actions.className = 'modal-actions';
      const done = (v) => { overlay.remove(); resolve(v); };
      const cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', () => done(false));
      const ok = document.createElement('button');
      ok.className = 'btn btn-primary';
      ok.textContent = okLabel || 'Continue';
      ok.addEventListener('click', () => done(true));
      actions.append(cancel, ok);
      box.append(p, actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      cancel.focus();
    });

    // ===== Cue =====
    MS.cue = (() => {
      const P = window.MSPlaylist;
      const RESTART = 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART';
      const PAUSE = 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PAUSE';
      // Lives in OBS so every MediaSheet client agrees: a second client must not flip a Stream-only clip back on at take.
      const streamOnlyChosen = { has: (name) => MS.store.get().streamOnly.includes(name) };
      let busy = false;
      let sawTransitionEnd = false;

      function setBusy(on) {
        busy = on;
        for (const id of ['btn-cut', 'btn-fade', 'btn-stinger']) {
          const b = document.getElementById(id);
          if (b) b.disabled = on || !MS.connection.connected || (id === 'btn-stinger' && !MS.transitions.stingerName);
        }
      }

      async function sceneDuplication() {
        try {
          const r = await fetch('/api/obs-config');
          return (await r.json()).sceneDuplication;
        } catch {
          return 'unknown';
        }
      }

      // Register the listener before RESTART: the event can fire in the same millisecond.
      // Cue: RESTART, wait for playback, give OBS ~100 ms to draw the first frame, then PAUSE. Pausing the instant PlaybackStarted fires can land before any frame exists (black cued frame, measured); seeking to 0 instead leaves a clip whose later PLAY holds the old picture for ~1 s while the audio runs (measured), so the take restarts the clip (planActivate) and the cue never seeks.
      const CUE_FRAME_MS = 100;
      async function primeFirstFrame(inputName, { force = false } = {}) {
        const obs = MS.connection.obs;
        let handler;
        const started = new Promise((resolve) => {
          const timer = setTimeout(() => resolve(false), 2000);
          handler = (d) => { if (d.inputName === inputName) { clearTimeout(timer); resolve(true); } };
          obs.on('MediaInputPlaybackStarted', handler);
        });
        try {
          await obs.call('TriggerMediaInputAction', { inputName, mediaAction: RESTART });
          await started;
        } finally {
          obs.off('MediaInputPlaybackStarted', handler);
        }
        await new Promise((r) => setTimeout(r, CUE_FRAME_MS));
        // A take during the cue must not freeze Program
        const { videoActive } = await obs.call('GetSourceActive', { sourceName: inputName });
        if (force || !videoActive) await obs.call('TriggerMediaInputAction', { inputName, mediaAction: PAUSE });
      }

      // Returns whether the cue was done. `auto` (autoplay) skips the per-cue prompt: arming already asked once.
      async function cueClip(sceneName, clipItem, { auto = false } = {}) {
        if (busy || !MS.connection.connected) return false;
        setBusy(true);
        let done = false;
        const tileEl = MS.subgrid.clips.get(`${sceneName}|${clipItem.sceneItemId}`)?.el;
        tileEl?.classList.add('cueing');
        const obs = MS.connection.obs;
        try {
          const scan = await MS.playlists.scan(sceneName);
          const item = scan.items.find((i) => i.sceneItemId === clipItem.sceneItemId);
          if (!item) throw new Error('Clip is no longer in the scene');
          const activeFlags = await Promise.all(scan.items.map((i) =>
            obs.call('GetSourceActive', { sourceName: i.sourceName }).then((r) => r.videoActive).catch(() => false)));
          const active = new Set(scan.items.filter((_, i) => activeFlags[i]).map((i) => i.sourceName));

          const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
          if (currentProgramSceneName === sceneName && !auto) {
            const dup = await sceneDuplication();
            if (dup !== 'true' || !sawTransitionEnd) {
              const why = dup !== 'true'
                ? 'Duplicate Scene is not confirmed on'
                : 'no transition has been seen since MediaSheet connected';
              const ok = await MS.confirm(
                `"${sceneName}" is on Program and ${why}. Cueing could change what is live right now.`,
                'Cue anyway');
              if (!ok) return false;
            }
          }

          const monitorType = item.kind === 'video'
            ? (await obs.call('GetInputAudioMonitorType', { inputName: item.sourceName })).monitorType
            : '';
          const reqs = P.planCue({
            sceneName,
            clip: item,
            items: scan.items,
            active,
            monitorType,
            streamOnlyChosen: streamOnlyChosen.has(item.sourceName),
          });
          if (currentPreviewSceneName !== sceneName) {
            await obs.call('SetCurrentPreviewScene', { sceneName });
          }
          for (const r of reqs) await obs.call(r.request, r.data);
          if (item.kind === 'video' && !active.has(item.sourceName)) await primeFirstFrame(item.sourceName);

          MS.grid.logEvent(`Cued: ${item.sourceName}`);
          done = true;
        } catch (err) {
          console.error('Cue failed:', err);
          MS.grid.logEvent(`Cue failed: ${err.message}`);
        } finally {
          tileEl?.classList.remove('cueing');
          setBusy(false);
        }
        return done;
      }

      async function restartLive(item) {
        try {
          await MS.connection.obs.call('TriggerMediaInputAction', { inputName: item.sourceName, mediaAction: RESTART });
        } catch (err) {
          MS.grid.logEvent(`Restart failed: ${err.message}`);
        }
      }

      MS.connection.obs.on('SceneTransitionEnded', () => { sawTransitionEnd = true; });

      return {
        cueClip,
        sceneDuplication,
        parkClip: (inputName) => primeFirstFrame(inputName, { force: true }),
        restartLive,
        streamOnlyChosen,
        resetSession() { sawTransitionEnd = false; },
        sawTransition: () => sawTransitionEnd,
        get busy() { return busy; },
      };
    })();

    // ===== Playlist Manager =====
    // Everything here acts only on MANAGED playlist scenes, and never on an input that is live on Program
    // except to unmute/route it as part of going live.
    MS.manager = (() => {
      const P = window.MSPlaylist;
      const obs = MS.connection.obs;
      const ACT = 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_';
      const views = { pgm: null, pvw: null };
      const idleTimers = new Map();
      let defaults = null;
      let transitioning = false;
      let transitionEndedAt = null;

      // Video playlists are managed unless switched off; image playlists only when switched on
      const managedSet = () => new Set(MS.playlists.playlistScenes().filter(({ sceneName, kind }) => {
        const d = MS.store.get();
        return kind === 'video' ? !d.unmanaged.includes(sceneName) : d.managed.includes(sceneName);
      }).map((x) => x.sceneName));
      const isManagedPlaylist = (scene) => managedSet().has(scene);

      async function run(reqs) {
        for (const r of reqs) await obs.call(r.request, r.data);
      }

      async function activeSet(items) {
        const flags = await Promise.all(items.map((i) =>
          obs.call('GetSourceActive', { sourceName: i.sourceName }).then((r) => r.videoActive).catch(() => false)));
        return new Set(items.filter((_, i) => flags[i]).map((i) => i.sourceName));
      }

      function managedSceneFor(inputName) {
        for (const scene of managedSet()) {
          const scan = MS.playlists.getScan(scene);
          const clip = scan?.detection.auto && scan.detection.clips.find((c) => c.sourceName === inputName);
          if (clip) return { scene, clip };
        }
        return null;
      }

      async function onInactive(inputName) {
        const hit = managedSceneFor(inputName);
        if (!hit) return;
        const { videoActive } = await obs.call('GetSourceActive', { sourceName: inputName });
        await run(P.planLeave({
          sourceName: inputName,
          kind: hit.clip.kind,
          active: videoActive ? new Set([inputName]) : new Set(),
        }));
        if (!videoActive && hit.clip.kind === 'video') scheduleSwapCue(hit.scene, hit.clip);
      }

      // Like switching scenes: after a take the clip that just left Program is cued in Preview, so CUT swaps them back.
      const swapTimers = new Map();
      function scheduleSwapCue(sceneName, clip) {
        // An armed playlist cues its own next clip: a swap cue would collide with it
        if (MS.autoplay?.isArmed(sceneName)) return;
        clearTimeout(swapTimers.get(sceneName));
        swapTimers.set(sceneName, setTimeout(() => {
          swapCue(sceneName, clip).catch((err) => console.error('Swap cue failed:', err));
        }, 300));
      }

      async function swapCue(sceneName, clip) {
        // Without a take this session a cue would raise the "Cue anyway" prompt unasked
        if (transitioning || !MS.cue.sawTransition() || !isManagedPlaylist(sceneName)) return;
        const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
        if (currentProgramSceneName !== sceneName || currentPreviewSceneName !== sceneName) return;
        const { videoActive } = await obs.call('GetSourceActive', { sourceName: clip.sourceName });
        if (videoActive) return;
        // Only while Preview still shows nothing but the live clip: never override a clip the operator cued meanwhile
        const scan = await MS.playlists.scan(sceneName);
        const enabled = scan.items.filter((i) => i.enabled);
        const live = await activeSet(enabled);
        if (enabled.some((i) => !live.has(i.sourceName))) return;
        await MS.cue.cueClip(sceneName, clip);
      }

      async function onActive(inputName) {
        const hit = managedSceneFor(inputName);
        if (!hit || hit.clip.kind !== 'video') return;
        const [{ inputMuted }, { monitorType }, status] = await Promise.all([
          obs.call('GetInputMute', { inputName }),
          obs.call('GetInputAudioMonitorType', { inputName }),
          obs.call('GetMediaInputStatus', { inputName }).catch(() => ({})),
        ]);
        await run(P.planActivate({
          sourceName: inputName,
          kind: hit.clip.kind,
          muted: inputMuted,
          mediaState: status.mediaState,
          prerolled: MS.preroll.was(inputName),
          skipRestart: MS.transitionControl.stingerHolding(),
          monitorType,
          streamOnlyChosen: MS.cue.streamOnlyChosen.has(inputName),
          monitorSwitchSafe: true,
        }));
      }

      async function evaluateIdle(sceneName, trigger) {
        if (!isManagedPlaylist(sceneName)) return;
        const scan = await MS.playlists.scan(sceneName);
        if (!scan.detection.auto) return;
        const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
        const clips = scan.detection.clips;
        if (!P.shouldIdleReset({
          managed: true,
          isProgram: currentProgramSceneName === sceneName,
          isPreview: currentPreviewSceneName === sceneName,
          enabledClipCount: clips.filter((c) => c.enabled).length,
          trigger,
        })) return;
        await run(P.planIdle({ sceneName, clips, active: await activeSet(clips) }));
        MS.grid.logEvent(`Idle reset: ${sceneName}`);
      }

      function scheduleIdle(sceneName, trigger) {
        clearTimeout(idleTimers.get(sceneName));
        idleTimers.set(sceneName, setTimeout(() => {
          evaluateIdle(sceneName, trigger).catch((err) => console.error('Idle reset failed:', err));
        }, 500));
      }

      async function ensureDefaults() {
        if (!defaults) {
          defaults = (await obs.call('GetInputDefaultSettings', { inputKind: 'ffmpeg_source' })).defaultInputSettings;
        }
        return defaults;
      }

      // Compare effective values: a key left at its default is absent from GetInputSettings.
      async function normalizeInput(inputName, want) {
        const d = await ensureDefaults();
        const { inputSettings } = await obs.call('GetInputSettings', { inputName });
        const patch = {};
        for (const [k, v] of Object.entries(want)) {
          if ((inputSettings[k] ?? d[k]) !== v) patch[k] = v;
        }
        if (!Object.keys(patch).length) return false;
        await obs.call('SetInputSettings', { inputName, inputSettings: patch, overlay: true });
        return true;
      }

      async function normalizeScene(sceneName) {
        if (!isManagedPlaylist(sceneName)) return 0;
        const scan = await MS.playlists.scan(sceneName);
        let changed = 0;
        for (const clip of scan.detection.clips) {
          if (clip.kind !== 'video') continue;
          if (await normalizeInput(clip.sourceName, { clear_on_media_end: false, restart_on_activate: false })) changed++;
        }
        if (changed) MS.grid.logEvent(`Normalized ${changed} clip(s) in ${sceneName}`);
        return changed;
      }

      async function setManaged(sceneName, on) {
        await MS.store.update((d) => ({
          ...d,
          managed: on ? [...new Set([...d.managed, sceneName])] : d.managed.filter((n) => n !== sceneName),
          unmanaged: on ? d.unmanaged.filter((n) => n !== sceneName) : [...new Set([...d.unmanaged, sceneName])],
        }));
        if (on) {
          await normalizeScene(sceneName).catch((err) => console.error('Normalize failed:', err));
          scheduleIdle(sceneName, 'connect');
        }
        MS.subgrid.render(sceneName);
      }

      function renameScene(oldName, newName) {
        if (views.pgm === oldName) views.pgm = newName;
        if (views.pvw === oldName) views.pvw = newName;
        clearTimeout(idleTimers.get(oldName));
        idleTimers.delete(oldName);
      }

      // OBS plays every enabled clip when it launches. Right after a launch (and never on air) park them paused on their first frame so nothing is playing until the operator takes something.
      async function parkAtStartup() {
        const [stats, video, stream, rec] = await Promise.all([
          obs.call('GetStats'), obs.call('GetVideoSettings'), obs.call('GetStreamStatus'), obs.call('GetRecordStatus'),
        ]);
        const fresh = P.isFreshStart(stats.renderTotalFrames, video.fpsNumerator / video.fpsDenominator);
        if (!fresh || stream.outputActive || rec.outputActive) return;
        const clips = [];
        for (const scene of managedSet()) {
          if (!MS.playlists.isPlaylist(scene)) continue;
          const scan = MS.playlists.getScan(scene) ?? await MS.playlists.scan(scene);
          for (const c of scan.detection.clips) {
            if (c.kind !== 'video') continue;
            const { mediaState } = await obs.call('GetMediaInputStatus', { inputName: c.sourceName }).catch(() => ({}));
            clips.push({ sourceName: c.sourceName, kind: c.kind, mediaState });
          }
        }
        const parks = P.selectStartupParks({ fresh, streaming: false, recording: false, clips });
        for (const name of parks) await MS.cue.parkClip(name).catch((err) => console.error('Park failed:', err));
        if (parks.length) MS.grid.logEvent(`OBS just started: parked ${parks.length} clip(s) paused`);
      }

      async function onConnect() {
        const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
        views.pgm = currentProgramSceneName;
        views.pvw = currentPreviewSceneName;
        transitioning = false;
        transitionEndedAt = null;
        for (const scene of managedSet()) {
          if (!MS.playlists.isPlaylist(scene)) continue;
          await normalizeScene(scene).catch((err) => console.error('Normalize failed:', err));
          scheduleIdle(scene, 'connect');
        }
        await parkAtStartup().catch((err) => console.error('Startup park failed:', err));
      }

      function leftViews(oldScene) {
        if (oldScene && oldScene !== views.pgm && oldScene !== views.pvw) scheduleIdle(oldScene, 'leftViews');
      }

      obs.on('CurrentProgramSceneChanged', (d) => {
        const old = views.pgm;
        views.pgm = d.sceneName;
        leftViews(old);
      });
      obs.on('CurrentPreviewSceneChanged', (d) => {
        const old = views.pvw;
        views.pvw = d.sceneName;
        leftViews(old);
      });
      obs.on('SceneTransitionStarted', () => { transitioning = true; });
      obs.on('SceneTransitionEnded', () => { transitioning = false; transitionEndedAt = Date.now(); });
      obs.on('InputActiveStateChanged', (d) => {
        const job = d.videoActive ? onActive(d.inputName) : onInactive(d.inputName);
        job.catch((err) => console.error('Active-state handler failed:', err));
      });
      obs.on('SceneItemCreated', (d) => {
        // The scene may just have become a playlist: rescan before deciding
        setTimeout(async () => {
          await MS.playlists.scan(d.sceneName).catch(() => null);
          if (managedSet().has(d.sceneName)) normalizeScene(d.sceneName).catch(() => {});
        }, 400);
      });

      // Pile-up: two or more clips of one playlist live on Program is never legitimate under solo.
      function rowFor(sceneName) {
        return [...document.querySelectorAll('.subgrid-row')].find((r) => r.dataset.scene === sceneName);
      }
      function hideBanner(row) { row?.querySelector('.pileup')?.remove(); }
      async function resetPileup(sceneName) {
        const scan = await MS.playlists.scan(sceneName);
        await run(P.planIdle({ sceneName, clips: scan.detection.clips, active: new Set() }));
        MS.grid.logEvent(`Pile-up reset: ${sceneName}`);
      }
      setInterval(async () => {
        if (!MS.connection.connected) return;
        for (const scene of managedSet()) {
          const row = rowFor(scene);
          if (!row) continue;
          const activeClips = [...MS.subgrid.clips.entries()]
            .filter(([k, c]) => k.startsWith(scene + '|') && c.active && c.item.kind === 'video')
            .map(([, c]) => c.item.sourceName);
          // Stopped clips can stay "active" in Program's copy until the next take; only playing ones are a pile-up
          let live = 0;
          if (scene === views.pgm && activeClips.length >= 2) {
            const states = await Promise.all(activeClips.map((n) =>
              obs.call('GetMediaInputStatus', { inputName: n }).then((r) => r.mediaState).catch(() => null)));
            live = states.filter((st) => st === 'OBS_MEDIA_STATE_PLAYING').length;
          }
          const show = scene === views.pgm && P.shouldEvaluatePileup({
            transitioning,
            msSinceTransitionEnd: transitionEndedAt === null ? null : Date.now() - transitionEndedAt,
            liveClips: live,
          });
          let banner = row.querySelector('.pileup');
          if (!show) { hideBanner(row); continue; }
          if (!banner) {
            banner = document.createElement('div');
            banner.className = 'pileup';
            const text = document.createElement('span');
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = 'Reset';
            btn.addEventListener('click', () => resetPileup(scene).catch((err) => console.error(err)));
            banner.append(text, btn);
            row.insertBefore(banner, row.children[1] || null);
          }
          banner.querySelector('span').textContent = `${live} clips playing on Program — Reset?`;
          MS.subgrid.expand(scene);
        }
      }, 1000);

      return { setManaged, normalizeInput, normalizeScene, evaluateIdle, onConnect, isManagedPlaylist, renameScene };
    })();

    // ===== Autoplay =====
    // Set and forget: an armed video playlist that is on Program plays its clips in the order shown, cueing the next clip a few seconds ahead and taking it with the playlist's transition so the swap lands on the end of the clip.
    // It runs in this page (OBS cannot chain clips itself), so it stops when the dock closes or reloads or the Mac sleeps. Only one open client runs it: a short lease in OBS's persistent data decides which.
    MS.autoplay = (() => {
      const P = window.MSPlaylist;
      const REALM = 'OBS_WEBSOCKET_DATA_REALM_GLOBAL';
      const LOCK_SLOT = 'mediasheet_autoplay_lock';
      const LEASE_STALE_MS = 3000;
      const TICK_MS = 500;
      const clientId = Math.random().toString(36).slice(2);
      // Only OBS's own dock (it exposes window.obsstudio) runs the engine, or a browser tab opened with ?engine. A test browser or a stray tab never takes clips on Program.
      // ?engine=test is for my headless harness: the engine stays off until the test sets window.__msEngineGo, after its OBS write stubs are in place.
      const engineParam = new URLSearchParams(location.search).get('engine');
      const allowed = () => !!window.obsstudio || (engineParam !== null && engineParam !== 'test') || (engineParam === 'test' && window.__msEngineGo === true);
      const states = new Map(); // scene → { timer, dueAt, cuedFor, advancing }
      let holder = false;
      let ticking = false;
      let tickTimer = null;
      let leaseTimer = null;

      const obs = () => MS.connection.obs;
      const defaults = { autoplay: false, lock: false, loop: true, transition: 'fade' };
      const opts = (scene) => MS.store.get().playlistOptions[scene] ?? defaults;
      const isArmed = (scene) => !!MS.store.get().playlistOptions[scene]?.autoplay;
      const armedScenes = () => Object.entries(MS.store.get().playlistOptions).filter(([, o]) => o.autoplay).map(([s]) => s);

      // ---- playback lock and manual override ----
      // Presses (scene tiles, clips, CUT/FADE/STINGER) call noteManual(); the engine stands down when one lands after its last advance, so it never takes the clip the operator just cued by hand.
      // While a locked playlist is live on Program, guard() swallows those presses instead.
      let manualAt = 0;
      const noteManual = () => { manualAt = Date.now(); };
      const lockedScene = () => armedScenes().find((s) => opts(s).lock && s === MS.grid.currentPgm && MS.manager.isManagedPlaylist(s)) ?? null;
      const isLocked = (scene) => lockedScene() === scene;
      const isHeld = (scene) => states.get(scene)?.heldFor != null;

      const banner = document.getElementById('lock-banner');
      const bannerText = document.getElementById('lock-text');
      document.getElementById('lock-unlock').addEventListener('click', () => {
        const s = lockedScene();
        if (s) setOptions(s, { lock: false }).catch((err) => console.error('Unlock failed:', err));
      });

      // true = the press was blocked
      function guard() {
        if (!lockedScene()) return false;
        banner.classList.remove('flash');
        void banner.offsetWidth; // restart the animation
        banner.classList.add('flash');
        return true;
      }

      function paintLock() {
        const scene = lockedScene();
        banner.hidden = !scene;
        document.body.classList.toggle('ms-locked', !!scene);
        if (scene) bannerText.textContent = `${scene}: autoplay is running. Presses on scenes, clips and transitions are ignored. Untick Playback lock in Playlist Options (or Unlock) to take control.`;
        for (const [name, tile] of MS.grid.tiles) tile.el.classList.toggle('pl-locked-tile', name === scene);
        for (const s of armedScenes()) MS.subgrid.paintAuto(s);
      }
      setInterval(paintLock, 500);

      function waitForEvent(name, timeoutMs) {
        return new Promise((resolve) => {
          const done = () => { clearTimeout(timer); obs().off(name, done); resolve(); };
          const timer = setTimeout(done, timeoutMs);
          obs().on(name, done);
        });
      }

      async function renewLease() {
        if (!allowed() || !MS.connection.connected || !armedScenes().length) { holder = false; return; }
        let lock = null;
        try {
          lock = (await obs().call('GetPersistentData', { realm: REALM, slotName: LOCK_SLOT })).slotValue;
        } catch {}
        const stale = !lock || typeof lock.at !== 'number' || Date.now() - lock.at > LEASE_STALE_MS;
        if ((lock && lock.id === clientId) || stale) {
          await obs().call('SetPersistentData', { realm: REALM, slotName: LOCK_SLOT, slotValue: { id: clientId, at: Date.now() } }).catch(() => {});
          holder = true;
        } else {
          holder = false;
        }
      }

      function stateFor(scene) {
        if (!states.has(scene)) states.set(scene, { timer: null, dueAt: 0, cuedFor: null, advancing: false, lastAdvanceAt: Date.now(), heldFor: null, liveName: '' });
        return states.get(scene);
      }

      function reset(scene) {
        const st = states.get(scene);
        if (!st) return;
        clearTimeout(st.timer);
        st.timer = null;
        st.dueAt = 0;
        st.cuedFor = null;
      }

      function effectiveTransition(scene) {
        const t = opts(scene).transition;
        return t === 'stinger' && !MS.transitions.stingerName ? 'fade' : t;
      }

      function takeFn(scene) {
        const t = effectiveTransition(scene);
