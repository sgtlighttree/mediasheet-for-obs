<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaSheet</title>
  <style>
    :root {
      --ms-bg-window: #1D1F26;
      --ms-bg-base: #272A33;
      --ms-bg-preview: #13141A;
      --ms-primary: #284CB8;
      --ms-primary-light: #476BD7;
      --ms-primary-lighter: #718CDC;
      --ms-primary-dark: #213E97;
      --ms-text: #FFFFFF;
      --ms-text-muted: #969696;
      --ms-danger: #C01C37;
      --ms-warning: #B88A16;
      --ms-success: #25A231;
      --ms-border: #3C404D;
      --ms-input-bg: #3C404D;
      --ms-button-bg: #3C404D;
      --ms-button-hover: #464B59;
      --ms-button-down: #1D1F26;
      --ms-tally-pgm: #C01C37;
      --ms-tally-pvw: #25A231;
      --ms-radius: 4px;
      --ms-radius-sm: 2px;
      --ms-radius-lg: 6px;
      --ms-font: 'Open Sans', '.AppleSystemUIFont', Helvetica, Arial, 'MS Shell Dlg', sans-serif;
    }

    /* === Reset + Base === */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--ms-font);
      background: var(--ms-bg-window);
      color: var(--ms-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* === Top Bar === */
    #top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 12px;
      background: var(--ms-bg-base);
      border-bottom: 1px solid var(--ms-border);
      flex-shrink: 0;
    }

    .top-bar-left, .top-bar-center, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected { background: var(--ms-success); }
    .status-dot.reconnecting { background: var(--ms-warning); }
    .status-dot.disconnected { background: var(--ms-danger); }

    .server-status {
      color: var(--ms-warning);
      font-size: 11px;
    }

    /* === Buttons === */
    .btn {
      background: var(--ms-button-bg);
      color: var(--ms-text);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius);
      padding: 4px 12px;
      cursor: pointer;
      font-family: var(--ms-font);
      font-size: 12px;
      line-height: 1.4;
    }
    .btn:hover { background: var(--ms-button-hover); }
    .btn:active { background: var(--ms-button-down); }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn:disabled:hover { background: var(--ms-button-bg); }

    .btn-primary {
      background: var(--ms-primary);
      border-color: var(--ms-primary-dark);
    }
    .btn-primary:hover { background: var(--ms-primary-light); }

    .btn-icon {
      padding: 4px 6px;
      border: none;
      background: transparent;
    }
    .btn-icon:hover { background: var(--ms-button-hover); }

    .btn-transition {
      font-weight: 700;
      min-width: 50px;
      text-align: center;
    }

    .duration-input {
      width: 60px;
      background: var(--ms-input-bg);
      color: var(--ms-text);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-sm);
      padding: 3px 6px;
      font-family: var(--ms-font);
      font-size: 12px;
      text-align: center;
    }
    .duration-label {
      font-size: 11px;
      color: var(--ms-text-muted);
    }

    /* === Tile Grid === */
    #tile-grid {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      align-content: start;
    }

    /* === Tile === */
    .tile {
      background: var(--ms-bg-base);
      border: 2px solid var(--ms-border);
      border-radius: var(--ms-radius-lg);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
    }
    .tile.tally-pgm { border-color: var(--ms-tally-pgm); }
    .tile.tally-pvw { border-color: var(--ms-tally-pvw); }

    .tile-thumbnail {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--ms-bg-preview);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .tile-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .tile-thumbnail .fallback-icon {
      font-size: 32px;
      color: var(--ms-text-muted);
    }

    .tile-label {
      padding: 4px 8px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* === Transport Controls (media tiles only) === */
    .tile-transport {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px 8px;
    }
    .tile-transport .btn-transport {
      background: none;
      border: none;
      color: var(--ms-text);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: var(--ms-radius-sm);
      font-size: 14px;
      line-height: 1;
    }
    .tile-transport .btn-transport:hover { background: var(--ms-button-hover); }
    .tile-transport .btn-transport.active { color: var(--ms-text-muted); }

    /* === Progress Bar === */
    .tile-progress {
      padding: 2px 8px 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--ms-bg-preview);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--ms-primary-light);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s linear;
    }
    .progress-time {
      font-size: 10px;
      color: var(--ms-text-muted);
      white-space: nowrap;
      min-width: 80px;
      text-align: right;
    }

    /* === Audio Controls === */
    .tile-audio {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px 6px;
    }
    .btn-mute {
      background: none;
      border: none;
      color: var(--ms-text);
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
    }
    .btn-mute.muted { color: var(--ms-danger); }
    .volume-slider {
      flex: 1;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--ms-bg-preview);
      border-radius: 2px;
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ms-primary-light);
      cursor: pointer;
    }

    /* === Modals === */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--ms-bg-base);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius-lg);
      padding: 20px;
      min-width: 320px;
      max-width: 480px;
    }
    .modal h3 {
      margin-bottom: 16px;
      font-size: 15px;
    }
    .modal label {
      display: block;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--ms-text-muted);
    }
    .modal input[type="text"],
    .modal input[type="number"],
    .modal input[type="password"] {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 6px 8px;
      background: var(--ms-input-bg);
      color: var(--ms-text);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius);
      font-family: var(--ms-font);
      font-size: 13px;
    }
    .password-row {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .password-row input { flex: 1; }
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    /* === Picker Modal === */
    #picker-list {
      list-style: none;
      margin: 12px 0;
      max-height: 300px;
      overflow-y: auto;
    }
    #picker-list li {
      padding: 8px;
      border-radius: var(--ms-radius);
      cursor: pointer;
      font-size: 12px;
      border: 1px solid transparent;
    }
    #picker-list li:hover { background: var(--ms-button-hover); }
    .picker-path { word-break: break-all; }
    .picker-meta { color: var(--ms-text-muted); font-size: 11px; margin-top: 2px; }

    /* === Context Menu === */
    .context-menu {
      position: fixed;
      background: var(--ms-bg-base);
      border: 1px solid var(--ms-border);
      border-radius: var(--ms-radius);
      z-index: 200;
      min-width: 140px;
    }
    .context-menu-item {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: none;
      border: none;
      color: var(--ms-text);
      font-family: var(--ms-font);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
    .context-menu-item:hover { background: var(--ms-button-hover); }

    /* === Bottom Bar === */
    #bottom-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 32px;
      padding: 0 12px;
      background: var(--ms-bg-base);
      border-top: 1px solid var(--ms-border);
      flex-shrink: 0;
      font-size: 12px;
    }
    .pgm-label strong { color: var(--ms-tally-pgm); }
    .pvw-label strong { color: var(--ms-tally-pvw); }
    .last-event {
      margin-left: auto;
      color: var(--ms-text-muted);
      font-size: 10px;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <header id="top-bar">
    <div class="top-bar-left">
      <span id="connection-dot" class="status-dot disconnected"></span>
      <span id="connection-text">Disconnected</span>
      <span id="server-status" class="server-status" hidden>Server offline</span>
    </div>
    <div class="top-bar-center">
      <button id="btn-add-input" class="btn" disabled>Add Input</button>
      <input type="file" id="file-input" accept="video/*,audio/*,image/*" hidden>
    </div>
    <div class="top-bar-right">
      <button id="btn-cut" class="btn btn-transition" disabled>CUT</button>
      <button id="btn-fade" class="btn btn-transition" disabled>FADE</button>
      <input type="number" id="fade-duration" class="duration-input" value="300" min="50" max="5000" step="50" title="Fade duration (ms)">
      <span class="duration-label">ms</span>
      <button id="btn-settings" class="btn btn-icon" title="Settings">⚙</button>
    </div>
  </header>

  <!-- Tile Grid -->
  <main id="tile-grid"></main>

  <!-- Disambiguation Picker Modal -->
  <div id="picker-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3>Multiple files found</h3>
      <p id="picker-filename"></p>
      <ul id="picker-list"></ul>
      <button id="picker-cancel" class="btn">Cancel</button>
    </div>
  </div>

  <!-- Connection Config Modal -->
  <div id="config-modal" class="modal-overlay" hidden>
    <div class="modal">
      <h3>OBS Connection</h3>
      <label>
        Host
        <input type="text" id="config-host" value="localhost" autocomplete="off">
      </label>
      <label>
        Port
        <input type="number" id="config-port" value="4455" min="1" max="65535">
      </label>
      <label>
        Password
        <div class="password-row">
          <input type="password" id="config-password" autocomplete="off" placeholder="(leave empty if none)">
          <button id="btn-toggle-password" class="btn btn-icon" type="button">👁</button>
        </div>
      </label>
      <div class="modal-actions">
        <button id="btn-connect" class="btn btn-primary">Connect</button>
        <button id="btn-disconnect" class="btn" hidden>Disconnect</button>
        <button id="btn-config-close" class="btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Context Menu (right-click on tile) -->
  <div id="context-menu" class="context-menu" hidden>
    <button id="ctx-remove" class="context-menu-item">Remove Input</button>
  </div>

  <!-- Bottom Bar -->
  <footer id="bottom-bar">
    <span class="pgm-label">PGM: <strong id="pgm-name">—</strong></span>
    <span class="pvw-label">PVW: <strong id="pvw-name">—</strong></span>
    <span id="last-event" class="last-event"></span>
  </footer>

  <script src="vendor/obs-websocket-js.min.js"></script>
  <script>
    const MS = {};

    // ===== Connection Manager =====
    MS.connection = (() => {
      const obs = new OBSWebSocket();
      let connected = false;
      let reconnectTimer = null;
      let reconnectDelay = 1000;
      let heartbeatTimer = null;
      let heartbeatTimeout = null;

      const MAX_RECONNECT_DELAY = 15000;
      const HEARTBEAT_INTERVAL = 10000;
      const HEARTBEAT_TIMEOUT = 5000;

      const dot = document.getElementById('connection-dot');
      const text = document.getElementById('connection-text');

      function setStatus(state, label) {
        dot.className = 'status-dot ' + state;
        text.textContent = label;
      }

      function getConfig() {
        try {
          return JSON.parse(localStorage.getItem('ms_connection')) || {};
        } catch { return {}; }
      }

      function saveConfig(host, port, password) {
        localStorage.setItem('ms_connection', JSON.stringify({ host, port, password }));
      }

      async function connect(host, port, password) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;

        host = host || 'localhost';
        port = port || 4455;

        setStatus('reconnecting', `Connecting to ${host}:${port}...`);

        try {
          const url = `ws://${host}:${port}`;
          await obs.connect(url, password || undefined, { rpcVersion: 1 });
          connected = true;
          reconnectDelay = 1000;
          saveConfig(host, port, password);
          setStatus('connected', `${host}:${port}`);
          startHeartbeat();
          if (MS.connection.onConnect) MS.connection.onConnect();
        } catch (err) {
          connected = false;
          if (err.code === 4009) {
            // Auth required
            setStatus('disconnected', 'Auth required');
            MS.configModal.show(true);
            return;
          }
          setStatus('disconnected', `Failed: ${err.message}`);
          scheduleReconnect(host, port, password);
        }
      }

      function scheduleReconnect(host, port, password) {
        if (reconnectTimer) return;
        setStatus('reconnecting', `Reconnecting in ${Math.round(reconnectDelay / 1000)}s...`);
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect(host, port, password);
        }, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
      }

      function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(async () => {
          try {
            heartbeatTimeout = setTimeout(() => {
              console.warn('OBS heartbeat timeout — treating as disconnected');
              obs.disconnect();
            }, HEARTBEAT_TIMEOUT);
            await obs.call('GetVersion');
            clearTimeout(heartbeatTimeout);
          } catch {
            clearTimeout(heartbeatTimeout);
          }
        }, HEARTBEAT_INTERVAL);
      }

      function stopHeartbeat() {
        clearInterval(heartbeatTimer);
        clearTimeout(heartbeatTimeout);
      }

      async function disconnect() {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        stopHeartbeat();
        connected = false;
        try { await obs.disconnect(); } catch {}
        setStatus('disconnected', 'Disconnected');
        if (MS.connection.onDisconnect) MS.connection.onDisconnect();
      }

      obs.on('ConnectionClosed', () => {
        if (!connected) return;
        connected = false;
        stopHeartbeat();
        setStatus('disconnected', 'Connection lost');
        const cfg = getConfig();
        scheduleReconnect(cfg.host, cfg.port, cfg.password);
        if (MS.connection.onDisconnect) MS.connection.onDisconnect();
      });

      return {
        obs,
        get connected() { return connected; },
        connect,
        disconnect,
        getConfig,
        onConnect: null,
        onDisconnect: null,
      };
    })();

    // ===== Transition Resolver =====
    MS.transitions = { cutName: null, fadeName: null };

    // ===== Canvas Cache =====
    MS.canvas = { width: 1920, height: 1080 };

    // ===== Post-connect initialization =====
    async function onConnected() {
      const obs = MS.connection.obs;

      // Enable studio mode
      try {
        await obs.call('SetStudioModeEnabled', { studioModeEnabled: true });
      } catch {}

      // Resolve transitions by kind
      try {
        const { transitions } = await obs.call('GetSceneTransitionList');
        for (const t of transitions) {
          if (t.transitionKind === 'cut_transition' && !MS.transitions.cutName) {
            MS.transitions.cutName = t.transitionName;
          }
          if (t.transitionKind === 'fade_transition' && !MS.transitions.fadeName) {
            MS.transitions.fadeName = t.transitionName;
          }
        }
        if (!MS.transitions.cutName) {
          console.warn('No cut transition found — falling back to first available');
          MS.transitions.cutName = transitions[0]?.transitionName;
        }
        if (!MS.transitions.fadeName) {
          console.warn('No fade transition found — falling back to first available');
          MS.transitions.fadeName = transitions[0]?.transitionName;
        }
      } catch (err) {
        console.error('Failed to resolve transitions:', err);
      }

      // Cache canvas dimensions
      try {
        const vs = await obs.call('GetVideoSettings');
        MS.canvas.width = vs.baseWidth;
        MS.canvas.height = vs.baseHeight;
      } catch {}

      // Enable UI buttons
      document.getElementById('btn-add-input').disabled = false;
      document.getElementById('btn-cut').disabled = false;
      document.getElementById('btn-fade').disabled = false;

      // Build scene grid (Task 5)
      if (MS.grid) MS.grid.rebuild();
    }

    function onDisconnected() {
      document.getElementById('btn-add-input').disabled = true;
      document.getElementById('btn-cut').disabled = true;
      document.getElementById('btn-fade').disabled = true;
    }

    MS.connection.onConnect = onConnected;
    MS.connection.onDisconnect = onDisconnected;

    // ===== Config Modal =====
    MS.configModal = (() => {
      const overlay = document.getElementById('config-modal');
      const hostInput = document.getElementById('config-host');
      const portInput = document.getElementById('config-port');
      const passInput = document.getElementById('config-password');
      const btnConnect = document.getElementById('btn-connect');
      const btnDisconnect = document.getElementById('btn-disconnect');
      const btnClose = document.getElementById('btn-config-close');
      const btnToggle = document.getElementById('btn-toggle-password');

      function show(focusPassword) {
        const cfg = MS.connection.getConfig();
        hostInput.value = cfg.host || 'localhost';
        portInput.value = cfg.port || 4455;
        passInput.value = cfg.password || '';
        btnConnect.hidden = MS.connection.connected;
        btnDisconnect.hidden = !MS.connection.connected;
        overlay.hidden = false;
        if (focusPassword) {
          passInput.focus();
        } else {
          hostInput.focus();
        }
      }

      function hide() {
        overlay.hidden = true;
      }

      btnConnect.addEventListener('click', () => {
        const host = hostInput.value.trim();
        const port = parseInt(portInput.value, 10);
        const password = passInput.value;
        hide();
        MS.connection.connect(host, port, password);
      });

      btnDisconnect.addEventListener('click', () => {
        hide();
        MS.connection.disconnect();
      });

      btnClose.addEventListener('click', hide);

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) hide();
      });

      btnToggle.addEventListener('click', () => {
        passInput.type = passInput.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('btn-settings').addEventListener('click', () => show());

      return { show, hide };
    })();

    // Stubs for modules defined in later tasks — prevents runtime errors
    // when testing grid in isolation. Replaced by Tasks 7, 8, 9.
    // ===== Transport Controls =====
    MS.transport = (() => {
      async function action(inputName, mediaAction) {
        if (!MS.connection.connected || !inputName) return;
        try {
          await MS.connection.obs.call('TriggerMediaInputAction', {
            inputName,
            mediaAction,
          });
        } catch (err) {
          console.error('Transport action failed:', err);
        }
      }

      async function seek(inputName, cursorMs) {
        if (!MS.connection.connected || !inputName) return;
        try {
          await MS.connection.obs.call('SetMediaInputCursor', {
            inputName,
            mediaCursor: Math.max(0, cursorMs),
          });
        } catch (err) {
          console.error('Seek failed:', err);
        }
      }

      return { action, seek };
    })();
    // ===== Audio Controls =====
    MS.audio = (() => {
      async function toggleMute(inputName) {
        if (!MS.connection.connected || !inputName) return;
        try {
          const { inputMuted } = await MS.connection.obs.call('ToggleInputMute', { inputName });
          updateMuteUI(inputName, inputMuted);
        } catch (err) {
          console.error('Mute toggle failed:', err);
        }
      }

      async function setVolume(inputName, db) {
        if (!MS.connection.connected || !inputName) return;
        try {
          await MS.connection.obs.call('SetInputVolume', {
            inputName,
            inputVolumeDb: db,
          });
        } catch (err) {
          console.error('Set volume failed:', err);
        }
      }

      async function loadInitialState(inputName, tileEl) {
        if (!MS.connection.connected || !inputName) return;
        try {
          const [volResult, muteResult] = await Promise.all([
            MS.connection.obs.call('GetInputVolume', { inputName }),
            MS.connection.obs.call('GetInputMute', { inputName }),
          ]);

          const slider = tileEl.querySelector('.volume-slider');
          if (slider) {
            const db = Math.max(-60, Math.min(0, volResult.inputVolumeDb));
            slider.value = db;
          }

          updateMuteUI(inputName, muteResult.inputMuted);
        } catch {}
      }

      function updateMuteUI(inputName, muted) {
        for (const [, tile] of MS.grid.tiles) {
          if (tile.inputName === inputName) {
            const btn = tile.el.querySelector('.btn-mute');
            if (btn) {
              btn.textContent = muted ? '🔇' : '🔊';
              btn.classList.toggle('muted', muted);
            }
            break;
          }
        }
      }

      return { toggleMute, setVolume, loadInitialState };
    })();
    // ===== Transition Control =====
    MS.transitionControl = (() => {
      const btnCut = document.getElementById('btn-cut');
      const btnFade = document.getElementById('btn-fade');
      const fadeDurationInput = document.getElementById('fade-duration');
      let lastTransitionType = 'cut'; // 'cut' or 'fade'

      async function cut() {
        if (!MS.connection.connected) return;
        lastTransitionType = 'cut';
        try {
          if (MS.transitions.cutName) {
            await MS.connection.obs.call('SetCurrentSceneTransition', {
              transitionName: MS.transitions.cutName,
            });
          }
          await MS.connection.obs.call('TriggerStudioModeTransition');
          await restartOnTake();
        } catch (err) {
          console.error('Cut transition failed:', err);
        }
      }

      async function fade(durationMs) {
        if (!MS.connection.connected) return;
        lastTransitionType = 'fade';
        durationMs = durationMs || parseInt(fadeDurationInput.value, 10) || 300;
        try {
          if (MS.transitions.fadeName) {
            await MS.connection.obs.call('SetCurrentSceneTransition', {
              transitionName: MS.transitions.fadeName,
            });
            await MS.connection.obs.call('SetCurrentSceneTransitionDuration', {
              transitionDuration: durationMs,
            });
          }
          await MS.connection.obs.call('TriggerStudioModeTransition');
          await restartOnTake();
        } catch (err) {
          console.error('Fade transition failed:', err);
        }
      }

      async function take(sceneName) {
        // First, load to PVW
        try {
          await MS.connection.obs.call('SetCurrentPreviewScene', { sceneName });
        } catch (err) {
          console.error('SetCurrentPreviewScene failed:', err);
          return;
        }

        // Then transition using last-selected type
        if (lastTransitionType === 'fade') {
          await fade();
        } else {
          await cut();
        }
      }

      async function restartOnTake() {
        // After transition, the new PGM scene's media should restart from the top
        // Wait a tick for the transition event to update currentPgm
        await new Promise((r) => setTimeout(r, 50));
        const pgmTile = MS.grid.getTile(MS.grid.currentPgm);
        if (pgmTile?.isMedia && pgmTile.inputName) {
          try {
            await MS.connection.obs.call('SetMediaInputCursor', {
              inputName: pgmTile.inputName,
              mediaCursor: 0,
            });
            await MS.connection.obs.call('TriggerMediaInputAction', {
              inputName: pgmTile.inputName,
              mediaAction: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PLAY',
            });
          } catch (err) {
            console.error('Restart-on-take failed:', err);
          }
        }
      }

      function updateButtonHighlight() {
        btnCut.classList.toggle('btn-primary', lastTransitionType === 'cut');
        btnFade.classList.toggle('btn-primary', lastTransitionType === 'fade');
      }

      btnCut.addEventListener('click', () => {
        lastTransitionType = 'cut';
        updateButtonHighlight();
        cut();
      });
      btnFade.addEventListener('click', () => {
        lastTransitionType = 'fade';
        updateButtonHighlight();
        const duration = parseInt(fadeDurationInput.value, 10) || 300;
        fade(duration);
      });

      updateButtonHighlight();

      return { cut, fade, take };
    })();

    // ===== Scene Grid =====
    MS.grid = (() => {
      const container = document.getElementById('tile-grid');
      const pgmLabel = document.getElementById('pgm-name');
      const pvwLabel = document.getElementById('pvw-name');
      const lastEventEl = document.getElementById('last-event');
      const tiles = new Map(); // sceneName → tile object
      let currentPgm = null;
      let currentPvw = null;
      let pollTimers = [];

      function logEvent(msg) {
        lastEventEl.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      }

      function isMediaSheet(sceneName) {
        return sceneName.startsWith('[MS] ');
      }

      function formatTime(ms) {
        if (ms == null || ms < 0) return '--:--';
        const totalSec = Math.floor(ms / 1000);
        const min = Math.floor(totalSec / 60);
        const sec = totalSec % 60;
        return String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
      }

      function createTileElement(sceneName, inputName, isMedia) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.scene = sceneName;

        // Thumbnail
        const thumb = document.createElement('div');
        thumb.className = 'tile-thumbnail';
        const fallback = document.createElement('span');
        fallback.className = 'fallback-icon';
        fallback.textContent = isMedia ? '🎬' : '📷';
        thumb.appendChild(fallback);
        tile.appendChild(thumb);

        // Label
        const label = document.createElement('div');
        label.className = 'tile-label';
        label.textContent = isMedia ? sceneName.replace('[MS] ', '') : sceneName;
        label.title = sceneName;
        tile.appendChild(label);

        if (isMedia) {
          // Transport controls
          const transport = document.createElement('div');
          transport.className = 'tile-transport';
          const btns = [
            { icon: '▶', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PLAY', cls: 'play' },
            { icon: '⏸', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PAUSE', cls: 'pause' },
            { icon: '⏹', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_STOP', cls: 'stop' },
            { icon: '⏮', action: 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART', cls: 'restart' },
          ];
          for (const b of btns) {
            const btn = document.createElement('button');
            btn.className = 'btn-transport';
            btn.dataset.action = b.action;
            btn.dataset.cls = b.cls;
            btn.textContent = b.icon;
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              MS.transport.action(inputName, b.action);
            });
            transport.appendChild(btn);
          }
          tile.appendChild(transport);

          // Progress bar
          const progress = document.createElement('div');
          progress.className = 'tile-progress';
          const bar = document.createElement('div');
          bar.className = 'progress-bar';
          const fill = document.createElement('div');
          fill.className = 'progress-bar-fill';
          bar.appendChild(fill);
          bar.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = bar.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            const tileData = tiles.get(sceneName);
            if (tileData && tileData.duration > 0) {
              MS.transport.seek(inputName, Math.round(pct * tileData.duration));
            }
          });
          progress.appendChild(bar);
          const time = document.createElement('span');
          time.className = 'progress-time';
          time.textContent = '--:-- / --:--';
          progress.appendChild(time);
          tile.appendChild(progress);

          // Audio controls
          const audio = document.createElement('div');
          audio.className = 'tile-audio';
          const muteBtn = document.createElement('button');
          muteBtn.className = 'btn-mute';
          muteBtn.textContent = '🔊';
          muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            MS.audio.toggleMute(inputName);
          });
          audio.appendChild(muteBtn);
          const slider = document.createElement('input');
          slider.type = 'range';
          slider.className = 'volume-slider';
          slider.min = '-60';
          slider.max = '0';
          slider.step = '1';
          slider.value = '0';
          let debounceTimer = null;
          slider.addEventListener('input', (e) => {
            e.stopPropagation();
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
              MS.audio.setVolume(inputName, parseFloat(slider.value));
            }, 50);
          });
          slider.addEventListener('click', (e) => e.stopPropagation());
          audio.appendChild(slider);
          tile.appendChild(audio);
        }

        // Click → PVW
        tile.addEventListener('click', () => {
          if (MS.connection.connected) {
            MS.connection.obs.call('SetCurrentPreviewScene', { sceneName })
              .catch((err) => console.error('SetCurrentPreviewScene failed:', err));
          }
        });

        // Double-click → Take to PGM
        tile.addEventListener('dblclick', () => {
          if (MS.connection.connected && MS.transitions) {
            MS.transitionControl.take(sceneName);
          }
        });

        // Right-click → context menu (media tiles only)
        if (isMedia) {
          tile.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            MS.contextMenu.show(e.clientX, e.clientY, sceneName);
          });
        }

        return tile;
      }

      async function discoverInputName(sceneName) {
        try {
          const { sceneItems } = await MS.connection.obs.call('GetSceneItemList', { sceneName });
          if (sceneItems.length > 0) {
            return sceneItems[0].sourceName;
          }
        } catch {}
        return sceneName;
      }

      async function fetchThumbnail(sceneName, thumbEl) {
        try {
          const result = await MS.connection.obs.call('GetSourceScreenshot', {
            sourceName: sceneName,
            imageFormat: 'jpg',
            imageWidth: 320,
            imageCompressionQuality: 60,
          });
          if (result.imageData) {
            thumbEl.innerHTML = '';
            const img = document.createElement('img');
            img.src = result.imageData;
            thumbEl.appendChild(img);
          }
        } catch {
          // Source may not have rendered yet — keep fallback icon
        }
      }

      function updateTally() {
        for (const [sceneName, tile] of tiles) {
          tile.el.classList.remove('tally-pgm', 'tally-pvw');
          if (sceneName === currentPgm) tile.el.classList.add('tally-pgm');
          else if (sceneName === currentPvw) tile.el.classList.add('tally-pvw');
        }
        pgmLabel.textContent = currentPgm || '—';
        pvwLabel.textContent = currentPvw || '—';
      }

      async function rebuild() {
        stopPolling();
        try {
          const { scenes, currentProgramSceneName, currentPreviewSceneName } =
            await MS.connection.obs.call('GetSceneList');
          currentPgm = currentProgramSceneName;
          currentPvw = currentPreviewSceneName;

          const currentSceneNames = new Set(scenes.map((s) => s.sceneName));

          // Remove tiles for scenes that no longer exist
          for (const [name] of tiles) {
            if (!currentSceneNames.has(name)) {
              tiles.get(name).el.remove();
              tiles.delete(name);
            }
          }

          // Add tiles for new scenes (reverse — OBS returns bottom-to-top)
          for (const scene of [...scenes].reverse()) {
            if (!tiles.has(scene.sceneName)) {
              const isMedia = isMediaSheet(scene.sceneName);
              const inputName = isMedia
                ? await discoverInputName(scene.sceneName)
                : null;
              const el = createTileElement(scene.sceneName, inputName, isMedia);
              container.appendChild(el);

              const tileData = {
                sceneName: scene.sceneName,
                inputName,
                el,
                isMedia,
                duration: 0,
                cursor: 0,
                mediaState: null,
              };
              tiles.set(scene.sceneName, tileData);
              if (isMedia && inputName) {
                MS.audio.loadInitialState(inputName, el);
              }

              // Fetch thumbnail
              const thumbEl = el.querySelector('.tile-thumbnail');
              fetchThumbnail(scene.sceneName, thumbEl);
            }
          }

          updateTally();
          startPolling();
          logEvent('Grid rebuilt');
        } catch (err) {
          console.error('Failed to rebuild grid:', err);
        }
      }

      // Polling
      function startPolling() {
        // PGM tile: 500ms media status + 5s screenshot
        // Other tiles: 2s media status
        const pgmMediaPoll = setInterval(() => {
          if (!currentPgm) return;
          const tile = tiles.get(currentPgm);
          if (tile?.isMedia) updateMediaStatus(tile);
        }, 500);

        const otherMediaPoll = setInterval(() => {
          for (const [name, tile] of tiles) {
            if (!tile.isMedia || name === currentPgm) continue;
            updateMediaStatus(tile);
          }
        }, 2000);

        const pgmScreenshotPoll = setInterval(() => {
          if (!currentPgm) return;
          const tile = tiles.get(currentPgm);
          if (tile) {
            const thumbEl = tile.el.querySelector('.tile-thumbnail');
            fetchThumbnail(currentPgm, thumbEl);
          }
        }, 5000);

        pollTimers = [pgmMediaPoll, otherMediaPoll, pgmScreenshotPoll];
      }

      function stopPolling() {
        for (const t of pollTimers) clearInterval(t);
        pollTimers = [];
      }

      async function updateMediaStatus(tile) {
        if (!tile.inputName || !MS.connection.connected) return;
        try {
          const status = await MS.connection.obs.call('GetMediaInputStatus', {
            inputName: tile.inputName,
          });

          tile.duration = status.mediaDuration || 0;
          tile.cursor = status.mediaCursor || 0;
          tile.mediaState = status.mediaState;

          // Update progress bar
          const fill = tile.el.querySelector('.progress-bar-fill');
          const timeEl = tile.el.querySelector('.progress-time');
          if (fill && tile.duration > 0) {
            fill.style.width = ((tile.cursor / tile.duration) * 100) + '%';
          }
          if (timeEl) {
            timeEl.textContent = formatTime(tile.cursor) + ' / ' + formatTime(tile.duration);
          }

          // Update transport button states
          const transportBtns = tile.el.querySelectorAll('.btn-transport');
          for (const btn of transportBtns) {
            btn.classList.remove('active');
            const state = status.mediaState;
            if (btn.dataset.cls === 'play' && state === 'OBS_MEDIA_STATE_PLAYING') btn.classList.add('active');
            if (btn.dataset.cls === 'pause' && state === 'OBS_MEDIA_STATE_PAUSED') btn.classList.add('active');
            if (btn.dataset.cls === 'stop' && (state === 'OBS_MEDIA_STATE_STOPPED' || state === 'OBS_MEDIA_STATE_ENDED')) btn.classList.add('active');
          }
        } catch {}
      }

      return {
        rebuild,
        tiles,
        getTile: (name) => tiles.get(name),
        get currentPgm() { return currentPgm; },
        set currentPgm(v) { currentPgm = v; updateTally(); },
        get currentPvw() { return currentPvw; },
        set currentPvw(v) { currentPvw = v; updateTally(); },
        logEvent,
        updateTally,
      };
    })();

    // ===== OBS Event Handlers =====
    (function registerEvents() {
      const obs = MS.connection.obs;

      obs.on('CurrentProgramSceneChanged', (data) => {
        MS.grid.currentPgm = data.sceneName;
        MS.grid.logEvent('PGM → ' + data.sceneName);
      });

      obs.on('CurrentPreviewSceneChanged', (data) => {
        MS.grid.currentPvw = data.sceneName;
        MS.grid.logEvent('PVW → ' + data.sceneName);
      });

      obs.on('SceneCreated', (data) => {
        MS.grid.rebuild();
        MS.grid.logEvent('Scene created: ' + data.sceneName);
      });

      obs.on('SceneRemoved', (data) => {
        MS.grid.rebuild();
        MS.grid.logEvent('Scene removed: ' + data.sceneName);
      });

      obs.on('SceneNameChanged', (data) => {
        const tile = MS.grid.tiles.get(data.oldSceneName);
        if (tile) {
          tile.sceneName = data.sceneName;
          tile.el.dataset.scene = data.sceneName;
          const label = tile.el.querySelector('.tile-label');
          if (label) {
            label.textContent = data.sceneName.startsWith('[MS] ')
              ? data.sceneName.replace('[MS] ', '')
              : data.sceneName;
            label.title = data.sceneName;
          }
          MS.grid.tiles.delete(data.oldSceneName);
          MS.grid.tiles.set(data.sceneName, tile);
          if (MS.grid.currentPgm === data.oldSceneName) MS.grid.currentPgm = data.sceneName;
          if (MS.grid.currentPvw === data.oldSceneName) MS.grid.currentPvw = data.sceneName;
        }
        MS.grid.logEvent('Renamed: ' + data.oldSceneName + ' → ' + data.sceneName);
      });

      obs.on('InputNameChanged', (data) => {
        for (const [, tile] of MS.grid.tiles) {
          if (tile.inputName === data.oldInputName) {
            tile.inputName = data.inputName;
            break;
          }
        }
      });

      obs.on('StudioModeStateChanged', (data) => {
        if (!data.studioModeEnabled) {
          MS.connection.obs.call('SetStudioModeEnabled', { studioModeEnabled: true })
            .catch(() => console.warn('Could not re-enable studio mode'));
        }
      });
    })();

    // ===== Context Menu =====
    MS.contextMenu = (() => {
      const menu = document.getElementById('context-menu');
      const btnRemove = document.getElementById('ctx-remove');
      let targetScene = null;

      function show(x, y, sceneName) {
        targetScene = sceneName;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        menu.hidden = false;
      }

      function hide() {
        menu.hidden = true;
        targetScene = null;
      }

      btnRemove.addEventListener('click', async () => {
        if (!targetScene) return;
        try {
          await MS.connection.obs.call('RemoveScene', { sceneName: targetScene });
        } catch (err) {
          console.error('Failed to remove scene:', err);
        }
        hide();
      });

      document.addEventListener('click', hide);

      return { show, hide };
    })();

    // ===== File Import =====
    MS.fileImport = (() => {
      const btnAdd = document.getElementById('btn-add-input');
      const fileInput = document.getElementById('file-input');
      const pickerModal = document.getElementById('picker-modal');
      const pickerList = document.getElementById('picker-list');
      const pickerCancel = document.getElementById('picker-cancel');
      const pickerFilename = document.getElementById('picker-filename');

      btnAdd.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileInput.value = '';
        await importFile(file);
      });

      async function importFile(file) {
        const { name, size, lastModified } = file;

        let resolveResult;
        try {
          const resp = await fetch('/api/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, size, lastModified }),
          });
          resolveResult = await resp.json();
        } catch (err) {
          alert('MediaSheet server is unreachable — restart the server to add new files. Existing inputs are unaffected.');
          return;
        }

        if (resolveResult.error === 'not_found') {
          alert(resolveResult.message);
          return;
        }
        if (resolveResult.error) {
          alert(resolveResult.message || 'File resolution failed.');
          return;
        }

        let filePath;
        if (resolveResult.path) {
          filePath = resolveResult.path;
        } else if (resolveResult.matches) {
          filePath = await showPicker(name, resolveResult.matches);
          if (!filePath) return;
        }

        await createOBSInput(name, filePath);
      }

      function showPicker(filename, matches) {
        return new Promise((resolve) => {
          pickerFilename.textContent = `Select the correct "${filename}":`;
          pickerList.innerHTML = '';

          for (const m of matches) {
            const li = document.createElement('li');
            const pathDiv = document.createElement('div');
            pathDiv.className = 'picker-path';
            pathDiv.textContent = m.path;
            li.appendChild(pathDiv);

            const metaDiv = document.createElement('div');
            metaDiv.className = 'picker-meta';
            const sizeKB = Math.round(m.size / 1024);
            const date = new Date(m.modified).toLocaleString();
            metaDiv.textContent = `${sizeKB} KB · ${date}`;
            li.appendChild(metaDiv);

            li.addEventListener('click', () => {
              pickerModal.hidden = true;
              resolve(m.path);
            });
            pickerList.appendChild(li);
          }

          pickerCancel.onclick = () => {
            pickerModal.hidden = true;
            resolve(null);
          };

          pickerModal.hidden = false;
        });
      }

      async function createOBSInput(filename, filePath) {
        const obs = MS.connection.obs;

        let sceneName = `[MS] ${filename}`;
        let inputName = sceneName;
        try {
          const { scenes } = await obs.call('GetSceneList');
          const { inputs } = await obs.call('GetInputList');
          const sceneNames = new Set(scenes.map((s) => s.sceneName));
          const inputNames = new Set(inputs.map((i) => i.inputName));

          let counter = 1;
          while (sceneNames.has(sceneName) || inputNames.has(inputName)) {
            counter++;
            sceneName = `[MS] ${filename} (${counter})`;
            inputName = sceneName;
          }
        } catch (err) {
          console.error('Failed to check for duplicates:', err);
        }

        try {
          await obs.call('CreateScene', { sceneName });

          const { sceneItemId } = await obs.call('CreateInput', {
            sceneName,
            inputName,
            inputKind: 'ffmpeg_source',
            inputSettings: {
              local_file: filePath,
              is_local_file: true,
              restart_on_activate: false,
              close_when_inactive: false,
            },
            sceneItemEnabled: true,
          });

          await obs.call('SetSceneItemTransform', {
            sceneName,
            sceneItemId,
            sceneItemTransform: {
              boundsType: 'OBS_BOUNDS_SCALE_INNER',
              boundsWidth: MS.canvas.width,
              boundsHeight: MS.canvas.height,
              boundsAlignment: 0,
            },
          });

          MS.grid.logEvent('Added: ' + filename);
        } catch (err) {
          alert(`Couldn't create scene in OBS. Check that OBS is running and the WebSocket connection is active.\n\n${err.message}`);
        }
      }

      return { importFile };
    })();

    // ===== Init =====
    (function init() {
      // Load fade duration from localStorage
      const savedDuration = localStorage.getItem('ms_transition_duration');
      if (savedDuration) {
        document.getElementById('fade-duration').value = savedDuration;
      }
      document.getElementById('fade-duration').addEventListener('change', (e) => {
        localStorage.setItem('ms_transition_duration', e.target.value);
      });

      // Auto-connect
      const cfg = MS.connection.getConfig();
      MS.connection.connect(cfg.host || 'localhost', cfg.port || 4455, cfg.password || '');
    })();
  </script>
</body>
