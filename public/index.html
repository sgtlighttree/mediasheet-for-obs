      // mix a #rrggbb color into the dock background so a tile and its box share one flat fill
      function tintOf(hex, amount) {
        const base = [0x1d, 0x1f, 0x26];
        const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
        return '#' + c.map((v, i) => Math.round(base[i] + (v - base[i]) * amount).toString(16).padStart(2, '0')).join('');
      }

      const isCollapsed = (sceneName) => MS.store.get().collapsed.includes(sceneName);

      async function setCollapsed(sceneName, on) {
        await MS.store.update((d) => ({
          ...d,
          collapsed: on ? [...new Set([...d.collapsed, sceneName])] : d.collapsed.filter((n) => n !== sceneName),
        }));
        decorate(sceneName);
      }

      function expand(sceneName) {
        if (isCollapsed(sceneName)) setCollapsed(sceneName, false).catch(() => {});
      }

      function decorate(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        if (!tile) return;
        const scan = MS.playlists.getScan(sceneName);
        const playlist = !!scan?.detection.auto;
        const row = rows.get(sceneName);
        const collapsed = isCollapsed(sceneName);
        const color = playlist ? colorFor(sceneName) : '#5A5F70';
        const tint = tintOf(color, 0.16);
        if (row) row.hidden = collapsed;
        tile.el.classList.toggle('pl', playlist || !!row);
        tile.el.classList.toggle('pl-open', !!row && !collapsed);
        tile.el.classList.toggle('pl-collapsed', !!row && collapsed);
        const label = tile.el.querySelector('.tile-label');
        if (label) label.dataset.sub = playlist ? `${scan.detection.clips.length} clips` : '';
        for (const el of [tile.el, row]) {
          if (!el) continue;
          el.style.setProperty('--pl-color', color);
          el.style.setProperty('--pl-tint', tint);
        }
      }

      function showing(sceneName) {
        const scan = MS.playlists.getScan(sceneName);
        if (!scan || scan.items.length < 2) return false;
        if (scan.detection.auto) return true;
        return MS.store.get().subgrid[sceneName] === true;
      }

      function thumbUrl(file) {
        return `/api/thumb?path=${encodeURIComponent(file)}`;
      }

      function setThumb(thumbEl, file) {
        if (!file) return;
        const img = document.createElement('img');
        img.onload = () => { thumbEl.innerHTML = ''; thumbEl.appendChild(img); };
        img.src = thumbUrl(file);
      }

      function buildClip(sceneName, item) {
        const el = document.createElement('div');
        el.className = 'clip-tile';
        el.dataset.scene = sceneName;
        el.dataset.item = item.sceneItemId;

        const thumb = document.createElement('div');
        thumb.className = 'tile-thumbnail';
        const fallback = document.createElement('span');
        fallback.className = 'fallback-icon';
        fallback.textContent = item.kind === 'image' ? '🖼' : '🎬';
        thumb.appendChild(fallback);
        setThumb(thumb, item.file);
        el.appendChild(thumb);

        const badge = document.createElement('div');
        badge.className = 'clip-badge';
        el.appendChild(badge);

        const restart = document.createElement('button');
        restart.className = 'clip-restart';
        restart.textContent = '↺';
        restart.title = 'Restart this live clip from 0:00';
        restart.hidden = true;
        restart.addEventListener('click', (e) => {
          e.stopPropagation();
          MS.cue.restartLive(item);
        });
        el.appendChild(restart);

        // Toggled (non-playlist) sub-grids are read-only: cueing there would switch off a camera behind an overlay
        const cueable = !!MS.playlists.getScan(sceneName)?.detection.auto;
        if (cueable) {
          el.classList.add('cueable');
          el.addEventListener('click', () => MS.cue.cueClip(sceneName, item));
        }

        const name = document.createElement('div');
        name.className = 'clip-name';
        name.textContent = item.sourceName;
        name.title = item.sourceName;
        el.appendChild(name);

        const meter = document.createElement('div');
        meter.className = 'clip-meter';
        const fill = document.createElement('div');
        fill.className = 'clip-meter-fill';
        meter.appendChild(fill);
        el.appendChild(meter);

        const silent = document.createElement('div');
        silent.className = 'clip-silent';
        el.appendChild(silent);

        let route = null;
        if (cueable && item.kind === 'video') {
          route = document.createElement('select');
          route.className = 'clip-route';
          for (const [v, label] of [['both', 'Room + stream'], ['room', 'Room only'], ['stream', 'Stream only']]) {
            const o = document.createElement('option');
            o.value = v;
            o.textContent = label;
            route.appendChild(o);
          }
          route.addEventListener('click', (e) => e.stopPropagation());
          route.addEventListener('change', () => setRoute(c, route.value));
          el.appendChild(route);
        }

        const c = { el, badge, fill, thumb, restart, route, silent, item, active: false };
        return c;
      }

      function applyState(sceneName, c) {
        const state = c.active ? 'pgm' : c.item.enabled ? 'pvw' : 'idle';
        c.el.classList.toggle('tally-pgm', state === 'pgm');
        c.el.classList.toggle('tally-pvw', state === 'pvw');
        c.badge.textContent = state === 'pgm' ? 'LIVE' : state === 'pvw' ? 'CUED' : '';
        c.restart.hidden = !(state === 'pgm' && c.item.kind === 'video');
        if (c.route) c.route.disabled = c.active;
        if (c.route) c.route.title = c.active ? 'Live clip: route is locked while on Program' : 'Where this clip\'s sound goes';
        if (state !== 'pgm') c.fill.style.width = '0%';
      }

      function updateParentThumb(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        const scan = MS.playlists.getScan(sceneName);
        if (!tile || !scan || !tile.isPlaylist) return;
        const live = scan.detection.clips.find((it) => clips.get(key(sceneName, it.sceneItemId))?.active);
        const pick = live || scan.detection.clips[0];
        if (pick?.file) setThumb(tile.el.querySelector('.tile-thumbnail'), pick.file);
      }

      function paintRoute(c, route) {
        if (!c.route) return;
        c.route.value = route;
        c.silent.textContent = route === 'stream' ? 'SILENT IN ROOM' : '';
      }

      async function loadRoute(c) {
        if (!c.route) return;
        try {
          const { monitorType } = await MS.connection.obs.call('GetInputAudioMonitorType', { inputName: c.item.sourceName });
          let route = window.MSPlaylist.monitorTypeToRoute(monitorType);
          // A clip at None that was never chosen as Stream only gets Room + stream when it is cued or goes live
          if (route === 'stream' && !MS.store.get().streamOnly.includes(c.item.sourceName)) route = 'both';
          paintRoute(c, route);
        } catch {}
      }

      async function setRoute(c, route) {
        if (c.active) { loadRoute(c); return; }
        const name = c.item.sourceName;
        try {
          await MS.connection.obs.call('SetInputAudioMonitorType', {
            inputName: name,
            monitorType: window.MSPlaylist.routeToMonitorType(route),
          });
          await MS.store.update((d) => ({
            ...d,
            streamOnly: route === 'stream'
              ? [...new Set([...d.streamOnly, name])]
              : d.streamOnly.filter((n) => n !== name),
          }));
          paintRoute(c, route);
        } catch (err) {
          MS.grid.logEvent(`Route change failed: ${err.message}`);
          loadRoute(c);
        }
      }

      async function refreshTally(sceneName) {
        const scan = MS.playlists.getScan(sceneName);
        if (!scan) return;
        const actives = await Promise.all(scan.items.map((it) =>
          MS.connection.obs.call('GetSourceActive', { sourceName: it.sourceName })
            .then((r) => r.videoActive)
            .catch(() => false)));
        scan.items.forEach((it, i) => {
          const c = clips.get(key(sceneName, it.sceneItemId));
          if (c) { c.active = actives[i]; c.item = it; applyState(sceneName, c); }
        });
        updateParentThumb(sceneName);
      }

      function ensureToggle(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        const scan = MS.playlists.getScan(sceneName);
        if (!tile) return;
        let btn = tile.el.querySelector('.btn-clips');
        const eligible = !!scan && scan.items.length >= 2;
        let chev = tile.el.querySelector('.btn-collapse');
        if (eligible && scan.detection.auto) {
          btn?.remove();
          if (!chev) {
            chev = document.createElement('button');
            chev.className = 'btn-collapse';
            chev.setAttribute('aria-label', 'Collapse or expand this playlist\'s clips');
            chev.title = 'Collapse or expand the clips';
            chev.appendChild(document.createElement('span'));
            const stop = (e) => e.stopPropagation(); // a click here must not also preview or take the scene
            chev.addEventListener('dblclick', stop);
            chev.addEventListener('click', (e) => {
              e.stopPropagation();
              setCollapsed(sceneName, !isCollapsed(sceneName)).catch(() => {});
            });
            tile.el.appendChild(chev); // not the thumbnail: its picture is replaced when a clip thumbnail loads
          }
          return;
        }
        chev?.remove();
        if (!eligible) { btn?.remove(); return; }
        if (!btn) {
          btn = document.createElement('button');
          btn.className = 'btn-clips';
          btn.textContent = 'clips';
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const next = !showing(sceneName);
            await MS.store.update((d) => ({ ...d, subgrid: { ...d.subgrid, [sceneName]: next } }));
            render(sceneName);
          });
          tile.el.querySelector('.tile-thumbnail').appendChild(btn);
        }
        btn.classList.toggle('on', showing(sceneName));
      }

      function displayedItems(scan) {
        return scan.detection.auto ? scan.detection.clips : scan.items;
      }

      // Same clips already on screen: update in place so thumbnails don't flicker
      function reuseRow(sceneName, scan) {
        if (!rows.has(sceneName) || !showing(sceneName)) return false;
        const shown = displayedItems(scan).map((i) => String(i.sceneItemId));
        const current = [...clips.keys()].filter((k) => k.startsWith(sceneName + '|')).map((k) => k.split('|')[1]);
        if (shown.length !== current.length || !shown.every((id) => current.includes(id))) return false;
        for (const item of displayedItems(scan)) {
          const c = clips.get(key(sceneName, item.sceneItemId));
          if (c) { c.item = item; applyState(sceneName, c); }
        }
        return true;
      }

      function render(sceneName) {
        const tile = MS.grid.getTile(sceneName);
        const scan = MS.playlists.getScan(sceneName);
        if (tile && scan && reuseRow(sceneName, scan)) {
          ensureToggle(sceneName);
          refreshTally(sceneName);
          return;
        }
        rows.get(sceneName)?.remove();
        rows.delete(sceneName);
        for (const k of [...clips.keys()]) if (k.startsWith(sceneName + '|')) clips.delete(k);
        if (!tile) return;
        ensureToggle(sceneName);
        if (!showing(sceneName)) { decorate(sceneName); return; }

        const row = document.createElement('div');
        row.className = 'subgrid-row';
        row.dataset.scene = sceneName;
        const head = document.createElement('div');
        head.className = 'subgrid-head';
        const title = document.createElement('div');
        title.className = 'subgrid-title';
        title.textContent = `${sceneName} — ${scan.detection.auto ? scan.detection.kind + ' playlist' : 'sources'}`;
        head.appendChild(title);
        if (scan.detection.auto) {
          const manage = document.createElement('button');
          manage.className = 'btn-manage';
          const paint = () => {
            const on = MS.manager.isManagedPlaylist(sceneName);
            manage.classList.toggle('on', on);
            manage.textContent = on ? 'Managed' : 'Manage';
            manage.title = on
              ? 'MediaSheet handles this playlist: restarts and unmutes a clip when it goes live, mutes it when it leaves, pre-rolls takes, resets idle clips. Click to switch off.'
              : 'MediaSheet leaves this playlist alone. Click to switch it on.';
          };
          paint();
          manage.addEventListener('click', async () => {
            await MS.manager.setManaged(sceneName, !MS.manager.isManagedPlaylist(sceneName));
            paint();
          });
          head.appendChild(manage);
        }
        if (scan.detection.auto) {
          const fold = document.createElement('button');
          fold.className = 'btn-manage';
          fold.textContent = 'Collapse';
          fold.title = 'Fold the clips away (they keep working; click the tile chevron to open them again)';
          fold.addEventListener('click', () => setCollapsed(sceneName, true).catch(() => {}));
          head.appendChild(fold);
        }
        row.appendChild(head);

        const list = (scan.detection.auto ? scan.detection.clips : scan.items)
          .slice()
          .sort((a, b) => a.sceneItemId - b.sceneItemId);
        for (const item of list) {
          const c = buildClip(sceneName, item);
          clips.set(key(sceneName, item.sceneItemId), c);
          row.appendChild(c.el);
        }
        if (scan.detection.auto && scan.detection.kind === 'video') {
          const add = document.createElement('div');
          add.className = 'clip-tile clip-add cueable';
          add.textContent = '+';
          add.title = 'Import a clip into this scene';
          add.addEventListener('click', () => MS.subgrid.importInto(sceneName));
          row.appendChild(add);
        }
        tile.el.after(row);
        rows.set(sceneName, row);
        decorate(sceneName);
        for (const [k, c] of clips) if (k.startsWith(sceneName + '|')) loadRoute(c);
        refreshTally(sceneName);
      }

      function renderAll() {
        for (const [name, row] of rows) {
          if (!MS.grid.getTile(name)) { row.remove(); rows.delete(name); }
        }
        for (const name of MS.grid.tiles.keys()) render(name);
      }

      function scheduleRescan(sceneName) {
        clearTimeout(rescanTimers.get(sceneName));
        rescanTimers.set(sceneName, setTimeout(async () => {
          if (!MS.grid.getTile(sceneName)) return;
          try {
            const scan = await MS.playlists.scan(sceneName);
            const tile = MS.grid.getTile(sceneName);
            if (tile) {
              tile.isPlaylist = !!scan.detection.auto;
              if (tile.isPlaylist) tile.isMedia = false;
            }
            render(sceneName);
          } catch {}
        }, 150));
      }

      const obs = MS.connection.obs;
      obs.on('InputActiveStateChanged', (d) => {
        for (const [k, c] of clips) {
          if (c.item.sourceName !== d.inputName) continue;
          c.active = d.videoActive;
          applyState(k.split('|')[0], c);
        }
        for (const name of rows.keys()) updateParentThumb(name);
      });
      obs.on('SceneItemEnableStateChanged', (d) => {
        const c = clips.get(key(d.sceneName, d.sceneItemId));
        if (!c) return;
        c.item.enabled = d.sceneItemEnabled;
        applyState(d.sceneName, c);
      });
      obs.on('InputAudioMonitorTypeChanged', (d) => {
        for (const c of clips.values()) if (c.item.sourceName === d.inputName) loadRoute(c);
      });
      for (const ev of ['SceneItemCreated', 'SceneItemRemoved', 'SceneItemListReindexed']) {
        obs.on(ev, (d) => { if (MS.grid.getTile(d.sceneName)) scheduleRescan(d.sceneName); });
      }
      obs.on('InputVolumeMeters', (d) => {
        for (const x of d.inputs) {
          let peak = 0;
          for (const ch of x.inputLevelsMul) peak = Math.max(peak, ch[1] || 0);
          meters.set(x.inputName, peak);
        }
      });

      function paintMeters() {
        for (const c of clips.values()) {
          if (!c.active) continue;
          const peak = meters.get(c.item.sourceName) || 0;
          const db = peak > 0 ? 20 * Math.log10(peak) : -60;
          c.fill.style.width = Math.max(0, Math.min(100, ((db + 60) / 60) * 100)) + '%';
        }
        requestAnimationFrame(paintMeters);
      }
      requestAnimationFrame(paintMeters);

      const picker = document.createElement('input');
      picker.type = 'file';
      picker.accept = 'video/*';
      picker.hidden = true;
      document.body.appendChild(picker);
      let importTarget = null;
      picker.addEventListener('change', async () => {
        const file = picker.files[0];
        picker.value = '';
        if (file && importTarget) await MS.fileImport.importFile(file, importTarget);
      });
      function importInto(sceneName) {
        importTarget = sceneName;
        picker.click();
      }

      return { render, renderAll, refreshTally, clips, showing, importInto, expand };
    })();

    // ===== In-page Confirm =====
    // window.confirm may be suppressed in OBS's CEF dock, so a safety gate can't depend on it.
    MS.confirm = (message, okLabel) => new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const box = document.createElement('div');
      box.className = 'modal';
      const p = document.createElement('p');
      p.textContent = message;
      const actions = document.createElement('div');
      actions.className = 'modal-actions';
      const done = (v) => { overlay.remove(); resolve(v); };
      const cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', () => done(false));
      const ok = document.createElement('button');
      ok.className = 'btn btn-primary';
      ok.textContent = okLabel || 'Continue';
      ok.addEventListener('click', () => done(true));
      actions.append(cancel, ok);
      box.append(p, actions);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      cancel.focus();
    });

    // ===== Cue =====
    MS.cue = (() => {
      const P = window.MSPlaylist;
      const RESTART = 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_RESTART';
      const PAUSE = 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PAUSE';
      // Lives in OBS so every MediaSheet client agrees: a second client must not flip a Stream-only clip back on at take.
      const streamOnlyChosen = { has: (name) => MS.store.get().streamOnly.includes(name) };
      let busy = false;
      let sawTransitionEnd = false;

      function setBusy(on) {
        busy = on;
        for (const id of ['btn-cut', 'btn-fade']) {
          const b = document.getElementById(id);
          if (b) b.disabled = on || !MS.connection.connected;
        }
      }

      async function sceneDuplication() {
        try {
          const r = await fetch('/api/obs-config');
          return (await r.json()).sceneDuplication;
        } catch {
          return 'unknown';
        }
      }

      // Register the listener before RESTART: the event can fire in the same millisecond.
      // Cue: RESTART, wait for playback, give OBS ~100 ms to draw the first frame, then PAUSE. Pausing the instant PlaybackStarted fires can land before any frame exists (black cued frame, measured); seeking to 0 instead leaves a clip whose later PLAY holds the old picture for ~1 s while the audio runs (measured), so the take restarts the clip (planActivate) and the cue never seeks.
      const CUE_FRAME_MS = 100;
      async function primeFirstFrame(inputName) {
        const obs = MS.connection.obs;
        let handler;
        const started = new Promise((resolve) => {
          const timer = setTimeout(() => resolve(false), 2000);
          handler = (d) => { if (d.inputName === inputName) { clearTimeout(timer); resolve(true); } };
          obs.on('MediaInputPlaybackStarted', handler);
        });
        try {
          await obs.call('TriggerMediaInputAction', { inputName, mediaAction: RESTART });
          await started;
        } finally {
          obs.off('MediaInputPlaybackStarted', handler);
        }
        await new Promise((r) => setTimeout(r, CUE_FRAME_MS));
        // A take during the cue must not freeze Program
        const { videoActive } = await obs.call('GetSourceActive', { sourceName: inputName });
        if (!videoActive) await obs.call('TriggerMediaInputAction', { inputName, mediaAction: PAUSE });
      }

      async function cueClip(sceneName, clipItem) {
        if (busy || !MS.connection.connected) return;
        setBusy(true);
        const tileEl = MS.subgrid.clips.get(`${sceneName}|${clipItem.sceneItemId}`)?.el;
        tileEl?.classList.add('cueing');
        const obs = MS.connection.obs;
        try {
          const scan = await MS.playlists.scan(sceneName);
          const item = scan.items.find((i) => i.sceneItemId === clipItem.sceneItemId);
          if (!item) throw new Error('Clip is no longer in the scene');
          const activeFlags = await Promise.all(scan.items.map((i) =>
            obs.call('GetSourceActive', { sourceName: i.sourceName }).then((r) => r.videoActive).catch(() => false)));
          const active = new Set(scan.items.filter((_, i) => activeFlags[i]).map((i) => i.sourceName));

          const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
          if (currentProgramSceneName === sceneName) {
            const dup = await sceneDuplication();
            if (dup !== 'true' || !sawTransitionEnd) {
              const why = dup !== 'true'
                ? 'Duplicate Scene is not confirmed on'
                : 'no transition has been seen since MediaSheet connected';
              const ok = await MS.confirm(
                `"${sceneName}" is on Program and ${why}. Cueing could change what is live right now.`,
                'Cue anyway');
              if (!ok) return;
            }
          }

          const monitorType = item.kind === 'video'
            ? (await obs.call('GetInputAudioMonitorType', { inputName: item.sourceName })).monitorType
            : '';
          const reqs = P.planCue({
            sceneName,
            clip: item,
            items: scan.items,
            active,
            monitorType,
            streamOnlyChosen: streamOnlyChosen.has(item.sourceName),
          });
          if (currentPreviewSceneName !== sceneName) {
            await obs.call('SetCurrentPreviewScene', { sceneName });
          }
          for (const r of reqs) await obs.call(r.request, r.data);
          if (item.kind === 'video' && !active.has(item.sourceName)) await primeFirstFrame(item.sourceName);

          MS.grid.logEvent(`Cued: ${item.sourceName}`);
        } catch (err) {
          console.error('Cue failed:', err);
          MS.grid.logEvent(`Cue failed: ${err.message}`);
        } finally {
          tileEl?.classList.remove('cueing');
          setBusy(false);
        }
      }

      async function restartLive(item) {
        try {
          await MS.connection.obs.call('TriggerMediaInputAction', { inputName: item.sourceName, mediaAction: RESTART });
        } catch (err) {
          MS.grid.logEvent(`Restart failed: ${err.message}`);
        }
      }

      MS.connection.obs.on('SceneTransitionEnded', () => { sawTransitionEnd = true; });

      return {
        cueClip,
        restartLive,
        streamOnlyChosen,
        resetSession() { sawTransitionEnd = false; },
        sawTransition: () => sawTransitionEnd,
        get busy() { return busy; },
      };
    })();

    // ===== Playlist Manager =====
    // Everything here acts only on MANAGED playlist scenes, and never on an input that is live on Program
    // except to unmute/route it as part of going live.
    MS.manager = (() => {
      const P = window.MSPlaylist;
      const obs = MS.connection.obs;
      const ACT = 'OBS_WEBSOCKET_MEDIA_INPUT_ACTION_';
      const views = { pgm: null, pvw: null };
      const idleTimers = new Map();
      let defaults = null;
      let transitioning = false;
      let transitionEndedAt = null;

      // Video playlists are managed unless switched off; image playlists only when switched on
      const managedSet = () => new Set(MS.playlists.playlistScenes().filter(({ sceneName, kind }) => {
        const d = MS.store.get();
        return kind === 'video' ? !d.unmanaged.includes(sceneName) : d.managed.includes(sceneName);
      }).map((x) => x.sceneName));
      const isManagedPlaylist = (scene) => managedSet().has(scene);

      async function run(reqs) {
        for (const r of reqs) await obs.call(r.request, r.data);
      }

      async function activeSet(items) {
        const flags = await Promise.all(items.map((i) =>
          obs.call('GetSourceActive', { sourceName: i.sourceName }).then((r) => r.videoActive).catch(() => false)));
        return new Set(items.filter((_, i) => flags[i]).map((i) => i.sourceName));
      }

      function managedSceneFor(inputName) {
        for (const scene of managedSet()) {
          const scan = MS.playlists.getScan(scene);
          const clip = scan?.detection.auto && scan.detection.clips.find((c) => c.sourceName === inputName);
          if (clip) return { scene, clip };
        }
        return null;
      }

      async function onInactive(inputName) {
        const hit = managedSceneFor(inputName);
        if (!hit) return;
        const { videoActive } = await obs.call('GetSourceActive', { sourceName: inputName });
        await run(P.planLeave({
          sourceName: inputName,
          kind: hit.clip.kind,
          active: videoActive ? new Set([inputName]) : new Set(),
        }));
        if (!videoActive && hit.clip.kind === 'video') scheduleSwapCue(hit.scene, hit.clip);
      }

      // Like switching scenes: after a take the clip that just left Program is cued in Preview, so CUT swaps them back.
      const swapTimers = new Map();
      function scheduleSwapCue(sceneName, clip) {
        clearTimeout(swapTimers.get(sceneName));
        swapTimers.set(sceneName, setTimeout(() => {
          swapCue(sceneName, clip).catch((err) => console.error('Swap cue failed:', err));
        }, 300));
      }

      async function swapCue(sceneName, clip) {
        // Without a take this session a cue would raise the "Cue anyway" prompt unasked
        if (transitioning || !MS.cue.sawTransition() || !isManagedPlaylist(sceneName)) return;
        const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
        if (currentProgramSceneName !== sceneName || currentPreviewSceneName !== sceneName) return;
        const { videoActive } = await obs.call('GetSourceActive', { sourceName: clip.sourceName });
        if (videoActive) return;
        // Only while Preview still shows nothing but the live clip: never override a clip the operator cued meanwhile
        const scan = await MS.playlists.scan(sceneName);
        const enabled = scan.items.filter((i) => i.enabled);
        const live = await activeSet(enabled);
        if (enabled.some((i) => !live.has(i.sourceName))) return;
        await MS.cue.cueClip(sceneName, clip);
      }

      async function onActive(inputName) {
        const hit = managedSceneFor(inputName);
        if (!hit || hit.clip.kind !== 'video') return;
        const [{ inputMuted }, { monitorType }, status] = await Promise.all([
          obs.call('GetInputMute', { inputName }),
          obs.call('GetInputAudioMonitorType', { inputName }),
          obs.call('GetMediaInputStatus', { inputName }).catch(() => ({})),
        ]);
        await run(P.planActivate({
          sourceName: inputName,
          kind: hit.clip.kind,
          muted: inputMuted,
          mediaState: status.mediaState,
          prerolled: MS.preroll.was(inputName),
          monitorType,
          streamOnlyChosen: MS.cue.streamOnlyChosen.has(inputName),
          monitorSwitchSafe: true,
        }));
      }

      async function evaluateIdle(sceneName, trigger) {
        if (!isManagedPlaylist(sceneName)) return;
        const scan = await MS.playlists.scan(sceneName);
        if (!scan.detection.auto) return;
        const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
        const clips = scan.detection.clips;
        if (!P.shouldIdleReset({
          managed: true,
          isProgram: currentProgramSceneName === sceneName,
          isPreview: currentPreviewSceneName === sceneName,
          enabledClipCount: clips.filter((c) => c.enabled).length,
          trigger,
        })) return;
        await run(P.planIdle({ sceneName, clips, active: await activeSet(clips) }));
        MS.grid.logEvent(`Idle reset: ${sceneName}`);
      }

      function scheduleIdle(sceneName, trigger) {
        clearTimeout(idleTimers.get(sceneName));
        idleTimers.set(sceneName, setTimeout(() => {
          evaluateIdle(sceneName, trigger).catch((err) => console.error('Idle reset failed:', err));
        }, 500));
      }

      async function ensureDefaults() {
        if (!defaults) {
          defaults = (await obs.call('GetInputDefaultSettings', { inputKind: 'ffmpeg_source' })).defaultInputSettings;
        }
        return defaults;
      }

      // Compare effective values: a key left at its default is absent from GetInputSettings.
      async function normalizeInput(inputName, want) {
        const d = await ensureDefaults();
        const { inputSettings } = await obs.call('GetInputSettings', { inputName });
        const patch = {};
        for (const [k, v] of Object.entries(want)) {
          if ((inputSettings[k] ?? d[k]) !== v) patch[k] = v;
        }
        if (!Object.keys(patch).length) return false;
        await obs.call('SetInputSettings', { inputName, inputSettings: patch, overlay: true });
        return true;
      }

      async function normalizeScene(sceneName) {
        if (!isManagedPlaylist(sceneName)) return 0;
        const scan = await MS.playlists.scan(sceneName);
        let changed = 0;
        for (const clip of scan.detection.clips) {
          if (clip.kind !== 'video') continue;
          if (await normalizeInput(clip.sourceName, { clear_on_media_end: false, restart_on_activate: false })) changed++;
        }
        if (changed) MS.grid.logEvent(`Normalized ${changed} clip(s) in ${sceneName}`);
        return changed;
      }

      async function setManaged(sceneName, on) {
        await MS.store.update((d) => ({
          ...d,
          managed: on ? [...new Set([...d.managed, sceneName])] : d.managed.filter((n) => n !== sceneName),
          unmanaged: on ? d.unmanaged.filter((n) => n !== sceneName) : [...new Set([...d.unmanaged, sceneName])],
        }));
        if (on) {
          await normalizeScene(sceneName).catch((err) => console.error('Normalize failed:', err));
          scheduleIdle(sceneName, 'connect');
        }
        MS.subgrid.render(sceneName);
      }

      function renameScene(oldName, newName) {
        if (views.pgm === oldName) views.pgm = newName;
        if (views.pvw === oldName) views.pvw = newName;
        clearTimeout(idleTimers.get(oldName));
        idleTimers.delete(oldName);
      }

      async function onConnect() {
        const { currentProgramSceneName, currentPreviewSceneName } = await obs.call('GetSceneList');
        views.pgm = currentProgramSceneName;
        views.pvw = currentPreviewSceneName;
        transitioning = false;
        transitionEndedAt = null;
        for (const scene of managedSet()) {
          if (!MS.playlists.isPlaylist(scene)) continue;
          await normalizeScene(scene).catch((err) => console.error('Normalize failed:', err));
          scheduleIdle(scene, 'connect');
        }
      }

      function leftViews(oldScene) {
        if (oldScene && oldScene !== views.pgm && oldScene !== views.pvw) scheduleIdle(oldScene, 'leftViews');
      }

      obs.on('CurrentProgramSceneChanged', (d) => {
        const old = views.pgm;
        views.pgm = d.sceneName;
        leftViews(old);
      });
      obs.on('CurrentPreviewSceneChanged', (d) => {
        const old = views.pvw;
        views.pvw = d.sceneName;
        leftViews(old);
      });
      obs.on('SceneTransitionStarted', () => { transitioning = true; });
      obs.on('SceneTransitionEnded', () => { transitioning = false; transitionEndedAt = Date.now(); });
      obs.on('InputActiveStateChanged', (d) => {
        const job = d.videoActive ? onActive(d.inputName) : onInactive(d.inputName);
        job.catch((err) => console.error('Active-state handler failed:', err));
      });
      obs.on('SceneItemCreated', (d) => {
        // The scene may just have become a playlist: rescan before deciding
        setTimeout(async () => {
          await MS.playlists.scan(d.sceneName).catch(() => null);
          if (managedSet().has(d.sceneName)) normalizeScene(d.sceneName).catch(() => {});
        }, 400);
      });

      // Pile-up: two or more clips of one playlist live on Program is never legitimate under solo.
      function rowFor(sceneName) {
        return [...document.querySelectorAll('.subgrid-row')].find((r) => r.dataset.scene === sceneName);
      }
      function hideBanner(row) { row?.querySelector('.pileup')?.remove(); }
      async function resetPileup(sceneName) {
        const scan = await MS.playlists.scan(sceneName);
        await run(P.planIdle({ sceneName, clips: scan.detection.clips, active: new Set() }));
        MS.grid.logEvent(`Pile-up reset: ${sceneName}`);
      }
      setInterval(async () => {
        if (!MS.connection.connected) return;
        for (const scene of managedSet()) {
          const row = rowFor(scene);
          if (!row) continue;
          const activeClips = [...MS.subgrid.clips.entries()]
            .filter(([k, c]) => k.startsWith(scene + '|') && c.active && c.item.kind === 'video')
            .map(([, c]) => c.item.sourceName);
          // Stopped clips can stay "active" in Program's copy until the next take; only playing ones are a pile-up
          let live = 0;
          if (scene === views.pgm && activeClips.length >= 2) {
            const states = await Promise.all(activeClips.map((n) =>
              obs.call('GetMediaInputStatus', { inputName: n }).then((r) => r.mediaState).catch(() => null)));
            live = states.filter((st) => st === 'OBS_MEDIA_STATE_PLAYING').length;
          }
          const show = scene === views.pgm && P.shouldEvaluatePileup({
            transitioning,
            msSinceTransitionEnd: transitionEndedAt === null ? null : Date.now() - transitionEndedAt,
            liveClips: live,
          });
          let banner = row.querySelector('.pileup');
          if (!show) { hideBanner(row); continue; }
          if (!banner) {
            banner = document.createElement('div');
            banner.className = 'pileup';
            const text = document.createElement('span');
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = 'Reset';
            btn.addEventListener('click', () => resetPileup(scene).catch((err) => console.error(err)));
            banner.append(text, btn);
            row.insertBefore(banner, row.children[1] || null);
          }
          banner.querySelector('span').textContent = `${live} clips playing on Program — Reset?`;
          MS.subgrid.expand(scene);
        }
      }, 1000);

      return { setManaged, normalizeInput, normalizeScene, evaluateIdle, onConnect, isManagedPlaylist, renameScene };
    })();

    // ===== File Import =====
    MS.fileImport = (() => {
      const btnAdd = document.getElementById('btn-add-input');
      const fileInput = document.getElementById('file-input');
      const pickerModal = document.getElementById('picker-modal');
      const pickerList = document.getElementById('picker-list');
      const pickerCancel = document.getElementById('picker-cancel');
      const pickerFilename = document.getElementById('picker-filename');

      btnAdd.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        fileInput.value = '';
        await importFile(file);
      });

      async function importFile(file, targetScene = null) {
        const { name, size, lastModified } = file;

        let resolveResult;
        try {
          const resp = await fetch('/api/resolve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, size, lastModified }),
          });
          resolveResult = await resp.json();
        } catch (err) {
          alert('MediaSheet server is unreachable — restart the server to add new files. Existing inputs are unaffected.');
          return;
        }

        if (resolveResult.error === 'not_found') {
          alert(resolveResult.message);
          return;
        }
        if (resolveResult.error) {
          alert(resolveResult.message || 'File resolution failed.');
          return;
        }

        let filePath;
        if (resolveResult.path) {
          filePath = resolveResult.path;
        } else if (resolveResult.matches) {
          filePath = await showPicker(name, resolveResult.matches);
          if (!filePath) return;
        }

        await createOBSInput(name, filePath, targetScene);
      }

      function showPicker(filename, matches) {
        return new Promise((resolve) => {
          pickerFilename.textContent = `Select the correct "${filename}":`;
          pickerList.innerHTML = '';

          for (const m of matches) {
            const li = document.createElement('li');
            const pathDiv = document.createElement('div');
            pathDiv.className = 'picker-path';
            pathDiv.textContent = m.path;
            li.appendChild(pathDiv);

            const metaDiv = document.createElement('div');
            metaDiv.className = 'picker-meta';
            const sizeKB = Math.round(m.size / 1024);
            const date = new Date(m.modified).toLocaleString();
            metaDiv.textContent = `${sizeKB} KB · ${date}`;
            li.appendChild(metaDiv);

            li.addEventListener('click', () => {
              pickerModal.hidden = true;
              resolve(m.path);
            });
            pickerList.appendChild(li);
          }

          pickerCancel.onclick = () => {
            pickerModal.hidden = true;
            resolve(null);
          };

          pickerModal.hidden = false;
        });
      }

      async function createOBSInput(filename, filePath, targetScene = null) {
        const obs = MS.connection.obs;

        if (targetScene) {
          try {
            const { inputs } = await obs.call('GetInputList');
            const taken = new Set(inputs.map((i) => i.inputName));
            let inputName = filename;
            for (let n = 2; taken.has(inputName); n++) inputName = `${filename} (${n})`;
            // Eye off: a new clip must not appear cued, and nothing in the scene changes until the operator cues it
            const { sceneItemId } = await obs.call('CreateInput', {
              sceneName: targetScene,
              inputName,
              inputKind: 'ffmpeg_source',
              inputSettings: {
                local_file: filePath,
                is_local_file: true,
                restart_on_activate: false,
                close_when_inactive: false,
                clear_on_media_end: false,
              },
              sceneItemEnabled: false,
            });
            await obs.call('SetSceneItemTransform', {
              sceneName: targetScene,
              sceneItemId,
              sceneItemTransform: {
                boundsType: 'OBS_BOUNDS_SCALE_INNER',
                boundsWidth: MS.canvas.width,
                boundsHeight: MS.canvas.height,
                boundsAlignment: 0,
              },
            });
            await obs.call('SetInputAudioMonitorType', {
              inputName,
              monitorType: window.MSPlaylist.routeToMonitorType('both'),
            });
            MS.grid.logEvent(`Added to ${targetScene}: ${filename}`);
          } catch (err) {
            MS.grid.logEvent(`Import failed: ${err.message}`);
            console.error('Import into scene failed:', err);
          }
          return;
        }

        let sceneName = `[MS] ${filename}`;
        let inputName = sceneName;
        try {
          const { scenes } = await obs.call('GetSceneList');
          const { inputs } = await obs.call('GetInputList');
          const sceneNames = new Set(scenes.map((s) => s.sceneName));
          const inputNames = new Set(inputs.map((i) => i.inputName));

          let counter = 1;
          while (sceneNames.has(sceneName) || inputNames.has(inputName)) {
            counter++;
            sceneName = `[MS] ${filename} (${counter})`;
            inputName = sceneName;
          }
        } catch (err) {
          console.error('Failed to check for duplicates:', err);
        }

        try {
          await obs.call('CreateScene', { sceneName });

          const { sceneItemId } = await obs.call('CreateInput', {
            sceneName,
            inputName,
            inputKind: 'ffmpeg_source',
            inputSettings: {
              local_file: filePath,
              is_local_file: true,
              restart_on_activate: false,
              close_when_inactive: false,
              clear_on_media_end: false,
            },
            sceneItemEnabled: true,
          });

          await obs.call('SetSceneItemTransform', {
            sceneName,
            sceneItemId,
            sceneItemTransform: {
              boundsType: 'OBS_BOUNDS_SCALE_INNER',
              boundsWidth: MS.canvas.width,
              boundsHeight: MS.canvas.height,
              boundsAlignment: 0,
            },
          });

          MS.grid.logEvent('Added: ' + filename);
        } catch (err) {
          alert(`Couldn't create scene in OBS. Check that OBS is running and the WebSocket connection is active.\n\n${err.message}`);
        }
      }

      return { importFile };
    })();

    // ===== Init =====
    (function init() {
      // Load fade duration from localStorage
      const savedDuration = localStorage.getItem('ms_transition_duration');
      if (savedDuration) {
        document.getElementById('fade-duration').value = savedDuration;
      }
      document.getElementById('fade-duration').addEventListener('change', (e) => {
        localStorage.setItem('ms_transition_duration', e.target.value);
      });

      document.getElementById('btn-reload').addEventListener('click', () => location.reload());

      // Auto-connect
      const cfg = MS.connection.getConfig();
      MS.connection.connect(cfg.host || 'localhost', cfg.port || 4455, cfg.password || '');
    })();

    // ===== Audio Config Check =====
    // Warns, never blocks: a wrong monitoring device means the room hears the wrong thing.
    MS.audioCheck = (() => {
      const chip = document.getElementById('audio-chip');
      const pop = document.getElementById('audio-pop');

      async function run() {
        if (!MS.connection.connected) { chip.hidden = true; return; }
        const obs = MS.connection.obs;
        const issues = [];
        const expected = MS.store.get().expectedDevice;
        try {
          const { parameterValue } = await obs.call('GetProfileParameter', { parameterCategory: 'Audio', parameterName: 'MonitoringDeviceName' });
          const device = parameterValue ?? 'Default';
          if (device === 'Default') {
            issues.push(`Monitoring Device is Default (follows whatever macOS output is active); expected "${expected}".`);
          } else if (device !== expected) {
            issues.push(`Monitoring Device is "${device}", expected "${expected}".`);
          }
        } catch {
          issues.push('Could not read the Monitoring Device from OBS.');
        }
        try {
          const special = await obs.call('GetSpecialInputs');
          if (special.desktop1 || special.desktop2) {
            issues.push('Desktop Audio is enabled: it captures system audio, including anything you preview on the Mac.');
          }
        } catch {}
        let dup = 'unknown';
        try { dup = (await (await fetch('/api/obs-config')).json()).sceneDuplication; } catch {}
        if (dup === 'false') issues.push('Duplicate Scene is off (per saved OBS config): cueing a scene on Program changes it live.');
        else if (dup !== 'true') issues.push('Can\'t read Duplicate Scene. Restart `npm start` (the server needs the update), then reload this dock.');

        chip.hidden = false;
        chip.className = 'audio-chip ' + (issues.length ? 'warn' : 'ok');
        chip.textContent = issues.length ? `Audio ⚠ ${issues.length}` : 'Audio ✓';
        pop.innerHTML = '';
        const ul = document.createElement('ul');
        for (const text of issues.length ? issues : [`Monitoring Device "${expected}", Desktop Audio off, Duplicate Scene on.`]) {
          const li = document.createElement('li');
          li.textContent = text;
          ul.appendChild(li);
        }
        const note = document.createElement('div');
        note.className = 'small';
        note.textContent = 'Per saved OBS config. Warnings never block a take.';
        pop.append(ul, note);
      }

      // Monitor (House Audio) is what OBS plays clips through; Default Output is the macOS output ("Default" in OBS follows it)
      const bar = document.getElementById('audio-bar');
      const monItem = document.getElementById('audio-monitor');
      const monName = document.getElementById('audio-monitor-name');
      const defItem = document.getElementById('audio-default');
      const defName = document.getElementById('audio-default-name');
      const monPop = document.getElementById('monitor-pop');

      async function readout() {
        if (!MS.connection.connected) { bar.hidden = true; return; }
        let monitor = null;
        try {
          monitor = (await MS.connection.obs.call('GetProfileParameter', { parameterCategory: 'Audio', parameterName: 'MonitoringDeviceName' })).parameterValue || 'Default';
        } catch {}
        let defaultOut = null;
        try { defaultOut = (await (await fetch('/api/audio-devices')).json()).defaultOutput ?? null; } catch {}
        const expected = MS.store.get().expectedDevice;
        const effective = monitor === 'Default' ? defaultOut : monitor;
        bar.hidden = false;
        monName.textContent = monitor === null ? 'unknown' : monitor === 'Default' ? `Default${defaultOut ? ` (${defaultOut})` : ''}` : monitor;
        monName.title = monName.textContent;
        monItem.className = 'audio-item ' + (effective && effective === expected ? 'ok' : 'warn');
        defName.textContent = defaultOut ?? 'unknown';
        defName.title = defName.textContent;
        defItem.className = 'audio-item' + (monitor === 'Default' ? (defaultOut === expected ? ' ok' : ' warn') : '');
      }

      monItem.addEventListener('click', () => {
        const expected = MS.store.get().expectedDevice;
        monPop.innerHTML = '';
        const p1 = document.createElement('div');
        p1.textContent = `Expected house device: "${expected}" (change it in the OBS Connection dialog).`;
        const p2 = document.createElement('div');
        p2.className = 'small';
        p2.textContent = 'To change the Monitoring Device: OBS > Settings > Audio > Advanced > Monitoring Device. OBS only applies it from Settings, so MediaSheet can show it but not change it. "Default" follows the macOS output shown as Default Output.';
        monPop.append(p1, p2);
        monPop.hidden = !monPop.hidden;
      });
      document.addEventListener('click', (e) => { if (!monItem.contains(e.target) && !monPop.contains(e.target)) monPop.hidden = true; });

      chip.addEventListener('click', () => { pop.hidden = !pop.hidden; });
      document.addEventListener('click', (e) => { if (e.target !== chip && !pop.contains(e.target)) pop.hidden = true; });
      setInterval(() => { run().catch(() => {}); readout().catch(() => {}); }, 15000);

      return { run: () => Promise.all([run(), readout()]) };
    })();

    // ===== Hold Last Frame =====
    // OBS clears a media source to black when playback ends unless clear_on_media_end is false.
    // Patches every ffmpeg_source in OBS, including ones MediaSheet didn't import.
    MS.holdFrames = (() => {
      const btn = document.getElementById('btn-hold-frames');

      btn.addEventListener('click', async () => {
        const obs = MS.connection.obs;
        btn.disabled = true;
        try {
          const { inputs } = await obs.call('GetInputList', { inputKind: 'ffmpeg_source' });
          // Read-first: only touch sources whose effective value differs. Safe on live clips (settings updates don't restart them).
          const results = await Promise.allSettled(inputs.map((input) =>
            MS.manager.normalizeInput(input.inputName, { clear_on_media_end: false })));
          const failed = results.filter((r) => r.status === 'rejected').length;
          const changed = results.filter((r) => r.status === 'fulfilled' && r.value).length;
          MS.grid.logEvent(`Hold last frame: ${changed} changed, ${inputs.length - changed - failed} already set${failed ? `, ${failed} failed` : ''}`);
        } catch (err) {
          console.error('Hold frames failed:', err);
          MS.grid.logEvent(`Hold frames failed: ${err.message}`);
        } finally {
          btn.disabled = !MS.connection.connected;
        }
      });
    })();

    // ===== Server Health Check =====
    (function serverHealthCheck() {
      const statusEl = document.getElementById('server-status');
      const btnAdd = document.getElementById('btn-add-input');
      let serverUp = true;

      setInterval(async () => {
        try {
          const resp = await fetch('/', { method: 'HEAD' });
          if (!serverUp) {
            serverUp = true;
            statusEl.hidden = true;
            // Re-enable Add Input if OBS is connected
            if (MS.connection.connected) btnAdd.disabled = false;
          }
        } catch {
          if (serverUp) {
            serverUp = false;
            statusEl.hidden = false;
            btnAdd.disabled = true;
          }
        }
      }, 10000);
    })();

    // ===== Browser Tab Sleep Recovery =====
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (MS.connection.connected) {
        // Verify connection is still alive, then rebuild
        MS.connection.obs.call('GetVersion')
          .then(() => MS.grid.rebuild())
          .catch(() => {
            // Connection is stale — disconnect will trigger reconnect loop
            MS.connection.obs.disconnect();
          });
      }
    });
  </script>
</body>
